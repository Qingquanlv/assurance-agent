# pyproject.toml
[project]
name = "assurance-agent"
description = "Assurance Agent - AI-driven QA workflow orchestrator (deterministic CLI + skill suite)"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "assurance-kernel",
]

[project.scripts]
aa = "assurance_agent.cli:main"

[project.entry-points."assurance_agent.products"]
assurance = "assurance_agent.assurance_product:AssuranceProduct"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pyright>=1.1.380",
    "import-linter>=2.0",
    "mutmut>=3.7.0",
    "aa-sample-product",
    "graph-engine",
    "graph-engine-toy-a",
    "graph-engine-toy-b",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assurance_agent"]
# _resources 含非 .py 文件（schemas/skills/opencode），hatchling 默认包含包内数据文件；
# artifacts 声明确保被 .gitignore 模式覆盖的资源也入包。
artifacts = ["assurance_agent/_resources/**"]
# scripts/ 是 dev 工具（migrate_skills.py 等），显式排除以防误入包。
exclude = ["scripts", "/scripts/**"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/graph-engine/tests"]
# Sibling packages under tests/unit/workflow/{issues,improvements}/ share basenames
# (test_review.py, …); importlib avoids prepend-mode module collisions.
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["benchmark/vue-fastapi-admin", ".worktrees", ".history"]

[tool.pyright]
include = ["assurance_agent", "packages/assurance-kernel/assurance_kernel", "packages/graph-engine/graph_engine", "tests", "benchmark/specialty"]
extraPaths = [".", "packages/assurance-kernel"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.uv.workspace]
members = [
    "packages/assurance-kernel",
    "packages/graph-engine",
    "examples/minimal-product",
    "examples/graph-engine-toy-a",
    "examples/graph-engine-toy-b",
]

[tool.uv.sources]
aa-sample-product = { workspace = true }
assurance-kernel = { workspace = true }
graph-engine = { workspace = true }
graph-engine-toy-a = { workspace = true }
graph-engine-toy-b = { workspace = true }
