# pyproject.toml
[project]
name = "assurance-workspace"
description = "Private development workspace for the Assurance graph product"
version = "0.2.0"
readme = "README.md"
requires-python = ">=3.11,<4.0"

[dependency-groups]
verification-runner = ["pytest==9.1.1", "pytest-json-report==1.5.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pyright>=1.1.380",
    "import-linter>=2.0",
    "mutmut>=3.7.0",
    "click>=8.1",
    "httpx>=0.27",
    "packaging>=24",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "aa-sample-product",
    "graph-engine",
    "graph-engine-toy-a",
    "graph-engine-toy-b",
    "agent-runtime-contracts",
    "agent-runtime-opencode",
    "agent-runtime-fixture",
    "assurance-intake",
    "assurance-generation",
    "assurance-execution",
    "assurance-healing",
    "assurance-quality",
    "assurance-improvement",
    "assurance-telemetry",
    "assurance-product",
]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/framework/graph-engine/tests", "packages/adapters/agent-runtime-contracts/tests", "packages/adapters/agent-runtime-opencode/tests", "packages/capabilities/assurance-intake/tests", "packages/capabilities/assurance-generation/tests", "packages/capabilities/assurance-execution/tests", "packages/capabilities/assurance-healing/tests", "packages/capabilities/assurance-quality/tests", "packages/capabilities/assurance-improvement/tests", "packages/capabilities/assurance-telemetry/tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]
markers = [
    "asyncio: async test executed by the local tests/agent_runtime hook",
    "phase4: Phase 4 capability-extraction ownership and composition tests",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [
    "benchmark/vue-fastapi-admin",
    "benchmark/assurance-product/fixtures/user-oracle/sut-source",
    "benchmark/**/results",
    "tmp",
    ".worktrees",
    ".history",
]

[tool.pyright]
include = ["packages/framework/graph-engine/graph_engine", "packages/adapters/agent-runtime-contracts/agent_runtime_contracts", "packages/adapters/agent-runtime-opencode/agent_runtime_opencode", "examples/agent-runtime-fixture/agent_runtime_fixture", "packages/capabilities/assurance-intake", "packages/capabilities/assurance-generation", "packages/capabilities/assurance-execution", "packages/capabilities/assurance-healing", "packages/capabilities/assurance-quality", "packages/capabilities/assurance-improvement", "packages/capabilities/assurance-telemetry", "packages/products/assurance-product", "tests", "benchmark/agent-runtime-phase3"]
extraPaths = ["."]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/capabilities/assurance-intake",
    "packages/capabilities/assurance-generation",
    "packages/capabilities/assurance-execution",
    "packages/capabilities/assurance-healing",
    "packages/capabilities/assurance-quality",
    "packages/capabilities/assurance-improvement",
    "packages/capabilities/assurance-telemetry",
    "packages/products/assurance-product",
    "packages/framework/graph-engine",
    "packages/adapters/agent-runtime-contracts",
    "packages/adapters/agent-runtime-opencode",
    "examples/minimal-product",
    "examples/graph-engine-toy-a",
    "examples/graph-engine-toy-b",
    "examples/agent-runtime-fixture",
]

[tool.uv.sources]
aa-sample-product = { workspace = true }
assurance-intake = { workspace = true }
assurance-generation = { workspace = true }
assurance-execution = { workspace = true }
assurance-healing = { workspace = true }
assurance-quality = { workspace = true }
assurance-improvement = { workspace = true }
assurance-telemetry = { workspace = true }
assurance-product = { workspace = true }
graph-engine = { workspace = true }
graph-engine-toy-a = { workspace = true }
graph-engine-toy-b = { workspace = true }
agent-runtime-contracts = { workspace = true }
agent-runtime-opencode = { workspace = true }
agent-runtime-fixture = { workspace = true }
