[project]
name = "aa-sample-product"
version = "0.1.0"
requires-python = ">=3.11,<4.0"
dependencies = ["assurance-agent"]

[project.entry-points."assurance_agent.products"]
sample = "aa_sample.product:SampleProduct"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aa_sample"]
artifacts = ["aa_sample/_resources/**"]
