name: sample
entrypoints:
  ping: {graph: main, restart: repeatable}
policies:
  retry:
    never: {max_attempts: 1, retry_on: []}
  timeout:
    local: {run_seconds: 60, heartbeat_seconds: 10}
  scheduler: {max_parallel_tasks: 1}
graphs:
  main:
    max_supersteps: 4
    nodes:
      ping:
        uses: operation:sample-ping
        retry: never
        timeout: local
    edges:
      - {from: START, to: ping}
      - {from: ping, to: END}
gates: {}
