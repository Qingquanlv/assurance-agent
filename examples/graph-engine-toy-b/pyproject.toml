[project]
name = "graph-engine-toy-b"
version = "1.0.0"
requires-python = ">=3.11,<4.0"
dependencies = ["graph-engine", "langgraph==1.2.11"]

[project.entry-points."graph_engine.products"]
toy-b = "graph_engine_toy_b.product:ToyBProduct"

[project.entry-points."graph_engine.plugins"]
toy-b = "graph_engine_toy_b.plugin:ToyBPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graph_engine_toy_b"]

[tool.uv.sources]
graph-engine = { workspace = true }
