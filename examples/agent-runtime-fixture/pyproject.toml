[project]
name = "agent-runtime-fixture"
version = "1.0.0"
description = "Neutral installed capability/product fixture for explicit adapter rebinding"
requires-python = ">=3.11,<4.0"
dependencies = [
    "agent-runtime-contracts",
    "graph-engine",
    "langgraph==1.2.11",
]

[project.entry-points."graph_engine.products"]
fixture = "agent_runtime_fixture.product:FixtureProduct"

[project.entry-points."graph_engine.plugins"]
fixture = "agent_runtime_fixture.plugin:FixturePlugin"
opencode-binding = "agent_runtime_fixture.bindings:OpenCodeBindingPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_runtime_fixture"]

[tool.uv.sources]
agent-runtime-contracts = { workspace = true }
graph-engine = { workspace = true }
