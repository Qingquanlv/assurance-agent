[project]
name = "assurance-intake"
version = "0.1.0"
description = "Assurance intake capability wheel"
requires-python = ">=3.11,<4.0"
dependencies = [
    "graph-engine",
    "pydantic>=2.7",
]

[project.entry-points."graph_engine.plugins"]
intake = "assurance_intake.plugin:IntakePlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assurance_intake"]

[tool.uv.sources]
graph-engine = { workspace = true }
