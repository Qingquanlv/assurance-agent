[project]
name = "assurance-improvement"
version = "0.2.0"
description = "Assurance improvement capability wheel"
requires-python = ">=3.11,<4.0"
dependencies = [
    "agent-runtime-contracts",
    "assurance-intake==0.2.0",
    "assurance-generation==0.2.0",
    "assurance-execution==0.2.0",
    "assurance-healing==0.2.0",
    "assurance-quality==0.2.0",
    "graph-engine",
    "pydantic>=2.7",
]

[project.entry-points."graph_engine.plugins"]
improvement = "assurance_improvement.plugin:ImprovementPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assurance_improvement"]

[tool.uv.sources]
agent-runtime-contracts = { workspace = true }
assurance-intake = { workspace = true }
assurance-generation = { workspace = true }
assurance-execution = { workspace = true }
assurance-healing = { workspace = true }
assurance-quality = { workspace = true }
graph-engine = { workspace = true }
