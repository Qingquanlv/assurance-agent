schema_version: "1"
role: feature
owner_id: assurance.improvement
module_id: assurance.improvement.workflow
module_version: 0.1.0
imports: {}
exports:
  archive:
    graph: archive
    input_schema: assurance.improvement.workflow.archive.input.v1
    output_schema: assurance.improvement.workflow.archive.output.v1
    output_projection: &lifecycle-output
      type: object
      fields:
        change_id:
          type: child_output_pointer
          pointer: /change_id
        evidence_refs:
          type: child_output_pointer
          pointer: /evidence_refs
        lifecycle_state:
          type: child_output_pointer
          pointer: /lifecycle_state
  retro:
    graph: retro
    input_schema: assurance.improvement.workflow.retro.input.v1
    output_schema: assurance.improvement.workflow.retro.output.v1
    output_projection: *lifecycle-output
  review:
    graph: improvement-review
    input_schema: assurance.improvement.workflow.review.input.v1
    output_schema: assurance.improvement.workflow.review.output.v1
    output_projection: *lifecycle-output
  evaluate:
    graph: improvement-evaluate
    input_schema: assurance.improvement.workflow.evaluate.input.v1
    output_schema: assurance.improvement.workflow.evaluate.output.v1
    output_projection: &receipt-output
      type: object
      fields:
        change_id:
          type: child_output_pointer
          pointer: /change_id
        lifecycle_state:
          type: child_output_pointer
          pointer: /lifecycle_state
        receipt_refs:
          type: child_output_pointer
          pointer: /receipt_refs
  export:
    graph: improvement-export
    input_schema: assurance.improvement.workflow.export.input.v1
    output_schema: assurance.improvement.workflow.export.output.v1
    output_projection: *receipt-output
  apply:
    graph: improvement-apply
    input_schema: assurance.improvement.workflow.apply.input.v1
    output_schema: assurance.improvement.workflow.apply.output.v1
    output_projection:
      type: object
      fields:
        change_id:
          type: child_output_pointer
          pointer: /change_id
        lifecycle_state:
          type: child_output_pointer
          pointer: /lifecycle_state
        outcome:
          type: child_output_pointer
          pointer: /outcome
        receipt_refs:
          type: child_output_pointer
          pointer: /receipt_refs
  rollback:
    graph: improvement-rollback
    input_schema: assurance.improvement.workflow.rollback.input.v1
    output_schema: assurance.improvement.workflow.rollback.output.v1
    output_projection:
      type: object
      fields:
        change_id:
          type: child_output_pointer
          pointer: /change_id
        lifecycle_state:
          type: child_output_pointer
          pointer: /lifecycle_state
        outcome:
          type: child_output_pointer
          pointer: /outcome
        receipt_refs:
          type: child_output_pointer
          pointer: /receipt_refs
capability_slots:
  archive.prepare:
    contract_id: assurance.improvement.agent.archive.v1
  archive.execute:
    contract_id: assurance.improvement.agent.archive.v1
  archive.finalize:
    contract_id: assurance.improvement.agent.archive.v1
  improvement-review.prepare:
    contract_id: assurance.improvement.agent.improvement-review.v1
  improvement-review.execute:
    contract_id: assurance.improvement.agent.improvement-review.v1
  improvement-review.finalize:
    contract_id: assurance.improvement.agent.improvement-review.v1
  retro-eval-analysis.prepare:
    contract_id: assurance.improvement.agent.retro-eval-analysis.v1
  retro-eval-analysis.execute:
    contract_id: assurance.improvement.agent.retro-eval-analysis.v1
  retro-eval-analysis.finalize:
    contract_id: assurance.improvement.agent.retro-eval-analysis.v1
  retro-issue-analysis.prepare:
    contract_id: assurance.improvement.agent.retro-issue-analysis.v1
  retro-issue-analysis.execute:
    contract_id: assurance.improvement.agent.retro-issue-analysis.v1
  retro-issue-analysis.finalize:
    contract_id: assurance.improvement.agent.retro-issue-analysis.v1
  retro-workflow-analysis.prepare:
    contract_id: assurance.improvement.agent.retro-workflow-analysis.v1
  retro-workflow-analysis.execute:
    contract_id: assurance.improvement.agent.retro-workflow-analysis.v1
  retro-workflow-analysis.finalize:
    contract_id: assurance.improvement.agent.retro-workflow-analysis.v1
  retro.prepare:
    contract_id: assurance.improvement.agent.retro.v1
  retro.execute:
    contract_id: assurance.improvement.agent.retro.v1
  retro.finalize:
    contract_id: assurance.improvement.agent.retro.v1
schemas:
  - assurance.improvement.workflow.apply.input.v1
  - assurance.improvement.workflow.apply.output.v1
  - assurance.improvement.workflow.archive.input.v1
  - assurance.improvement.workflow.archive.output.v1
  - assurance.improvement.workflow.evaluate.input.v1
  - assurance.improvement.workflow.evaluate.output.v1
  - assurance.improvement.workflow.export.input.v1
  - assurance.improvement.workflow.export.output.v1
  - assurance.improvement.workflow.retro.input.v1
  - assurance.improvement.workflow.retro.output.v1
  - assurance.improvement.workflow.review.input.v1
  - assurance.improvement.workflow.review.output.v1
  - assurance.improvement.workflow.rollback.input.v1
  - assurance.improvement.workflow.rollback.output.v1
resources: []
effects: []
retry:
  once:
    max_attempts: 1
timeout:
  short:
    run_seconds: 3600
graphs:
  archive:
    max_activations: 4
    start: archive
    nodes:
      archive:
        kind: subgraph
        graph: improvement-archive
        input_projection: &child-input
          type: object
          fields:
            allowed_artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            evidence_refs:
              type: graph_input_pointer
              pointer: /evidence_refs
            lifecycle_state:
              type: graph_input_pointer
              pointer: /lifecycle_state
      done:
        kind: end
    edges:
      - {from: archive, to: done}
  improvement-archive:
    max_activations: 8
    start: prepare
    nodes:
      prepare:
        kind: task
        capability: assurance.improvement.archive.prepare
        input: &prepare-input
          capability_leafs: []
        input_projection: &prepare-projection
          type: object
          fields:
            artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            evidence_refs:
              type: graph_input_pointer
              pointer: /evidence_refs
            lifecycle_state:
              type: graph_input_pointer
              pointer: /lifecycle_state
        retry: once
        timeout: short
      execute:
        kind: task
        capability_slot: archive.execute
        input_projection:
          type: predecessor
          predecessor: prepare
        retry: once
        timeout: short
      finalize:
        kind: task
        capability: assurance.improvement.archive.finalize
        input: *prepare-input
        input_projection: &finalize-projection
          type: object
          fields:
            agent_result:
              type: predecessor
              predecessor: execute
            artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            evidence_refs:
              type: graph_input_pointer
              pointer: /evidence_refs
            lifecycle_state:
              type: graph_input_pointer
              pointer: /lifecycle_state
        retry: once
        timeout: short
      done:
        kind: end
    edges:
      - {from: prepare, to: execute}
      - {from: execute, to: finalize}
      - {from: finalize, to: done}
  retro:
    max_activations: 16
    start: collect
    nodes:
      collect:
        kind: task
        capability: assurance.improvement.retro-collect-v3
        input_projection: &public-input
          type: object
          fields:
            allowed_artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            evidence_refs:
              type: graph_input_pointer
              pointer: /evidence_refs
            lifecycle_state:
              type: graph_input_pointer
              pointer: /lifecycle_state
        retry: once
        timeout: short
      retro:
        kind: subgraph
        graph: improvement-retro
        input_projection: *child-input
      retro-eval-analysis:
        kind: subgraph
        graph: improvement-retro-eval-analysis
        input_projection: *child-input
      retro-issue-analysis:
        kind: subgraph
        graph: improvement-retro-issue-analysis
        input_projection: *child-input
      retro-workflow-analysis:
        kind: subgraph
        graph: improvement-retro-workflow-analysis
        input_projection: *child-input
      reconcile:
        kind: task
        capability: assurance.improvement.reconcile-improvements
        input_projection: *public-input
        retry: once
        timeout: short
      done:
        kind: end
    edges:
      - {from: collect, to: retro}
      - {from: retro, to: retro-eval-analysis}
      - {from: retro-eval-analysis, to: retro-issue-analysis}
      - {from: retro-issue-analysis, to: retro-workflow-analysis}
      - {from: retro-workflow-analysis, to: reconcile}
      - {from: reconcile, to: done}
  improvement-retro:
    max_activations: 8
    start: prepare
    nodes:
      prepare:
        kind: task
        capability: assurance.improvement.retro.prepare
        input: *prepare-input
        input_projection: *prepare-projection
        retry: once
        timeout: short
      execute:
        kind: task
        capability_slot: retro.execute
        input_projection:
          type: predecessor
          predecessor: prepare
        retry: once
        timeout: short
      finalize:
        kind: task
        capability: assurance.improvement.retro.finalize
        input: *prepare-input
        input_projection: *finalize-projection
        retry: once
        timeout: short
      done:
        kind: end
    edges:
      - {from: prepare, to: execute}
      - {from: execute, to: finalize}
      - {from: finalize, to: done}
  improvement-retro-eval-analysis:
    max_activations: 8
    start: prepare
    nodes:
      prepare:
        kind: task
        capability: assurance.improvement.retro-eval-analysis.prepare
        input: *prepare-input
        input_projection: *prepare-projection
        retry: once
        timeout: short
      execute:
        kind: task
        capability_slot: retro-eval-analysis.execute
        input_projection:
          type: predecessor
          predecessor: prepare
        retry: once
        timeout: short
      finalize:
        kind: task
        capability: assurance.improvement.retro-eval-analysis.finalize
        input: *prepare-input
        input_projection: *finalize-projection
        retry: once
        timeout: short
      done:
        kind: end
    edges:
      - {from: prepare, to: execute}
      - {from: execute, to: finalize}
      - {from: finalize, to: done}
  improvement-retro-issue-analysis:
    max_activations: 8
    start: prepare
    nodes:
      prepare:
        kind: task
        capability: assurance.improvement.retro-issue-analysis.prepare
        input: *prepare-input
        input_projection: *prepare-projection
        retry: once
        timeout: short
      execute:
        kind: task
        capability_slot: retro-issue-analysis.execute
        input_projection:
          type: predecessor
          predecessor: prepare
        retry: once
        timeout: short
      finalize:
        kind: task
        capability: assurance.improvement.retro-issue-analysis.finalize
        input: *prepare-input
        input_projection: *finalize-projection
        retry: once
        timeout: short
      done:
        kind: end
    edges:
      - {from: prepare, to: execute}
      - {from: execute, to: finalize}
      - {from: finalize, to: done}
  improvement-retro-workflow-analysis:
    max_activations: 8
    start: prepare
    nodes:
      prepare:
        kind: task
        capability: assurance.improvement.retro-workflow-analysis.prepare
        input: *prepare-input
        input_projection: *prepare-projection
        retry: once
        timeout: short
      execute:
        kind: task
        capability_slot: retro-workflow-analysis.execute
        input_projection:
          type: predecessor
          predecessor: prepare
        retry: once
        timeout: short
      finalize:
        kind: task
        capability: assurance.improvement.retro-workflow-analysis.finalize
        input: *prepare-input
        input_projection: *finalize-projection
        retry: once
        timeout: short
      done:
        kind: end
    edges:
      - {from: prepare, to: execute}
      - {from: execute, to: finalize}
      - {from: finalize, to: done}
  improvement-review:
    max_activations: 8
    start: prepare
    nodes:
      prepare:
        kind: task
        capability: assurance.improvement.improvement-review.prepare
        input: *prepare-input
        input_projection: *prepare-projection
        retry: once
        timeout: short
      execute:
        kind: task
        capability_slot: improvement-review.execute
        input_projection:
          type: predecessor
          predecessor: prepare
        retry: once
        timeout: short
      finalize:
        kind: task
        capability: assurance.improvement.improvement-review.finalize
        input: *prepare-input
        input_projection: *finalize-projection
        retry: once
        timeout: short
      done:
        kind: end
    edges:
      - {from: prepare, to: execute}
      - {from: execute, to: finalize}
      - {from: finalize, to: done}
  improvement-evaluate:
    max_activations: 4
    start: evaluate
    nodes:
      evaluate:
        kind: task
        capability: assurance.improvement.evaluate-memory-improvement
        input_projection: *public-input
        retry: once
        timeout: short
      done:
        kind: end
    edges:
      - {from: evaluate, to: done}
  improvement-export:
    max_activations: 4
    start: export
    nodes:
      export:
        kind: task
        capability: assurance.improvement.export-change-improvement
        input_projection: *public-input
        retry: once
        timeout: short
      done:
        kind: end
    edges:
      - {from: export, to: done}
  improvement-apply:
    max_activations: 8
    start: review
    nodes:
      review:
        kind: subgraph
        graph: improvement-review
        input_projection: *child-input
        routing: {mode: fanout, min_matches: 2}
      review-human-gate:
        kind: gate
        expression: "decision != 'pass' and decision != 'approved'"
        input_projection: &apply-review-decision
          type: object
          fields:
            decision:
              type: predecessor_pointer
              predecessor: review
              pointer: /decision
      review-pass-gate:
        kind: gate
        expression: "decision == 'pass' or decision == 'approved'"
        input_projection: *apply-review-decision
      human-review:
        kind: interrupt
        reason: needs_human_review
        actions: [approve, reject]
      apply:
        kind: task
        capability: assurance.improvement.apply-memory-improvement
        input_projection: *public-input
        retry: once
        timeout: short
      done:
        kind: end
    edges:
      - {from: review, to: review-human-gate}
      - {from: review, to: review-pass-gate}
      - {from: review-human-gate, to: human-review, condition: 'output.value == true'}
      - {from: review-pass-gate, to: apply, condition: 'output.value == true'}
      - {from: human-review, to: apply}
      - {from: apply, to: done}
  improvement-rollback:
    max_activations: 4
    start: rollback
    nodes:
      rollback:
        kind: task
        capability: assurance.improvement.rollback-memory-improvement
        input_projection: *public-input
        retry: once
        timeout: short
      done:
        kind: end
    edges:
      - {from: rollback, to: done}
