schema_version: "1"
role: feature
owner_id: assurance.intake
module_id: assurance.intake.workflow
module_version: 0.1.0
imports: {}
exports:
  prepare:
    graph: entry
    input_schema: assurance.intake.workflow.prepare.input.v1
    output_schema: assurance.intake.workflow.prepare.output.v1
    output_projection:
      type: object
      fields:
        artifacts:
          type: child_output_pointer
          pointer: /artifacts
        decision:
          type: child_output_pointer
          pointer: /decision
  case:
    graph: case
    input_schema: assurance.intake.workflow.case.input.v1
    output_schema: assurance.intake.workflow.case.output.v1
    output_projection:
      type: object
      fields:
        artifacts:
          type: child_output_pointer
          pointer: /artifacts
        decision:
          type: child_output_pointer
          pointer: /decision
capability_slots:
  case-design.execute:
    contract_id: assurance.intake.agent.case-design.v1
  case-design.finalize:
    contract_id: assurance.intake.agent.case-design.v1
  case-design.prepare:
    contract_id: assurance.intake.agent.case-design.v1
  case-review.execute:
    contract_id: assurance.intake.agent.case-review.v1
  case-review.finalize:
    contract_id: assurance.intake.agent.case-review.v1
  case-review.prepare:
    contract_id: assurance.intake.agent.case-review.v1
  explore.execute:
    contract_id: assurance.intake.agent.explore.v1
  explore.finalize:
    contract_id: assurance.intake.agent.explore.v1
  explore.prepare:
    contract_id: assurance.intake.agent.explore.v1
  intake.execute:
    contract_id: assurance.intake.agent.intake.v1
  intake.finalize:
    contract_id: assurance.intake.agent.intake.v1
  intake.prepare:
    contract_id: assurance.intake.agent.intake.v1
schemas:
  - assurance.intake.workflow.case.input.v1
  - assurance.intake.workflow.case.output.v1
  - assurance.intake.workflow.prepare.input.v1
  - assurance.intake.workflow.prepare.output.v1
resources: []
effects: []
retry:
  once:
    max_attempts: 1
timeout:
  short:
    run_seconds: 3600
graphs:
  entry:
    max_activations: 32
    start: intake
    nodes:
      intake:
        kind: subgraph
        graph: intake
        input_projection:
          type: object
          fields:
            allowed_artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            requirement:
              type: graph_input_pointer
              pointer: /requirement
      explore:
        kind: subgraph
        graph: explore
        input_projection:
          type: object
          fields:
            allowed_artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            change_id:
              type: graph_input_pointer
              pointer: /change_id
      case-design:
        kind: subgraph
        graph: case-design
        input_projection: &case_design_input
          type: object
          fields:
            allowed_artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            case_delta_paths:
              type: graph_input_pointer
              pointer: /case_delta_paths
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            selected_test_families:
              type: graph_input_pointer
              pointer: /selected_test_families
      case-review:
        kind: subgraph
        graph: case-review
        input_projection: &case_review_input
          type: object
          fields:
            allowed_artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            case_delta_paths:
              type: graph_input_pointer
              pointer: /case_delta_paths
            change_id:
              type: graph_input_pointer
              pointer: /change_id
        routing:
          mode: fanout
          min_matches: 3
      review-pass-gate:
        kind: gate
        expression: "(decision == 'pass' or decision == 'approved') and human_review_required == false"
        input_projection: &review_gate_input
          type: object
          fields:
            decision:
              type: predecessor_pointer
              predecessor: case-review
              pointer: /decision
            auto_fix_allowed:
              type: predecessor_pointer
              predecessor: case-review
              pointer: /auto_fix_allowed
            human_review_required:
              type: predecessor_pointer
              predecessor: case-review
              pointer: /human_review_required
      review-fix-gate:
        kind: gate
        expression: "(decision == 'needs_fix' or decision == 'changes_requested') and auto_fix_allowed == true and human_review_required == false"
        input_projection: *review_gate_input
      review-human-gate:
        kind: gate
        expression: "not (((decision == 'pass' or decision == 'approved') and human_review_required == false) or ((decision == 'needs_fix' or decision == 'changes_requested') and auto_fix_allowed == true and human_review_required == false))"
        input_projection: *review_gate_input
      human-review:
        kind: interrupt
        reason: needs_human_review
        actions:
          - approve
          - reject
      done:
        kind: end
    edges:
      - {from: intake, to: explore}
      - {from: explore, to: case-design}
      - {from: case-design, to: case-review}
      - {from: case-review, to: review-pass-gate}
      - {from: case-review, to: review-fix-gate}
      - {from: case-review, to: review-human-gate}
      - {from: review-fix-gate, to: case-design, condition: output.value == true}
      - {from: review-human-gate, to: human-review, condition: output.value == true}
      - {from: review-pass-gate, to: done, condition: output.value == true}
      - {from: human-review, to: done}
  case:
    max_activations: 6
    start: case-design
    nodes:
      case-design:
        kind: subgraph
        graph: case-design
        input_projection: *case_design_input
      case-review:
        kind: subgraph
        graph: case-review
        input_projection: *case_review_input
      done:
        kind: end
    edges:
      - {from: case-design, to: case-review}
      - {from: case-review, to: done}
  intake:
    max_activations: 8
    start: prepare
    nodes:
      prepare:
        kind: task
        capability: assurance.intake.intake.prepare
        input:
          capability_leafs: []
        input_projection:
          type: object
          fields:
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            requirement:
              type: graph_input_pointer
              pointer: /requirement
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
        retry: once
        timeout: short
      execute:
        kind: task
        capability_slot: intake.execute
        input_projection:
          type: predecessor
          predecessor: prepare
        retry: once
        timeout: short
      finalize:
        kind: task
        capability: assurance.intake.intake.finalize
        input:
          capability_leafs: []
        input_projection:
          type: object
          fields:
            agent_result:
              type: predecessor
              predecessor: execute
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
        retry: once
        timeout: short
      done:
        kind: end
    edges:
      - {from: prepare, to: execute}
      - {from: execute, to: finalize}
      - {from: finalize, to: done}
  explore:
    max_activations: 8
    start: prepare
    nodes:
      prepare:
        kind: task
        capability: assurance.intake.explore.prepare
        input:
          capability_leafs: []
        input_projection:
          type: object
          fields:
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
        resources:
          parameters:
            change_id: /change_id
          reads:
            - qa
          writes:
            - qa/changes/{change_id}/explore/context.json
        retry: once
        timeout: short
      execute:
        kind: task
        capability_slot: explore.execute
        input_projection:
          type: predecessor
          predecessor: prepare
        retry: once
        timeout: short
      finalize:
        kind: task
        capability: assurance.intake.explore.finalize
        input:
          capability_leafs: []
        input_projection:
          type: object
          fields:
            agent_result:
              type: predecessor
              predecessor: execute
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
        retry: once
        timeout: short
      done:
        kind: end
    edges:
      - {from: prepare, to: execute}
      - {from: execute, to: finalize}
      - {from: finalize, to: done}
  case-design:
    max_activations: 8
    start: prepare
    nodes:
      prepare:
        kind: task
        capability: assurance.intake.case-design.prepare
        input:
          capability_leafs: []
        input_projection:
          type: object
          fields:
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            selected_test_families:
              type: graph_input_pointer
              pointer: /selected_test_families
            case_delta_paths:
              type: graph_input_pointer
              pointer: /case_delta_paths
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
        retry: once
        timeout: short
      execute:
        kind: task
        capability_slot: case-design.execute
        input_projection:
          type: predecessor
          predecessor: prepare
        retry: once
        timeout: short
      finalize:
        kind: task
        capability: assurance.intake.case-design.finalize
        input:
          capability_leafs: []
        input_projection:
          type: object
          fields:
            agent_result:
              type: predecessor
              predecessor: execute
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            selected_test_families:
              type: graph_input_pointer
              pointer: /selected_test_families
            case_delta_paths:
              type: graph_input_pointer
              pointer: /case_delta_paths
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
        retry: once
        timeout: short
      done:
        kind: end
    edges:
      - {from: prepare, to: execute}
      - {from: execute, to: finalize}
      - {from: finalize, to: done}
  case-review:
    max_activations: 8
    start: prepare
    nodes:
      prepare:
        kind: task
        capability: assurance.intake.case-review.prepare
        input:
          capability_leafs: []
        input_projection:
          type: object
          fields:
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            case_delta_paths:
              type: graph_input_pointer
              pointer: /case_delta_paths
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
        retry: once
        timeout: short
      execute:
        kind: task
        capability_slot: case-review.execute
        input_projection:
          type: predecessor
          predecessor: prepare
        retry: once
        timeout: short
      finalize:
        kind: task
        capability: assurance.intake.case-review.finalize
        input:
          capability_leafs: []
        input_projection:
          type: object
          fields:
            agent_result:
              type: predecessor
              predecessor: execute
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
        retry: once
        timeout: short
      done:
        kind: end
    edges:
      - {from: prepare, to: execute}
      - {from: execute, to: finalize}
      - {from: finalize, to: done}
