[project]
name = "assurance-execution"
version = "0.2.0"
description = "Assurance execution capability wheel"
requires-python = ">=3.11,<4.0"
dependencies = [
    "agent-runtime-contracts",
    "assurance-generation==0.2.0",
    "assurance-intake==0.2.0",
    "graph-engine",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.entry-points."graph_engine.plugins"]
execution = "assurance_execution.plugin:ExecutionPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assurance_execution"]

[tool.uv.sources]
agent-runtime-contracts = { workspace = true }
assurance-generation = { workspace = true }
assurance-intake = { workspace = true }
graph-engine = { workspace = true }
