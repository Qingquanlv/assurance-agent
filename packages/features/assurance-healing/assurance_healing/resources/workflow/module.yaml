schema_version: "1"
role: feature
owner_id: assurance.healing
module_id: assurance.healing.workflow
module_version: 0.2.0
imports: {}
exports:
  repair-failure:
    graph: healing-fix-proposal
    input_schema: assurance.healing.workflow.repair-failure.input.v1
    output_schema: assurance.healing.workflow.repair-failure.output.v1
    output_projection: &repair-output
      type: object
      fields:
        change_id:
          type: child_output_pointer
          pointer: /change_id
        effect_refs:
          type: child_output_pointer
          pointer: /effect_refs
        kind:
          type: child_output_pointer
          pointer: /kind
        rounds_budget:
          type: child_output_pointer
          pointer: /rounds_budget
        rounds_used:
          type: child_output_pointer
          pointer: /rounds_used
        status:
          type: child_output_pointer
          pointer: /status
  repair-coverage:
    graph: healing-coverage-repair
    input_schema: assurance.healing.workflow.repair-coverage.input.v1
    output_schema: assurance.healing.workflow.repair-coverage.output.v1
    output_projection: *repair-output
capability_slots:
  coverage-repair.prepare:
    contract_id: assurance.healing.agent.coverage-repair.v1
  coverage-repair.execute:
    contract_id: assurance.healing.agent.coverage-repair.v1
  coverage-repair.finalize:
    contract_id: assurance.healing.agent.coverage-repair.v1
  fix-proposal.prepare:
    contract_id: assurance.healing.agent.fix-proposal.v1
  fix-proposal.execute:
    contract_id: assurance.healing.agent.fix-proposal.v1
  fix-proposal.finalize:
    contract_id: assurance.healing.agent.fix-proposal.v1
schemas:
  - assurance.healing.workflow.repair-coverage.input.v1
  - assurance.healing.workflow.repair-coverage.output.v1
  - assurance.healing.workflow.repair-failure.input.v1
  - assurance.healing.workflow.repair-failure.output.v1
resources: []
effects: []
retry:
  once:
    max_attempts: 1
timeout:
  short:
    run_seconds: 3600
graphs:
  healing-fix-proposal:
    max_activations: 8
    start: admit
    nodes:
      admit:
        kind: gate
        expression: "(classification == 'test' or classification == 'test-data') and fix_eligible == true and rounds_used < rounds_budget"
        input_projection: &admit-input
          type: object
          fields:
            classification:
              type: graph_input_pointer
              pointer: /classification
            fix_eligible:
              type: graph_input_pointer
              pointer: /fix_eligible
            rounds_budget:
              type: graph_input_pointer
              pointer: /rounds_budget
            rounds_used:
              type: graph_input_pointer
              pointer: /rounds_used
        routing: {mode: exclusive}
      repair-round-advance:
        kind: task
        capability: assurance.healing.repair-round.advance
        input_projection:
          type: object
          fields:
            kind:
              type: literal
              value: failure
            rounds_budget:
              type: graph_input_pointer
              pointer: /rounds_budget
            rounds_used:
              type: graph_input_pointer
              pointer: /rounds_used
        retry: once
        timeout: short
      prepare:
        kind: task
        capability: assurance.healing.fix-proposal.prepare
        input:
          capability_leafs: []
        input_projection: &failure-prepare
          type: object
          fields:
            artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
            budgets:
              type: graph_input_pointer
              pointer: /budgets
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            classification:
              type: graph_input_pointer
              pointer: /classification
            fix_eligible:
              type: graph_input_pointer
              pointer: /fix_eligible
            kind:
              type: predecessor_pointer
              predecessor: repair-round-advance
              pointer: /kind
            rounds_budget:
              type: predecessor_pointer
              predecessor: repair-round-advance
              pointer: /rounds_budget
            rounds_used:
              type: predecessor_pointer
              predecessor: repair-round-advance
              pointer: /rounds_used
        retry: once
        timeout: short
      execute:
        kind: task
        capability_slot: fix-proposal.execute
        input_projection:
          type: predecessor
          predecessor: prepare
        retry: once
        timeout: short
      finalize:
        kind: task
        capability: assurance.healing.fix-proposal.finalize
        input:
          capability_leafs: []
        input_projection:
          type: object
          fields:
            agent_result:
              type: predecessor
              predecessor: execute
            artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
            budgets:
              type: graph_input_pointer
              pointer: /budgets
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            classification:
              type: graph_input_pointer
              pointer: /classification
            fix_eligible:
              type: graph_input_pointer
              pointer: /fix_eligible
            kind:
              type: graph_input_pointer
              pointer: /kind
            rounds_budget:
              type: predecessor_pointer
              predecessor: execute
              pointer: /rounds_budget
            rounds_used:
              type: predecessor_pointer
              predecessor: execute
              pointer: /rounds_used
        retry: once
        timeout: short
      exhausted:
        kind: end
      not-eligible:
        kind: end
      done:
        kind: end
    edges:
      - {from: admit, to: repair-round-advance, condition: "output.value == true"}
      - {from: admit, to: exhausted, condition: "input.rounds_used >= input.rounds_budget"}
      - {from: admit, to: not-eligible, otherwise: true}
      - {from: repair-round-advance, to: prepare}
      - {from: prepare, to: execute}
      - {from: execute, to: finalize}
      - {from: finalize, to: done}
  healing-coverage-repair:
    max_activations: 8
    start: admit
    nodes:
      admit:
        kind: gate
        expression: "fix_eligible == true and rounds_used < rounds_budget"
        input_projection: *admit-input
        routing: {mode: exclusive}
      repair-round-advance:
        kind: task
        capability: assurance.healing.repair-round.advance
        input_projection:
          type: object
          fields:
            kind:
              type: literal
              value: coverage
            rounds_budget:
              type: graph_input_pointer
              pointer: /rounds_budget
            rounds_used:
              type: graph_input_pointer
              pointer: /rounds_used
        retry: once
        timeout: short
      prepare:
        kind: task
        capability: assurance.healing.coverage-repair.prepare
        input:
          capability_leafs: []
        input_projection:
          type: object
          fields:
            artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
            budgets:
              type: graph_input_pointer
              pointer: /budgets
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            classification:
              type: graph_input_pointer
              pointer: /classification
            fix_eligible:
              type: graph_input_pointer
              pointer: /fix_eligible
            kind:
              type: predecessor_pointer
              predecessor: repair-round-advance
              pointer: /kind
            rounds_budget:
              type: predecessor_pointer
              predecessor: repair-round-advance
              pointer: /rounds_budget
            rounds_used:
              type: predecessor_pointer
              predecessor: repair-round-advance
              pointer: /rounds_used
        retry: once
        timeout: short
      execute:
        kind: task
        capability_slot: coverage-repair.execute
        input_projection:
          type: predecessor
          predecessor: prepare
        retry: once
        timeout: short
      finalize:
        kind: task
        capability: assurance.healing.coverage-repair.finalize
        input:
          capability_leafs: []
        input_projection:
          type: object
          fields:
            agent_result:
              type: predecessor
              predecessor: execute
            artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
            budgets:
              type: graph_input_pointer
              pointer: /budgets
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            classification:
              type: graph_input_pointer
              pointer: /classification
            fix_eligible:
              type: graph_input_pointer
              pointer: /fix_eligible
            kind:
              type: graph_input_pointer
              pointer: /kind
            rounds_budget:
              type: predecessor_pointer
              predecessor: execute
              pointer: /rounds_budget
            rounds_used:
              type: predecessor_pointer
              predecessor: execute
              pointer: /rounds_used
        retry: once
        timeout: short
        routing: {mode: exclusive}
      exhausted:
        kind: end
      not-eligible:
        kind: end
      failed:
        kind: end
      needs-review:
        kind: interrupt
        reason: coverage_repair_needs_review
        actions: [approve, reject]
      done:
        kind: end
    edges:
      - {from: admit, to: repair-round-advance, condition: "output.value == true"}
      - {from: admit, to: exhausted, condition: "input.rounds_used >= input.rounds_budget"}
      - {from: admit, to: not-eligible, otherwise: true}
      - {from: repair-round-advance, to: prepare}
      - {from: prepare, to: execute}
      - {from: execute, to: finalize}
      - {from: finalize, to: done, condition: "output.status == 'repaired'"}
      - {from: finalize, to: needs-review, condition: "output.status == 'needs_review'"}
      - {from: finalize, to: exhausted, condition: "output.status == 'exhausted'"}
      - {from: finalize, to: not-eligible, condition: "output.status == 'not_eligible'"}
      - {from: finalize, to: failed, condition: "output.status == 'failed'"}
      - {from: finalize, to: failed, otherwise: true}
