schema_version: "1"
role: feature
owner_id: assurance.generation
module_id: assurance.generation.workflow
module_version: 0.2.0
imports: {}
exports:
  generate:
    graph: generation
    input_schema: assurance.generation.workflow.generate.input.v1
    output_schema: assurance.generation.workflow.generate.output.v1
    output_projection:
      type: object
      fields:
        families:
          type: child_output_pointer
          pointer: /completed
        selected_families:
          type: child_output_pointer
          pointer: /selected_families
capability_slots:
  api.codegen.prepare:
    contract_id: assurance.generation.agent.api.codegen.v1
  api.codegen.execute:
    contract_id: assurance.generation.agent.api.codegen.v1
  api.codegen.finalize:
    contract_id: assurance.generation.agent.api.codegen.v1
  api.codegen-fix.prepare:
    contract_id: assurance.generation.agent.api.codegen-fix.v1
  api.codegen-fix.execute:
    contract_id: assurance.generation.agent.api.codegen-fix.v1
  api.codegen-fix.finalize:
    contract_id: assurance.generation.agent.api.codegen-fix.v1
  api.plan.prepare:
    contract_id: assurance.generation.agent.api.plan.v1
  api.plan.execute:
    contract_id: assurance.generation.agent.api.plan.v1
  api.plan.finalize:
    contract_id: assurance.generation.agent.api.plan.v1
  api.plan-review.prepare:
    contract_id: assurance.generation.agent.api.plan-review.v1
  api.plan-review.execute:
    contract_id: assurance.generation.agent.api.plan-review.v1
  api.plan-review.finalize:
    contract_id: assurance.generation.agent.api.plan-review.v1
  e2e.codegen.prepare:
    contract_id: assurance.generation.agent.e2e.codegen.v1
  e2e.codegen.execute:
    contract_id: assurance.generation.agent.e2e.codegen.v1
  e2e.codegen.finalize:
    contract_id: assurance.generation.agent.e2e.codegen.v1
  e2e.codegen-fix.prepare:
    contract_id: assurance.generation.agent.e2e.codegen-fix.v1
  e2e.codegen-fix.execute:
    contract_id: assurance.generation.agent.e2e.codegen-fix.v1
  e2e.codegen-fix.finalize:
    contract_id: assurance.generation.agent.e2e.codegen-fix.v1
  e2e.plan.prepare:
    contract_id: assurance.generation.agent.e2e.plan.v1
  e2e.plan.execute:
    contract_id: assurance.generation.agent.e2e.plan.v1
  e2e.plan.finalize:
    contract_id: assurance.generation.agent.e2e.plan.v1
  e2e.plan-review.prepare:
    contract_id: assurance.generation.agent.e2e.plan-review.v1
  e2e.plan-review.execute:
    contract_id: assurance.generation.agent.e2e.plan-review.v1
  e2e.plan-review.finalize:
    contract_id: assurance.generation.agent.e2e.plan-review.v1
  fuzz.codegen.prepare:
    contract_id: assurance.generation.agent.fuzz.codegen.v1
  fuzz.codegen.execute:
    contract_id: assurance.generation.agent.fuzz.codegen.v1
  fuzz.codegen.finalize:
    contract_id: assurance.generation.agent.fuzz.codegen.v1
  fuzz.plan.prepare:
    contract_id: assurance.generation.agent.fuzz.plan.v1
  fuzz.plan.execute:
    contract_id: assurance.generation.agent.fuzz.plan.v1
  fuzz.plan.finalize:
    contract_id: assurance.generation.agent.fuzz.plan.v1
  fuzz.plan-review.prepare:
    contract_id: assurance.generation.agent.fuzz.plan-review.v1
  fuzz.plan-review.execute:
    contract_id: assurance.generation.agent.fuzz.plan-review.v1
  fuzz.plan-review.finalize:
    contract_id: assurance.generation.agent.fuzz.plan-review.v1
  performance.codegen.prepare:
    contract_id: assurance.generation.agent.performance.codegen.v1
  performance.codegen.execute:
    contract_id: assurance.generation.agent.performance.codegen.v1
  performance.codegen.finalize:
    contract_id: assurance.generation.agent.performance.codegen.v1
  performance.plan.prepare:
    contract_id: assurance.generation.agent.performance.plan.v1
  performance.plan.execute:
    contract_id: assurance.generation.agent.performance.plan.v1
  performance.plan.finalize:
    contract_id: assurance.generation.agent.performance.plan.v1
  performance.plan-review.prepare:
    contract_id: assurance.generation.agent.performance.plan-review.v1
  performance.plan-review.execute:
    contract_id: assurance.generation.agent.performance.plan-review.v1
  performance.plan-review.finalize:
    contract_id: assurance.generation.agent.performance.plan-review.v1
schemas:
  - assurance.generation.workflow.generate.input.v1
  - assurance.generation.workflow.generate.output.v1
resources: []
effects: []
retry:
  once:
    max_attempts: 1
timeout:
  short:
    run_seconds: 3600
graphs:
  generation:
    max_activations: 32
    start: fanout
    nodes:
      fanout:
        kind: gate
        expression: 'true'
        routing: {mode: fanout, min_matches: 4}
      select-api:
        kind: gate
        expression: "'api' in selected_test_families"
        input_projection: &family-selection
          type: object
          fields:
            selected_test_families:
              type: graph_input_pointer
              pointer: /selected_test_families
        routing: {mode: exclusive}
      select-e2e:
        kind: gate
        expression: "'e2e' in selected_test_families"
        input_projection: *family-selection
        routing: {mode: exclusive}
      select-fuzz:
        kind: gate
        expression: "'fuzz' in selected_test_families"
        input_projection: *family-selection
        routing: {mode: exclusive}
      select-performance:
        kind: gate
        expression: "'performance' in selected_test_families"
        input_projection: *family-selection
        routing: {mode: exclusive}
      api:
        kind: subgraph
        graph: generation-api
        input_projection: &lane-input
          type: object
          fields:
            allowed_artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            change_id:
              type: graph_input_pointer
              pointer: /change_id
      e2e:
        kind: subgraph
        graph: generation-e2e
        input_projection: *lane-input
      fuzz:
        kind: subgraph
        graph: generation-fuzz
        input_projection: *lane-input
      performance:
        kind: subgraph
        graph: generation-performance
        input_projection: *lane-input
      api-skip:
        kind: gate
        expression: 'true'
      e2e-skip:
        kind: gate
        expression: 'true'
      fuzz-skip:
        kind: gate
        expression: 'true'
      performance-skip:
        kind: gate
        expression: 'true'
      api-done:
        kind: gate
        expression: 'true'
      e2e-done:
        kind: gate
        expression: 'true'
      fuzz-done:
        kind: gate
        expression: 'true'
      performance-done:
        kind: gate
        expression: 'true'
      join-selected:
        kind: join
        join: all
        input_projection:
          type: object
          fields:
            selected_families:
              type: graph_input_pointer
              pointer: /selected_test_families
            completed:
              type: all_predecessor_tokens
      done:
        kind: end
    edges:
      - {from: fanout, to: select-api}
      - {from: fanout, to: select-e2e}
      - {from: fanout, to: select-fuzz}
      - {from: fanout, to: select-performance}
      - {from: select-api, to: api, condition: 'output.value == true'}
      - {from: select-api, to: api-skip, otherwise: true}
      - {from: select-e2e, to: e2e, condition: 'output.value == true'}
      - {from: select-e2e, to: e2e-skip, otherwise: true}
      - {from: select-fuzz, to: fuzz, condition: 'output.value == true'}
      - {from: select-fuzz, to: fuzz-skip, otherwise: true}
      - {from: select-performance, to: performance, condition: 'output.value == true'}
      - {from: select-performance, to: performance-skip, otherwise: true}
      - {from: api, to: api-done}
      - {from: api-skip, to: api-done}
      - {from: e2e, to: e2e-done}
      - {from: e2e-skip, to: e2e-done}
      - {from: fuzz, to: fuzz-done}
      - {from: fuzz-skip, to: fuzz-done}
      - {from: performance, to: performance-done}
      - {from: performance-skip, to: performance-done}
      - {from: api-done, to: join-selected}
      - {from: e2e-done, to: join-selected}
      - {from: fuzz-done, to: join-selected}
      - {from: performance-done, to: join-selected}
      - {from: join-selected, to: done}
  generation-api:
    max_activations: 64
    start: plan
    nodes:
      plan:
        kind: subgraph
        graph: generation-api-plan
        input_projection: &leaf-with-initial-rounds
          type: object
          fields:
            allowed_artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            rounds_budget: {type: literal, value: 2}
            rounds_used: {type: literal, value: 0}
      plan-review:
        kind: subgraph
        graph: generation-api-plan-review
        input: &plan-round-seed
          rounds_used: 0
          rounds_budget: 2
        input_projection: *leaf-with-initial-rounds
        routing: {mode: exclusive}
      plan-review-round-advance:
        kind: task
        capability: assurance.generation.review-round.advance
        input: &api-plan-advance-seed
          family: api
          stage: plan
          rounds_used: 0
          rounds_budget: 2
        input_projection: &advance-from-config
          type: object
          fields:
            family: {type: config_pointer, pointer: /family}
            stage: {type: config_pointer, pointer: /stage}
            rounds_used: {type: config_pointer, pointer: /rounds_used}
            rounds_budget: {type: config_pointer, pointer: /rounds_budget}
        routing: {mode: exclusive}
        retry: once
        timeout: short
      plan-round-join:
        kind: join
        join: any
      plan-retry:
        kind: subgraph
        graph: generation-api-plan
        input_projection: &retry-plan-from-join
          type: object
          fields:
            allowed_artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            rounds_budget:
              type: predecessor_pointer
              predecessor: plan-round-join
              pointer: /tokens/0/rounds_budget
            rounds_used:
              type: predecessor_pointer
              predecessor: plan-round-join
              pointer: /tokens/0/rounds_used
      plan-review-retry:
        kind: subgraph
        graph: generation-api-plan-review
        input_projection: &retry-review-from-plan
          type: object
          fields:
            allowed_artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            rounds_budget:
              type: predecessor_pointer
              predecessor: plan-retry
              pointer: /rounds_budget
            rounds_used:
              type: predecessor_pointer
              predecessor: plan-retry
              pointer: /rounds_used
        routing: {mode: exclusive}
      plan-review-round-advance-retry:
        kind: task
        capability: assurance.generation.review-round.advance
        input: &api-plan-advance-retry
          family: api
          stage: plan
          rounds_used: 1
          rounds_budget: 2
        input_projection: *advance-from-config
        routing: {mode: exclusive}
        retry: once
        timeout: short
      plan-human-review:
        kind: interrupt
        reason: api_plan_needs_human_review
        actions: [approve, reject, request_rework]
        input_projection: &human-from-review
          type: object
          fields:
            rounds_budget:
              type: predecessor_pointer
              predecessor: plan-review
              pointer: /rounds_budget
            rounds_used:
              type: predecessor_pointer
              predecessor: plan-review
              pointer: /rounds_used
        routing: {mode: exclusive}
      plan-human-review-retry:
        kind: interrupt
        reason: api_plan_needs_human_review
        actions: [approve, reject, request_rework]
        input_projection: &human-retry-from-review
          type: object
          fields:
            rounds_budget:
              type: predecessor_pointer
              predecessor: plan-review-retry
              pointer: /rounds_budget
            rounds_used:
              type: predecessor_pointer
              predecessor: plan-review-retry
              pointer: /rounds_used
        routing: {mode: exclusive}
      codegen:
        kind: subgraph
        graph: generation-api-codegen
        input: *plan-round-seed
        input_projection: &leaf-input
          type: object
          fields:
            allowed_artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            change_id:
              type: graph_input_pointer
              pointer: /change_id
        routing: {mode: exclusive}
      codegen-round-advance:
        kind: task
        capability: assurance.generation.review-round.advance
        input:
          family: api
          stage: codegen
          rounds_used: 0
          rounds_budget: 2
        input_projection: *advance-from-config
        retry: once
        timeout: short
      codegen-fix:
        kind: subgraph
        graph: generation-api-codegen-fix
        input_projection: *leaf-input
      rejected:
        kind: end
      exhausted:
        kind: end
      done:
        kind: end
    edges:
      - {from: plan, to: plan-review}
      - {from: plan-review, to: codegen, condition: "(output.decision == 'pass' or output.decision == 'approved') and output.codegen_readiness != 'not_ready'"}
      - {from: plan-review, to: plan-review-round-advance, condition: "(output.decision == 'needs_fix' or output.decision == 'changes_requested') and output.auto_fix_allowed == true and output.human_review_required == false and output.rounds_used < output.rounds_budget"}
      - {from: plan-review, to: plan-human-review, condition: "output.decision == 'needs_human_review' or output.human_review_required == true"}
      - {from: plan-review, to: rejected, condition: "output.decision == 'reject' and output.human_review_required == false"}
      - {from: plan-review, to: exhausted, otherwise: true}
      - {from: plan-human-review, to: codegen, condition: "output.action == 'approve'"}
      - {from: plan-human-review, to: rejected, condition: "output.action == 'reject'"}
      - {from: plan-human-review, to: plan-review-round-advance, condition: "output.action == 'request_rework' and input.rounds_used < input.rounds_budget"}
      - {from: plan-human-review, to: exhausted, otherwise: true}
      - {from: plan-review-round-advance, to: plan-round-join, condition: "output.rounds_used < output.rounds_budget"}
      - {from: plan-review-round-advance, to: exhausted, otherwise: true}
      - {from: plan-review-round-advance-retry, to: plan-round-join, condition: "output.rounds_used < output.rounds_budget"}
      - {from: plan-review-round-advance-retry, to: exhausted, otherwise: true}
      - {from: plan-round-join, to: plan-retry}
      - {from: plan-retry, to: plan-review-retry}
      - {from: plan-review-retry, to: codegen, condition: "(output.decision == 'pass' or output.decision == 'approved') and output.codegen_readiness != 'not_ready'"}
      - {from: plan-review-retry, to: plan-review-round-advance-retry, condition: "(output.decision == 'needs_fix' or output.decision == 'changes_requested') and output.auto_fix_allowed == true and output.human_review_required == false and output.rounds_used < output.rounds_budget"}
      - {from: plan-review-retry, to: plan-human-review-retry, condition: "output.decision == 'needs_human_review' or output.human_review_required == true"}
      - {from: plan-review-retry, to: rejected, condition: "output.decision == 'reject' and output.human_review_required == false"}
      - {from: plan-review-retry, to: exhausted, otherwise: true}
      - {from: plan-human-review-retry, to: codegen, condition: "output.action == 'approve'"}
      - {from: plan-human-review-retry, to: rejected, condition: "output.action == 'reject'"}
      - {from: plan-human-review-retry, to: plan-review-round-advance-retry, condition: "output.action == 'request_rework' and input.rounds_used < input.rounds_budget"}
      - {from: plan-human-review-retry, to: exhausted, otherwise: true}
      - {from: codegen, to: done, condition: "('verdict' in output and output.verdict == 'accepted') or ('needs_fix' in output and output.needs_fix == false)"}
      - {from: codegen, to: codegen-round-advance, condition: "('verdict' in output and output.verdict == 'needs_fix') or ('needs_fix' in output and output.needs_fix == true)"}
      - {from: codegen, to: exhausted, otherwise: true}
      - {from: codegen-round-advance, to: codegen-fix}
      - {from: codegen-fix, to: done}

  generation-api-plan:
    max_activations: 8
    start: prepare
    nodes:
      prepare:
        kind: task
        capability: assurance.generation.api.plan.prepare
        input: &prepare-input
          capability_leafs: []
        input_projection: &prepare-projection
          type: object
          fields:
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
        retry: once
        timeout: short
      execute:
        kind: task
        capability_slot: api.plan.execute
        input_projection:
          type: predecessor
          predecessor: prepare
        retry: once
        timeout: short
      finalize:
        kind: task
        capability: assurance.generation.api.plan.finalize
        input: *prepare-input
        input_projection: &stateful-finalize-projection
          type: object
          fields:
            agent_result:
              type: predecessor
              predecessor: execute
            artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            rounds_budget:
              type: graph_input_pointer
              pointer: /rounds_budget
            rounds_used:
              type: graph_input_pointer
              pointer: /rounds_used
        retry: once
        timeout: short
      done:
        kind: end
    edges:
      - {from: prepare, to: execute}
      - {from: execute, to: finalize}
      - {from: finalize, to: done}
  generation-api-plan-review:
    max_activations: 8
    start: prepare
    nodes:
      prepare:
        kind: task
        capability: assurance.generation.api.plan-review.prepare
        input: *prepare-input
        input_projection: *prepare-projection
        retry: once
        timeout: short
      execute:
        kind: task
        capability_slot: api.plan-review.execute
        input_projection:
          type: predecessor
          predecessor: prepare
        retry: once
        timeout: short
      finalize:
        kind: task
        capability: assurance.generation.api.plan-review.finalize
        input: *prepare-input
        input_projection: *stateful-finalize-projection
        retry: once
        timeout: short
      done:
        kind: end
    edges:
      - {from: prepare, to: execute}
      - {from: execute, to: finalize}
      - {from: finalize, to: done}
  generation-api-codegen:
    max_activations: 8
    start: prepare
    nodes:
      prepare:
        kind: task
        capability: assurance.generation.api.codegen.prepare
        input: *prepare-input
        input_projection: *prepare-projection
        retry: once
        timeout: short
      execute:
        kind: task
        capability_slot: api.codegen.execute
        input_projection:
          type: predecessor
          predecessor: prepare
        retry: once
        timeout: short
      finalize:
        kind: task
        capability: assurance.generation.api.codegen.finalize
        input: *prepare-input
        input_projection: &finalize-projection
          type: object
          fields:
            agent_result:
              type: predecessor
              predecessor: execute
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
        retry: once
        timeout: short
      done:
        kind: end
    edges:
      - {from: prepare, to: execute}
      - {from: execute, to: finalize}
      - {from: finalize, to: done}
  generation-api-codegen-fix:
    max_activations: 8
    start: prepare
    nodes:
      prepare:
        kind: task
        capability: assurance.generation.api.codegen-fix.prepare
        input: *prepare-input
        input_projection: *prepare-projection
        retry: once
        timeout: short
      execute:
        kind: task
        capability_slot: api.codegen-fix.execute
        input_projection:
          type: predecessor
          predecessor: prepare
        retry: once
        timeout: short
      finalize:
        kind: task
        capability: assurance.generation.api.codegen-fix.finalize
        input: *prepare-input
        input_projection: *finalize-projection
        retry: once
        timeout: short
      done:
        kind: end
    edges:
      - {from: prepare, to: execute}
      - {from: execute, to: finalize}
      - {from: finalize, to: done}
  generation-e2e:
    max_activations: 64
    start: plan
    nodes:
      plan:
        kind: subgraph
        graph: generation-e2e-plan
        input_projection: *leaf-with-initial-rounds
      plan-review:
        kind: subgraph
        graph: generation-e2e-plan-review
        input: *plan-round-seed
        input_projection: *leaf-with-initial-rounds
        routing: {mode: exclusive}
      plan-review-round-advance:
        kind: task
        capability: assurance.generation.review-round.advance
        input:
          family: e2e
          stage: plan
          rounds_used: 0
          rounds_budget: 2
        input_projection: *advance-from-config
        routing: {mode: exclusive}
        retry: once
        timeout: short
      plan-round-join:
        kind: join
        join: any
      plan-retry:
        kind: subgraph
        graph: generation-e2e-plan
        input_projection: *retry-plan-from-join
      plan-review-retry:
        kind: subgraph
        graph: generation-e2e-plan-review
        input_projection: *retry-review-from-plan
        routing: {mode: exclusive}
      plan-review-round-advance-retry:
        kind: task
        capability: assurance.generation.review-round.advance
        input:
          family: e2e
          stage: plan
          rounds_used: 1
          rounds_budget: 2
        input_projection: *advance-from-config
        routing: {mode: exclusive}
        retry: once
        timeout: short
      plan-human-review:
        kind: interrupt
        reason: e2e_plan_needs_human_review
        actions: [approve, reject, request_rework]
        input_projection: *human-from-review
        routing: {mode: exclusive}
      plan-human-review-retry:
        kind: interrupt
        reason: e2e_plan_needs_human_review
        actions: [approve, reject, request_rework]
        input_projection: *human-retry-from-review
        routing: {mode: exclusive}
      codegen:
        kind: subgraph
        graph: generation-e2e-codegen
        input: *plan-round-seed
        input_projection: *leaf-input
        routing: {mode: exclusive}
      codegen-round-advance:
        kind: task
        capability: assurance.generation.review-round.advance
        input:
          family: e2e
          stage: codegen
          rounds_used: 0
          rounds_budget: 2
        input_projection: *advance-from-config
        retry: once
        timeout: short
      codegen-fix:
        kind: subgraph
        graph: generation-e2e-codegen-fix
        input_projection: *leaf-input
      rejected:
        kind: end
      exhausted:
        kind: end
      done:
        kind: end
    edges:
      - {from: plan, to: plan-review}
      - {from: plan-review, to: codegen, condition: "(output.decision == 'pass' or output.decision == 'approved') and output.codegen_readiness != 'not_ready'"}
