[project]
name = "agent-runtime-contracts"
version = "0.1.0"
description = "Frozen provider-neutral AgentRun request/result contracts"
requires-python = ">=3.11,<4.0"
dependencies = ["graph-engine", "pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_runtime_contracts"]

[tool.uv.sources]
graph-engine = { workspace = true }
