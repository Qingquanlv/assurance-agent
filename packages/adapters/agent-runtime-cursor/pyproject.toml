[project]
name = "agent-runtime-cursor"
version = "0.1.0"
description = "Closed Cursor confined-process adapter profile for Graph Engine"
requires-python = ">=3.11,<4.0"
dependencies = [
    "agent-runtime-contracts",
    "graph-engine",
    "pydantic>=2.7",
]

[project.entry-points."graph_engine.plugins"]
cursor = "agent_runtime_cursor.plugin:CursorPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_runtime_cursor"]

[tool.uv.sources]
agent-runtime-contracts = { workspace = true }
graph-engine = { workspace = true }
