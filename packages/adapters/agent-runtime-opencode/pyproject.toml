[project]
name = "agent-runtime-opencode"
version = "0.1.0"
description = "Closed OpenCode HTTP adapter profile for Graph Engine"
requires-python = ">=3.11,<4.0"
dependencies = [
    "agent-runtime-contracts",
    "graph-engine",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.entry-points."graph_engine.plugins"]
opencode = "agent_runtime_opencode.plugin:OpenCodePlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_runtime_opencode"]

[tool.uv.sources]
agent-runtime-contracts = { workspace = true }
graph-engine = { workspace = true }
