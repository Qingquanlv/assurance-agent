[project]
name = "assurance-product"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "graph-engine==0.2.0",
  "assurance-intake==0.2.0",
  "assurance-generation==0.2.0",
  "assurance-execution==0.2.0",
  "assurance-healing==0.2.0",
  "assurance-quality==0.2.0",
  "assurance-improvement==0.2.0",
  "assurance-telemetry==0.2.0",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "click>=8.1",
]

[project.optional-dependencies]
opencode = ["agent-runtime-opencode==0.1.0"]

[project.entry-points."graph_engine.products"]
assurance-opencode = "assurance_product.product:AssuranceOpenCodeProductProvider"

[project.scripts]
aa = "assurance_product.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assurance_product"]

[tool.uv.sources]
graph-engine = { workspace = true }
assurance-intake = { workspace = true }
assurance-generation = { workspace = true }
assurance-execution = { workspace = true }
assurance-healing = { workspace = true }
assurance-quality = { workspace = true }
assurance-improvement = { workspace = true }
assurance-telemetry = { workspace = true }
agent-runtime-opencode = { workspace = true }
