schema_version: "1"
role: product
name: assurance
owner_id: assurance.product
module_id: assurance.product.workflow
module_version: 0.2.0
entrypoints:
  intake: product-intake
  case: product-case
  full: product-full
  execute: product-execute
  archive: product-archive
  retro: product-retro
  issue-review: product-issue-review
  issue-analyze: product-issue-analyze
  issue-reconcile: product-issue-reconcile
  improvement-review: product-improvement-review
  improvement-evaluate: product-improvement-evaluate
  improvement-export: product-improvement-export
  improvement-apply: product-improvement-apply
  improvement-rollback: product-improvement-rollback
imports:
  intake.prepare:
    owner_id: assurance.intake
    module_id: assurance.intake.workflow
    export: prepare
  intake.case:
    owner_id: assurance.intake
    module_id: assurance.intake.workflow
    export: case
  generation.generate:
    owner_id: assurance.generation
    module_id: assurance.generation.workflow
    export: generate
  execution.execute:
    owner_id: assurance.execution
    module_id: assurance.execution.workflow
    export: execute
  execution.rerun:
    owner_id: assurance.execution
    module_id: assurance.execution.workflow
    export: rerun
  quality.assess:
    owner_id: assurance.quality
    module_id: assurance.quality.workflow
    export: assess
  quality.issue-review:
    owner_id: assurance.quality
    module_id: assurance.quality.workflow
    export: issue-review
  quality.issue-analyze:
    owner_id: assurance.quality
    module_id: assurance.quality.workflow
    export: issue-analyze
  quality.issue-reconcile:
    owner_id: assurance.quality
    module_id: assurance.quality.workflow
    export: issue-reconcile
  quality.report:
    owner_id: assurance.quality
    module_id: assurance.quality.workflow
    export: report
  healing.repair-failure:
    owner_id: assurance.healing
    module_id: assurance.healing.workflow
    export: repair-failure
  healing.repair-coverage:
    owner_id: assurance.healing
    module_id: assurance.healing.workflow
    export: repair-coverage
  improvement.archive:
    owner_id: assurance.improvement
    module_id: assurance.improvement.workflow
    export: archive
  improvement.retro:
    owner_id: assurance.improvement
    module_id: assurance.improvement.workflow
    export: retro
  improvement.review:
    owner_id: assurance.improvement
    module_id: assurance.improvement.workflow
    export: review
  improvement.evaluate:
    owner_id: assurance.improvement
    module_id: assurance.improvement.workflow
    export: evaluate
  improvement.export:
    owner_id: assurance.improvement
    module_id: assurance.improvement.workflow
    export: export
  improvement.apply:
    owner_id: assurance.improvement
    module_id: assurance.improvement.workflow
    export: apply
  improvement.rollback:
    owner_id: assurance.improvement
    module_id: assurance.improvement.workflow
    export: rollback
exports: {}
capability_slots: {}
schemas:
  - assurance.execution.workflow.execute.input.v1
  - assurance.execution.workflow.execute.output.v1
  - assurance.execution.workflow.rerun.input.v1
  - assurance.execution.workflow.rerun.output.v1
  - assurance.generation.workflow.generate.input.v1
  - assurance.generation.workflow.generate.output.v1
  - assurance.healing.workflow.repair-coverage.input.v1
  - assurance.healing.workflow.repair-coverage.output.v1
  - assurance.healing.workflow.repair-failure.input.v1
  - assurance.healing.workflow.repair-failure.output.v1
  - assurance.improvement.workflow.apply.input.v1
  - assurance.improvement.workflow.apply.output.v1
  - assurance.improvement.workflow.archive.input.v1
  - assurance.improvement.workflow.archive.output.v1
  - assurance.improvement.workflow.evaluate.input.v1
  - assurance.improvement.workflow.evaluate.output.v1
  - assurance.improvement.workflow.export.input.v1
  - assurance.improvement.workflow.export.output.v1
  - assurance.improvement.workflow.review.input.v1
  - assurance.improvement.workflow.review.output.v1
  - assurance.improvement.workflow.rollback.input.v1
  - assurance.improvement.workflow.rollback.output.v1
  - assurance.improvement.workflow.retro.input.v1
  - assurance.improvement.workflow.retro.output.v1
  - assurance.intake.workflow.case.input.v1
  - assurance.intake.workflow.case.output.v1
  - assurance.intake.workflow.prepare.input.v1
  - assurance.intake.workflow.prepare.output.v1
  - assurance.quality.workflow.assess.input.v1
  - assurance.quality.workflow.assess.output.v1
  - assurance.quality.workflow.issue-analyze.input.v1
  - assurance.quality.workflow.issue-analyze.output.v1
  - assurance.quality.workflow.issue-reconcile.input.v1
  - assurance.quality.workflow.issue-reconcile.output.v1
  - assurance.quality.workflow.issue-review.input.v1
  - assurance.quality.workflow.issue-review.output.v1
  - assurance.quality.workflow.report.input.v1
  - assurance.quality.workflow.report.output.v1
resources: []
effects: []
retry:
  once:
    max_attempts: 1
timeout:
  short:
    run_seconds: 3600
graphs:
  product-full:
    max_activations: 128
    start: prepare
    nodes:
      prepare:
        kind: subgraph
        graph_import: intake.prepare
        routing: {mode: exclusive}
        input_projection: &prepare_input
          type: object
          fields:
            allowed_artifact_paths: {type: graph_input_pointer, pointer: /allowed_artifact_paths}
            capability_leafs: {type: graph_input_pointer, pointer: /capability_leafs}
            case_delta_paths: {type: graph_input_pointer, pointer: /case_delta_paths}
            change_id: {type: graph_input_pointer, pointer: /change_id}
            requirement: {type: graph_input_pointer, pointer: /requirement}
            selected_test_families: {type: graph_input_pointer, pointer: /selected_test_families}
      execute-tail:
        kind: subgraph
        graph: product-execute
        routing: {mode: exclusive}
        output_schema: assurance.quality.workflow.report.output.v1
        output_projection:
          type: object
          fields:
            change_id:
              type: child_output_pointer
              pointer: /change_id
            coverage_state:
              type: child_output_pointer
              pointer: /coverage_state
            report_refs:
              type: child_output_pointer
              pointer: /report_refs
        input_projection: &execute_root_input
          type: object
          fields:
            allowed_artifact_paths: {type: graph_input_pointer, pointer: /allowed_artifact_paths}
            artifacts:
              type: predecessor_pointer
              predecessor: prepare
              pointer: /artifacts
            budgets: {type: graph_input_pointer, pointer: /budgets}
            capability_leafs: {type: graph_input_pointer, pointer: /capability_leafs}
            change_id: {type: graph_input_pointer, pointer: /change_id}
            decision:
              type: predecessor_pointer
              predecessor: prepare
              pointer: /decision
            selected_test_families: {type: graph_input_pointer, pointer: /selected_test_families}
      retro:
        kind: subgraph
        graph_import: improvement.retro
        input:
          evidence_refs: []
          lifecycle_state: proposed
        input_projection: &lifecycle_input
          type: object
          fields:
            allowed_artifact_paths: {type: graph_input_pointer, pointer: /allowed_artifact_paths}
            capability_leafs: {type: graph_input_pointer, pointer: /capability_leafs}
            change_id: {type: graph_input_pointer, pointer: /change_id}
            evidence_refs: {type: config_pointer, pointer: /evidence_refs}
            lifecycle_state: {type: config_pointer, pointer: /lifecycle_state}
      improvement:
        kind: subgraph
        graph_import: improvement.apply
        input:
          evidence_refs: []
          lifecycle_state: proposed
        input_projection: *lifecycle_input
      achieved:
        kind: end
      not-achieved:
        kind: end
    edges:
      - {from: prepare, to: execute-tail, condition: "output.decision == 'pass' or output.decision == 'approved'"}
      - {from: prepare, to: not-achieved, otherwise: true}
      - {from: execute-tail, to: retro, condition: "output.coverage_state == 'satisfied'"}
      - {from: execute-tail, to: not-achieved, otherwise: true}
      - {from: retro, to: improvement}
      - {from: improvement, to: achieved}
  product-execute:
    max_activations: 128
    start: generation
    nodes:
      generation:
        kind: subgraph
        graph_import: generation.generate
        input_projection: &generate_input
          type: object
          fields:
            allowed_artifact_paths: {type: graph_input_pointer, pointer: /allowed_artifact_paths}
            artifacts: {type: graph_input_pointer, pointer: /artifacts}
            capability_leafs: {type: graph_input_pointer, pointer: /capability_leafs}
            change_id: {type: graph_input_pointer, pointer: /change_id}
            decision: {type: graph_input_pointer, pointer: /decision}
            selected_test_families: {type: graph_input_pointer, pointer: /selected_test_families}
      execute:
        kind: subgraph
        graph_import: execution.execute
        input_projection: &execution_seed
          type: object
          fields:
            capability_leafs: {type: graph_input_pointer, pointer: /capability_leafs}
            change_id: {type: graph_input_pointer, pointer: /change_id}
            rounds_budget: {type: graph_input_pointer, pointer: /budgets/healing_rounds}
            rounds_used: {type: literal, value: 0}
            selected_test_families: {type: graph_input_pointer, pointer: /selected_test_families}
        routing: {mode: exclusive}
      failed-join:
        kind: join
        join: any
      issue-analysis:
        kind: subgraph
        graph_import: quality.issue-analyze
        input:
          evidence_refs: []
          execution_status: failed
        input_projection: &issue_input
          type: object
          fields:
            allowed_artifact_paths: {type: graph_input_pointer, pointer: /allowed_artifact_paths}
            budgets: {type: graph_input_pointer, pointer: /budgets}
            capability_leafs: {type: graph_input_pointer, pointer: /capability_leafs}
            change_id: {type: graph_input_pointer, pointer: /change_id}
            evidence_refs: {type: config_pointer, pointer: /evidence_refs}
            execution_status: {type: config_pointer, pointer: /execution_status}
            rounds_budget:
              type: predecessor_pointer
              predecessor: failed-join
              pointer: /tokens/0/rounds_budget
            rounds_used:
              type: predecessor_pointer
              predecessor: failed-join
              pointer: /tokens/0/rounds_used
        routing: {mode: exclusive}
      fix-proposal:
        kind: subgraph
        graph_import: healing.repair-failure
        input:
          kind: failure
        input_projection: &repair_failure_input
          type: object
          fields:
            allowed_artifact_paths: {type: graph_input_pointer, pointer: /allowed_artifact_paths}
            budgets: {type: graph_input_pointer, pointer: /budgets}
            capability_leafs: {type: graph_input_pointer, pointer: /capability_leafs}
            change_id: {type: graph_input_pointer, pointer: /change_id}
            classification:
              type: predecessor_pointer
              predecessor: issue-analysis
              pointer: /classification
            fix_eligible:
              type: predecessor_pointer
              predecessor: issue-analysis
              pointer: /fix_eligible
            kind: {type: config_pointer, pointer: /kind}
            rounds_budget:
              type: predecessor_pointer
              predecessor: issue-analysis
              pointer: /rounds_budget
            rounds_used:
              type: predecessor_pointer
              predecessor: issue-analysis
              pointer: /rounds_used
      run:
        kind: subgraph
        graph_import: execution.rerun
        input_projection:
          type: object
          fields:
            capability_leafs: {type: graph_input_pointer, pointer: /capability_leafs}
            change_id: {type: graph_input_pointer, pointer: /change_id}
            rounds_budget:
              type: predecessor_pointer
              predecessor: fix-proposal
              pointer: /rounds_budget
            rounds_used:
              type: predecessor_pointer
              predecessor: fix-proposal
              pointer: /rounds_used
            selected_test_families: {type: graph_input_pointer, pointer: /selected_test_families}
        routing: {mode: exclusive}
      quality:
        kind: subgraph
        graph_import: quality.assess
        input:
          evidence_refs: []
          execution_status: passed
        input_projection: &assess_input
          type: object
          fields:
            allowed_artifact_paths: {type: graph_input_pointer, pointer: /allowed_artifact_paths}
            budgets: {type: graph_input_pointer, pointer: /budgets}
            capability_leafs: {type: graph_input_pointer, pointer: /capability_leafs}
            change_id: {type: graph_input_pointer, pointer: /change_id}
            evidence_refs: {type: config_pointer, pointer: /evidence_refs}
            execution_status: {type: config_pointer, pointer: /execution_status}
            rounds_budget: {type: graph_input_pointer, pointer: /budgets/coverage_rounds}
            rounds_used: {type: literal, value: 0}
        routing: {mode: exclusive}
      quality-recheck:
        kind: subgraph
        graph_import: quality.assess
        input:
          evidence_refs: []
          execution_status: passed
        input_projection:
          type: object
          fields:
            allowed_artifact_paths: {type: graph_input_pointer, pointer: /allowed_artifact_paths}
            budgets: {type: graph_input_pointer, pointer: /budgets}
            capability_leafs: {type: graph_input_pointer, pointer: /capability_leafs}
            change_id: {type: graph_input_pointer, pointer: /change_id}
            evidence_refs: {type: config_pointer, pointer: /evidence_refs}
            execution_status: {type: config_pointer, pointer: /execution_status}
            rounds_budget:
              type: predecessor_pointer
              predecessor: coverage-repair
              pointer: /rounds_budget
            rounds_used:
              type: predecessor_pointer
              predecessor: coverage-repair
              pointer: /rounds_used
        routing: {mode: exclusive}
      coverage-needed:
        kind: join
        join: any
      coverage-repair:
        kind: subgraph
        graph_import: healing.repair-coverage
        input:
          classification: repair_required
          fix_eligible: true
          kind: coverage
        input_projection:
          type: object
          fields:
            allowed_artifact_paths: {type: graph_input_pointer, pointer: /allowed_artifact_paths}
            budgets: {type: graph_input_pointer, pointer: /budgets}
            capability_leafs: {type: graph_input_pointer, pointer: /capability_leafs}
            change_id: {type: graph_input_pointer, pointer: /change_id}
            classification: {type: config_pointer, pointer: /classification}
            fix_eligible: {type: config_pointer, pointer: /fix_eligible}
            kind: {type: config_pointer, pointer: /kind}
            rounds_budget:
              type: predecessor_pointer
              predecessor: coverage-needed
              pointer: /tokens/0/rounds_budget
            rounds_used:
              type: predecessor_pointer
              predecessor: coverage-needed
              pointer: /tokens/0/rounds_used
        routing: {mode: exclusive}
      coverage-human:
        kind: interrupt
        reason: coverage_needs_human
        actions: [approve, reject]
      assess-satisfied:
        kind: join
        join: any
      assess-unsatisfied:
        kind: join
        join: any
      report:
        kind: subgraph
        graph_import: quality.report
        input:
          evidence_refs: []
          execution_status: passed
        input_projection:
          type: object
          fields:
            <<: &report_fields
              allowed_artifact_paths: {type: graph_input_pointer, pointer: /allowed_artifact_paths}
              budgets: {type: graph_input_pointer, pointer: /budgets}
              capability_leafs: {type: graph_input_pointer, pointer: /capability_leafs}
              change_id: {type: graph_input_pointer, pointer: /change_id}
              evidence_refs: {type: config_pointer, pointer: /evidence_refs}
              execution_status: {type: config_pointer, pointer: /execution_status}
              rounds_budget: {type: graph_input_pointer, pointer: /budgets/healing_rounds}
              rounds_used: {type: literal, value: 0}
            coverage_state:
              type: predecessor_pointer
              predecessor: assess-satisfied
              pointer: /tokens/0/coverage_state
      report-unsatisfied:
        kind: subgraph
        graph_import: quality.report
        input:
          evidence_refs: []
          execution_status: passed
        input_projection:
          type: object
          fields:
            <<: *report_fields
            coverage_state:
              type: predecessor_pointer
              predecessor: assess-unsatisfied
              pointer: /tokens/0/coverage_state
      report-unsatisfied-repair:
        kind: subgraph
        graph_import: quality.report
        input:
          evidence_refs: []
          execution_status: passed
        input_projection:
          type: object
          fields:
            <<: *report_fields
            coverage_state: {type: literal, value: repair_required}
      report-issue:
        kind: subgraph
        graph_import: quality.report
        input:
          evidence_refs: []
          execution_status: passed
        input_projection:
          type: object
          fields:
            <<: *report_fields
            coverage_state: {type: literal, value: inconclusive}
      not-achieved:
        kind: end
      done:
        kind: end
    edges:
      - {from: generation, to: execute}
      - {from: execute, to: quality, condition: "output.status == 'passed'"}
      - {from: execute, to: failed-join, condition: "output.status == 'failed'"}
      - {from: execute, to: not-achieved, otherwise: true}
      - {from: run, to: quality, condition: "output.status == 'passed'"}
      - {from: run, to: failed-join, condition: "output.status == 'failed'"}
      - {from: run, to: not-achieved, otherwise: true}
      - {from: failed-join, to: issue-analysis}
      - {from: issue-analysis, to: fix-proposal, condition: "(output.classification == 'test' or output.classification == 'test-data') and output.fix_eligible == true and input.rounds_used < input.rounds_budget"}
      - {from: issue-analysis, to: report-issue, condition: "output.classification == 'product_bug' or output.classification == 'environment_failure' or output.classification == 'infrastructure_failure'"}
      - {from: issue-analysis, to: not-achieved, otherwise: true}
      - {from: fix-proposal, to: run}
      - {from: quality, to: coverage-needed, condition: "output.coverage_state == 'repair_required' and input.rounds_used < input.rounds_budget"}
      - {from: quality, to: assess-satisfied, condition: "output.coverage_state == 'satisfied'"}
      - {from: quality, to: assess-unsatisfied, condition: "output.coverage_state == 'exhausted' or output.coverage_state == 'inconclusive'"}
      - {from: quality, to: coverage-human, condition: "output.coverage_state == 'needs_human'"}
      - {from: quality, to: not-achieved, otherwise: true}
      - {from: quality-recheck, to: coverage-needed, condition: "output.coverage_state == 'repair_required' and input.rounds_used < input.rounds_budget"}
      - {from: quality-recheck, to: assess-satisfied, condition: "output.coverage_state == 'satisfied'"}
      - {from: quality-recheck, to: assess-unsatisfied, condition: "output.coverage_state == 'exhausted' or output.coverage_state == 'inconclusive'"}
      - {from: quality-recheck, to: coverage-human, condition: "output.coverage_state == 'needs_human'"}
      - {from: quality-recheck, to: not-achieved, otherwise: true}
      - {from: assess-satisfied, to: report}
      - {from: assess-unsatisfied, to: report-unsatisfied}
      - {from: coverage-needed, to: coverage-repair}
      - {from: coverage-repair, to: quality-recheck, condition: "output.status == 'repaired'"}
      - {from: coverage-repair, to: report-unsatisfied-repair, condition: "output.status == 'exhausted' or output.status == 'not_eligible' or output.status == 'failed'"}
      - {from: coverage-repair, to: not-achieved, otherwise: true}
      - {from: report, to: done}
      - {from: report-unsatisfied, to: not-achieved}
      - {from: report-unsatisfied-repair, to: not-achieved}
      - {from: report-issue, to: done}
  product-intake:
    max_activations: 8
    start: run
    nodes:
      run:
        kind: subgraph
        graph_import: intake.prepare
        input_projection: *prepare_input
      done: {kind: end}
    edges:
      - {from: run, to: done}
  product-case:
    max_activations: 6
    start: run
    nodes:
      run:
        kind: subgraph
        graph_import: intake.case
        input_projection: *prepare_input
      done: {kind: end}
    edges:
      - {from: run, to: done}
  product-archive:
    max_activations: 4
    start: run
    nodes:
      run:
        kind: subgraph
        graph_import: improvement.archive
        input:
          evidence_refs: []
          lifecycle_state: proposed
        input_projection: *lifecycle_input
      done: {kind: end}
    edges:
      - {from: run, to: done}
  product-retro:
    max_activations: 4
    start: run
    nodes:
      run:
        kind: subgraph
        graph_import: improvement.retro
        input:
          evidence_refs: []
          lifecycle_state: proposed
        input_projection: *lifecycle_input
      done: {kind: end}
    edges:
      - {from: run, to: done}
  product-issue-review:
    max_activations: 4
    start: run
    nodes:
      run:
        kind: subgraph
        graph_import: quality.issue-review
        input:
          evidence_refs: []
          execution_status: failed
        input_projection: &quality_standalone_input
          type: object
          fields:
            allowed_artifact_paths: {type: graph_input_pointer, pointer: /allowed_artifact_paths}
            budgets: {type: graph_input_pointer, pointer: /budgets}
            capability_leafs: {type: graph_input_pointer, pointer: /capability_leafs}
            change_id: {type: graph_input_pointer, pointer: /change_id}
            evidence_refs: {type: config_pointer, pointer: /evidence_refs}
            execution_status: {type: config_pointer, pointer: /execution_status}
            rounds_budget: {type: graph_input_pointer, pointer: /budgets/healing_rounds}
            rounds_used: {type: literal, value: 0}
      done: {kind: end}
    edges:
      - {from: run, to: done}
  product-issue-analyze:
    max_activations: 4
    start: run
    nodes:
      run:
        kind: subgraph
        graph_import: quality.issue-analyze
        input:
          evidence_refs: []
          execution_status: failed
        input_projection: *quality_standalone_input
      done: {kind: end}
    edges:
      - {from: run, to: done}
  product-issue-reconcile:
    max_activations: 4
    start: run
    nodes:
      run:
        kind: subgraph
        graph_import: quality.issue-reconcile
        input:
          evidence_refs: []
          execution_status: failed
        input_projection: *quality_standalone_input
      done: {kind: end}
    edges:
      - {from: run, to: done}
  product-improvement-review:
    max_activations: 4
    start: run
    nodes:
      run:
        kind: subgraph
        graph_import: improvement.review
        input:
          evidence_refs: []
          lifecycle_state: proposed
        input_projection: *lifecycle_input
      done: {kind: end}
    edges:
      - {from: run, to: done}
  product-improvement-evaluate:
    max_activations: 4
    start: run
    nodes:
      run:
        kind: subgraph
        graph_import: improvement.evaluate
        input:
          evidence_refs: []
          lifecycle_state: proposed
        input_projection: *lifecycle_input
      done: {kind: end}
    edges:
      - {from: run, to: done}
  product-improvement-export:
    max_activations: 4
    start: run
    nodes:
      run:
        kind: subgraph
        graph_import: improvement.export
        input:
          evidence_refs: []
          lifecycle_state: proposed
        input_projection: *lifecycle_input
      done: {kind: end}
    edges:
      - {from: run, to: done}
  product-improvement-apply:
    max_activations: 4
    start: run
    nodes:
      run:
        kind: subgraph
        graph_import: improvement.apply
        input:
          evidence_refs: []
          lifecycle_state: proposed
        input_projection: *lifecycle_input
      done: {kind: end}
    edges:
      - {from: run, to: done}
  product-improvement-rollback:
    max_activations: 4
    start: run
    nodes:
      run:
        kind: subgraph
        graph_import: improvement.rollback
        input:
          evidence_refs: []
          lifecycle_state: proposed
        input_projection: *lifecycle_input
      done: {kind: end}
    edges:
      - {from: run, to: done}
