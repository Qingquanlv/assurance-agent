[project]
name = "assurance-kernel"
description = "Assurance kernel runtime (graph engine, product protocol, kernel resources)"
version = "0.1.0"
requires-python = ">=3.11,<4.0"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assurance_kernel"]
artifacts = ["assurance_kernel/_resources/**"]
