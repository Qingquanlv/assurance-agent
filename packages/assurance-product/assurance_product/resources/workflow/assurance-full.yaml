name: assurance
entrypoints:
  intake: entry
  case: case
  full: full
retry:
  once:
    max_attempts: 1
timeout:
  short:
    run_seconds: 30
graphs:
  entry:
    max_activations: 8
    start: intake
    nodes:
      intake:
        kind: subgraph
        graph: intake
      explore:
        kind: subgraph
        graph: explore
      case-design:
        kind: subgraph
        graph: case-design
      case-review:
        kind: subgraph
        graph: case-review
      done:
        kind: end
    edges:
      - from: intake
        to: explore
      - from: explore
        to: case-design
      - from: case-design
        to: case-review
      - from: case-review
        to: done
  case:
    max_activations: 6
    start: case-design
    nodes:
      case-design:
        kind: subgraph
        graph: case-design
      case-review:
        kind: subgraph
        graph: case-review
      done:
        kind: end
    edges:
      - from: case-design
        to: case-review
      - from: case-review
        to: done
  full:
    max_activations: 128
    start: intake
    nodes:
      intake:
        kind: subgraph
        graph: intake
      explore:
        kind: subgraph
        graph: explore
      case-design:
        kind: subgraph
        graph: case-design
      case-review:
        kind: subgraph
        graph: case-review
      generation:
        kind: subgraph
        graph: generation
      execute:
        kind: subgraph
        graph: execution-execute
      execution-pass-gate:
        kind: gate
        expression: "status == 'passed'"
        input_projection:
          type: object
          fields:
            status:
              type: predecessor_pointer
              predecessor: execute
              pointer: /status
      execution-issue-gate:
        kind: gate
        expression: "status == 'failed' or status == 'product_issue'"
        input_projection:
          type: object
          fields:
            status:
              type: predecessor_pointer
              predecessor: execute
              pointer: /status
      execution-infra-gate:
        kind: gate
        expression: "status == 'infrastructure_failure'"
        input_projection:
          type: object
          fields:
            status:
              type: predecessor_pointer
              predecessor: execute
              pointer: /status
      issue-triage:
        kind: subgraph
        graph: quality-issue-triage
      issue-analysis:
        kind: subgraph
        graph: quality-issue-analysis
      fix-proposal:
        kind: subgraph
        graph: healing-fix-proposal
      run:
        kind: subgraph
        graph: execution-run
      quality:
        kind: subgraph
        graph: quality
      coverage-policy-gate:
        kind: gate
        expression: "measured < threshold and rounds_used < rounds_budget"
        input_projection:
          type: object
          fields:
            decision:
              type: predecessor_pointer
              predecessor: quality
              pointer: /coverage/decision
            measured:
              type: predecessor_pointer
              predecessor: quality
              pointer: /coverage/measured
            threshold:
              type: predecessor_pointer
              predecessor: quality
              pointer: /coverage/threshold
            rounds_used:
              type: predecessor_pointer
              predecessor: quality
              pointer: /coverage/rounds_used
            rounds_budget:
              type: root_pointer
              pointer: /budgets/coverage_rounds
      coverage-repair:
        kind: subgraph
        graph: healing-coverage-repair
      report:
        kind: subgraph
        graph: quality-report
      done:
        kind: end
    edges:
      - from: intake
        to: explore
      - from: explore
        to: case-design
      - from: case-design
        to: case-review
      - from: case-review
        to: generation
      - from: generation
        to: execute
      - from: execute
        to: execution-pass-gate
      - from: execute
        to: execution-issue-gate
      - from: execute
        to: execution-infra-gate
      - from: execution-pass-gate
        to: quality
        condition: 'output.value == true'
      - from: execution-issue-gate
        to: issue-triage
        condition: 'output.value == true'
      - from: execution-infra-gate
        to: report
        condition: 'output.value == true'
      - from: issue-triage
        to: issue-analysis
      - from: issue-analysis
        to: fix-proposal
      - from: fix-proposal
        to: run
      - from: run
        to: quality
      - from: quality
        to: coverage-policy-gate
      - from: coverage-policy-gate
        to: coverage-repair
        condition: 'output.value == true'
      - from: coverage-policy-gate
        to: report
        condition: 'output.value == false'
      - from: coverage-repair
        to: generation
      - from: report
        to: done
  intake:
    max_activations: 8
    start: prepare
    nodes:
      prepare:
        kind: task
        capability: assurance.product.agent.intake.intake.prepare
        input: &prepare-input
          capability_leafs: []
        input_projection: &prepare-projection
          type: object
          fields:
            change_id:
              type: root_pointer
              pointer: /change_id
            capability_leafs:
              type: config_pointer
              pointer: /capability_leafs
            artifact_paths:
              type: root_pointer
              pointer: /allowed_artifact_paths
        retry: once
        timeout: short
      execute:
        kind: task
        capability: assurance.product.agent.intake.intake.execute
        input_projection:
          type: predecessor
          predecessor: prepare
        retry: once
        timeout: short
      finalize:
        kind: task
        capability: assurance.product.agent.intake.intake.finalize
        input: *prepare-input
        input_projection: &finalize-projection
          type: object
          fields:
            agent_result:
              type: predecessor
              predecessor: execute
            capability_leafs:
              type: config_pointer
              pointer: /capability_leafs
            artifact_paths:
              type: root_pointer
              pointer: /allowed_artifact_paths
        retry: once
        timeout: short
      done:
        kind: end
    edges:
      - from: prepare
        to: execute
      - from: execute
        to: finalize
      - from: finalize
        to: done
  explore:
    max_activations: 8
    start: prepare
    nodes:
      prepare:
        kind: task
        capability: assurance.product.agent.intake.explore.prepare
