  improvement-apply:
    max_activations: 8
    start: review
    nodes:
      review:
        kind: subgraph
        graph: improvement-review
      review-human-gate:
        kind: gate
        expression: "decision != 'pass' and decision != 'approved'"
        input_projection: &apply-review-decision
          type: object
          fields:
            decision:
              type: predecessor_pointer
              predecessor: review
              pointer: /decision
      review-pass-gate:
        kind: gate
        expression: "decision == 'pass' or decision == 'approved'"
        input_projection: *apply-review-decision
      human-review:
        kind: interrupt
        reason: needs_human_review
        actions: [approve, reject]
      apply:
        kind: task
        capability: assurance.improvement.apply-memory-improvement
        input_projection: *change-id-projection
        retry: once
        timeout: short
      done:
        kind: end
    edges:
      - from: review
        to: review-human-gate
      - from: review
        to: review-pass-gate
      - from: review-human-gate
        to: human-review
        condition: 'output.value == true'
      - from: review-pass-gate
        to: apply
        condition: 'output.value == true'
      - from: human-review
        to: apply
      - from: apply
        to: done
  improvement-rollback:
    max_activations: 4
    start: rollback
    nodes:
      rollback:
