  generation:
    max_activations: 32
    start: fanout
    nodes:
      fanout:
        kind: gate
        expression: 'true'
      select-api:
        kind: gate
        expression: "'api' in selected_test_families"
        input_projection: &family-selection
          type: object
          fields:
            selected_test_families:
              type: root_pointer
              pointer: /selected_test_families
      select-e2e:
        kind: gate
        expression: "'e2e' in selected_test_families"
        input_projection: *family-selection
      select-fuzz:
        kind: gate
        expression: "'fuzz' in selected_test_families"
        input_projection: *family-selection
      select-performance:
        kind: gate
        expression: "'performance' in selected_test_families"
        input_projection: *family-selection
      api:
        kind: subgraph
        graph: generation-api
      e2e:
        kind: subgraph
        graph: generation-e2e
      fuzz:
        kind: subgraph
        graph: generation-fuzz
      performance:
        kind: subgraph
        graph: generation-performance
      api-skip:
        kind: gate
        expression: 'true'
      e2e-skip:
        kind: gate
        expression: 'true'
      fuzz-skip:
        kind: gate
        expression: 'true'
      performance-skip:
        kind: gate
        expression: 'true'
      api-done:
        kind: gate
        expression: 'true'
      e2e-done:
        kind: gate
        expression: 'true'
      fuzz-done:
        kind: gate
        expression: 'true'
      performance-done:
        kind: gate
        expression: 'true'
      join-selected:
        kind: join
        join: all
        input_projection:
          type: object
          fields:
            selected_families:
              type: root_pointer
              pointer: /selected_test_families
            completed:
              type: all_predecessor_tokens
      done:
        kind: end
    edges:
      - from: fanout
        to: select-api
      - from: fanout
        to: select-e2e
      - from: fanout
        to: select-fuzz
      - from: fanout
        to: select-performance
      - from: select-api
        to: api
        condition: 'output.value == true'
      - from: select-api
        to: api-skip
        condition: 'output.value == false'
      - from: select-e2e
        to: e2e
        condition: 'output.value == true'
      - from: select-e2e
        to: e2e-skip
        condition: 'output.value == false'
      - from: select-fuzz
        to: fuzz
        condition: 'output.value == true'
      - from: select-fuzz
        to: fuzz-skip
        condition: 'output.value == false'
      - from: select-performance
        to: performance
        condition: 'output.value == true'
      - from: select-performance
        to: performance-skip
        condition: 'output.value == false'
      - from: api
        to: api-done
      - from: api-skip
        to: api-done
      - from: e2e
        to: e2e-done
      - from: e2e-skip
        to: e2e-done
      - from: fuzz
        to: fuzz-done
      - from: fuzz-skip
        to: fuzz-done
      - from: performance
        to: performance-done
      - from: performance-skip
