      - from: rollback
        to: done
  execute:
    max_activations: 128
    start: generation
    nodes:
      generation:
        kind: subgraph
        graph: generation
      execute:
        kind: subgraph
        graph: execution-execute
      execution-pass-gate:
        kind: gate
        expression: "status == 'passed'"
        input_projection:
          type: object
          fields:
            status:
              type: predecessor_pointer
              predecessor: execute
              pointer: /status
      execution-issue-gate:
        kind: gate
        expression: "status == 'failed' or status == 'product_issue'"
        input_projection:
          type: object
          fields:
            status:
              type: predecessor_pointer
              predecessor: execute
              pointer: /status
      execution-infra-gate:
        kind: gate
        expression: "status == 'infrastructure_failure'"
        input_projection:
          type: object
          fields:
            status:
              type: predecessor_pointer
              predecessor: execute
              pointer: /status
