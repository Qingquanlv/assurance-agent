        retry: once
        timeout: short
      done:
        kind: end
    edges:
      - from: prepare
        to: execute
      - from: execute
        to: finalize
      - from: finalize
        to: done
  improvement-review:
    max_activations: 8
    start: prepare
    nodes:
      prepare:
        kind: task
        capability: assurance.product.agent.improvement.improvement-review.prepare
        input: *prepare-input
        input_projection: *prepare-projection
        retry: once
        timeout: short
      execute:
        kind: task
        capability: assurance.product.agent.improvement.improvement-review.execute
        input_projection:
          type: predecessor
          predecessor: prepare
        retry: once
        timeout: short
      finalize:
        kind: task
        capability: assurance.product.agent.improvement.improvement-review.finalize
        input: *prepare-input
        input_projection: *finalize-projection
        retry: once
        timeout: short
      done:
        kind: end
    edges:
      - from: prepare
        to: execute
      - from: execute
        to: finalize
      - from: finalize
        to: done
  retro:
    max_activations: 16
    start: collect
    nodes:
      collect:
        kind: task
        capability: assurance.improvement.retro-collect-v3
        input_projection: &change-id-projection
          type: object
          fields:
            change_id:
              type: root_pointer
              pointer: /change_id
        retry: once
        timeout: short
      retro:
