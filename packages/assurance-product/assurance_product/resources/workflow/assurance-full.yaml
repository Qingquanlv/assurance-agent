          predecessor: prepare
        retry: once
        timeout: short
      finalize:
        kind: task
        capability: assurance.product.agent.intake.explore.finalize
        input: *prepare-input
        input_projection: *finalize-projection
        retry: once
        timeout: short
      done:
        kind: end
    edges:
      - from: prepare
        to: execute
      - from: execute
        to: finalize
      - from: finalize
        to: done
  case-design:
