        graph: quality-issue-triage
      issue-analysis:
        kind: subgraph
        graph: quality-issue-analysis
      fix-proposal:
        kind: subgraph
        graph: healing-fix-proposal
      run:
        kind: subgraph
        graph: execution-run
      quality:
        kind: subgraph
        graph: quality
      coverage-policy-gate:
        kind: gate
        expression: "measured < threshold and rounds_used < rounds_budget"
        input_projection:
          type: object
          fields:
            measured:
              type: predecessor_pointer
              predecessor: quality
              pointer: /coverage/measured
            threshold:
              type: predecessor_pointer
              predecessor: quality
              pointer: /coverage/threshold
            rounds_used:
              type: predecessor_pointer
              predecessor: quality
              pointer: /coverage/rounds_used
            rounds_budget:
              type: root_pointer
              pointer: /budgets/coverage_rounds
      coverage-repair:
        kind: subgraph
        graph: healing-coverage-repair
      report:
        kind: subgraph
        graph: quality-report
      done:
        kind: end
    edges:
      - from: generation
        to: execute
      - from: execute
        to: execution-pass-gate
      - from: execute
        to: execution-issue-gate
      - from: execute
        to: execution-infra-gate
      - from: execution-pass-gate
        to: quality
        condition: 'output.value == true'
      - from: execution-issue-gate
        to: issue-triage
        condition: 'output.value == true'
      - from: execution-infra-gate
        to: report
        condition: 'output.value == true'
      - from: issue-triage
        to: issue-analysis
      - from: issue-analysis
        to: fix-proposal
      - from: fix-proposal
        to: run
      - from: run
        to: quality
      - from: quality
        to: coverage-policy-gate
      - from: coverage-policy-gate
        to: coverage-repair
        condition: 'output.value == true'
      - from: coverage-policy-gate
        to: report
        condition: 'output.value == false'
      - from: coverage-repair
        to: generation
      - from: report
        to: done
