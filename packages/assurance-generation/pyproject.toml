[project]
name = "assurance-generation"
version = "0.1.0"
description = "Assurance generation capability wheel"
requires-python = ">=3.11,<4.0"
dependencies = [
    "agent-runtime-contracts",
    "assurance-intake==0.1.0",
    "graph-engine",
    "pydantic>=2.7",
]

[project.entry-points."graph_engine.plugins"]
generation = "assurance_generation.plugin:GenerationPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assurance_generation"]

[tool.uv.sources]
agent-runtime-contracts = { workspace = true }
assurance-intake = { workspace = true }
graph-engine = { workspace = true }
