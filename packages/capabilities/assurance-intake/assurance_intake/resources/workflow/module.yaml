schema_version: "1"
role: feature
owner_id: assurance.intake
module_id: assurance.intake.workflow
module_version: 0.2.0
imports: {}
exports:
  prepare:
    graph: entry
    input_schema: assurance.intake.workflow.prepare.input.v1
    output_schema: assurance.intake.workflow.prepare.output.v1
    output_projection:
      type: object
      fields:
        artifacts:
          type: child_output_pointer
          pointer: /artifacts
        decision:
          type: child_output_pointer
          pointer: /decision
  case:
    graph: case
    input_schema: assurance.intake.workflow.case.input.v1
    output_schema: assurance.intake.workflow.case.output.v1
    output_projection:
      type: object
      fields:
        artifacts:
          type: child_output_pointer
          pointer: /artifacts
        decision:
          type: child_output_pointer
          pointer: /decision
capability_slots:
  case-design.execute:
    contract_id: assurance.intake.agent.case-design.v1
  case-design.finalize:
    contract_id: assurance.intake.agent.case-design.v1
  case-design.prepare:
    contract_id: assurance.intake.agent.case-design.v1
  case-review.execute:
    contract_id: assurance.intake.agent.case-review.v1
  case-review.finalize:
    contract_id: assurance.intake.agent.case-review.v1
  case-review.prepare:
    contract_id: assurance.intake.agent.case-review.v1
  explore.execute:
    contract_id: assurance.intake.agent.explore.v1
  explore.finalize:
    contract_id: assurance.intake.agent.explore.v1
  explore.prepare:
    contract_id: assurance.intake.agent.explore.v1
  intake.execute:
    contract_id: assurance.intake.agent.intake.v1
  intake.finalize:
    contract_id: assurance.intake.agent.intake.v1
  intake.prepare:
    contract_id: assurance.intake.agent.intake.v1
schemas:
  - assurance.intake.workflow.case.input.v1
  - assurance.intake.workflow.case.output.v1
  - assurance.intake.workflow.prepare.input.v1
  - assurance.intake.workflow.prepare.output.v1
resources: []
effects: []
retry:
  once:
    max_attempts: 1
  agent-transient:
    max_attempts: 12
    retry_on:
      - transient
timeout:
  short:
    run_seconds: 3600
graphs:
  entry:
    max_activations: 32
    start: intake
    nodes:
      intake:
        kind: subgraph
        graph: intake
        input_projection:
          type: object
          fields:
            allowed_artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            requirement:
              type: graph_input_pointer
              pointer: /requirement
      explore:
        kind: subgraph
        graph: explore
        input_projection:
          type: object
          fields:
            allowed_artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            change_id:
              type: graph_input_pointer
              pointer: /change_id
      case-design:
        kind: subgraph
        graph: case-design
        input_projection: &case_design_input
          type: object
          fields:
            allowed_artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            case_delta_paths:
              type: graph_input_pointer
              pointer: /case_delta_paths
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            selected_test_families:
              type: graph_input_pointer
              pointer: /selected_test_families
            rounds_used:
              type: literal
              value: 0
            rounds_budget:
              type: literal
              value: 2
      case-review:
        kind: subgraph
        graph: case-review
        input: &review_round_seed
          rounds_used: 0
          rounds_budget: 2
        input_projection: &case_review_input
          type: object
          fields:
            allowed_artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            case_delta_paths:
              type: graph_input_pointer
              pointer: /case_delta_paths
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            rounds_used:
              type: literal
              value: 0
            rounds_budget:
              type: literal
              value: 2
        routing: {mode: exclusive}
      review-round-advance:
        kind: task
        capability: assurance.intake.review-round.advance
        input: *review_round_seed
        input_projection: &advance_from_config
          type: object
          fields:
            rounds_used:
              type: config_pointer
              pointer: /rounds_used
            rounds_budget:
              type: config_pointer
              pointer: /rounds_budget
        retry: once
        timeout: short
      advance-join:
        kind: join
        join: any
      case-design-retry:
        kind: subgraph
        graph: case-design
        input_projection: &case_design_retry_input
          type: object
          fields:
            allowed_artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            case_delta_paths:
              type: graph_input_pointer
              pointer: /case_delta_paths
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            selected_test_families:
              type: graph_input_pointer
              pointer: /selected_test_families
            rounds_used:
              type: predecessor_pointer
              predecessor: advance-join
              pointer: /tokens/0/rounds_used
            rounds_budget:
              type: predecessor_pointer
              predecessor: advance-join
              pointer: /tokens/0/rounds_budget
      case-review-retry:
        kind: subgraph
        graph: case-review
        input_projection: &case_review_retry_input
          type: object
          fields:
            allowed_artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            case_delta_paths:
              type: graph_input_pointer
              pointer: /case_delta_paths
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            rounds_used:
              type: predecessor_pointer
              predecessor: case-design-retry
              pointer: /rounds_used
            rounds_budget:
              type: predecessor_pointer
              predecessor: case-design-retry
              pointer: /rounds_budget
        routing: {mode: exclusive}
      review-round-advance-retry:
        kind: task
        capability: assurance.intake.review-round.advance
        input_projection:
          type: object
          fields:
            rounds_used:
              type: predecessor_pointer
              predecessor: case-review-retry
              pointer: /rounds_used
            rounds_budget:
              type: predecessor_pointer
              predecessor: case-review-retry
              pointer: /rounds_budget
        retry: once
        timeout: short
      human-review:
        kind: interrupt
        reason: needs_human_review
        actions: [approve, reject, request_rework]
        input_projection:
          type: object
          fields:
            rounds_used: {type: literal, value: 0}
            rounds_budget: {type: literal, value: 2}
        routing: {mode: exclusive}
      human-review-retry:
        kind: interrupt
        reason: needs_human_review
        actions: [approve, reject, request_rework]
        input_projection:
          type: object
          fields:
            rounds_used:
              type: predecessor_pointer
              predecessor: case-review-retry
              pointer: /rounds_used
            rounds_budget:
              type: predecessor_pointer
              predecessor: case-review-retry
              pointer: /rounds_budget
        routing: {mode: exclusive}
      review-round-advance-rework-retry:
        kind: task
        capability: assurance.intake.review-round.advance
        input: {rounds_used: 1, rounds_budget: 2}
        input_projection: *advance_from_config
        retry: once
        timeout: short
      rejected:
        kind: end
      exhausted:
        kind: end
      done:
        kind: end
    edges:
      - {from: intake, to: explore}
      - {from: explore, to: case-design}
      - {from: case-design, to: case-review}
      - {from: case-review, to: done, condition: "(output.decision == 'pass' or output.decision == 'approved') and output.human_review_required == false"}
      - {from: case-review, to: review-round-advance, condition: "(output.decision == 'needs_fix' or output.decision == 'changes_requested') and output.auto_fix_allowed == true and output.human_review_required == false and input.rounds_used < input.rounds_budget"}
      - {from: case-review, to: rejected, condition: "output.decision == 'reject' and output.human_review_required == false"}
      - {from: case-review, to: human-review, condition: "output.decision == 'needs_human_review' or output.human_review_required == true"}
      - {from: case-review, to: exhausted, otherwise: true}
      - {from: human-review, to: done, condition: "output.action == 'approve'"}
      - {from: human-review, to: rejected, condition: "output.action == 'reject'"}
      - {from: human-review, to: review-round-advance, condition: "output.action == 'request_rework' and input.rounds_used < input.rounds_budget"}
      - {from: human-review, to: exhausted, otherwise: true}
      - {from: review-round-advance, to: advance-join}
      - {from: review-round-advance-retry, to: advance-join}
      - {from: review-round-advance-rework-retry, to: advance-join}
      - {from: advance-join, to: case-design-retry}
      - {from: case-design-retry, to: case-review-retry}
      - {from: case-review-retry, to: done, condition: "(output.decision == 'pass' or output.decision == 'approved') and output.human_review_required == false"}
      - {from: case-review-retry, to: review-round-advance-retry, condition: "(output.decision == 'needs_fix' or output.decision == 'changes_requested') and output.auto_fix_allowed == true and output.human_review_required == false and input.rounds_used < input.rounds_budget"}
      - {from: case-review-retry, to: rejected, condition: "output.decision == 'reject' and output.human_review_required == false"}
      - {from: case-review-retry, to: human-review-retry, condition: "output.decision == 'needs_human_review' or output.human_review_required == true"}
      - {from: case-review-retry, to: exhausted, otherwise: true}
      - {from: human-review-retry, to: done, condition: "output.action == 'approve'"}
      - {from: human-review-retry, to: rejected, condition: "output.action == 'reject'"}
      - {from: human-review-retry, to: review-round-advance-rework-retry, condition: "output.action == 'request_rework' and input.rounds_used < input.rounds_budget"}
      - {from: human-review-retry, to: exhausted, otherwise: true}
  case:
    max_activations: 6
    start: case-design
    nodes:
      case-design:
        kind: subgraph
        graph: case-design
        input_projection: *case_design_input
      case-review:
        kind: subgraph
        graph: case-review
        input: *review_round_seed
        input_projection: *case_review_input
      done:
        kind: end
    edges:
      - {from: case-design, to: case-review}
      - {from: case-review, to: done}
  intake:
    max_activations: 8
    start: prepare
    nodes:
      prepare:
        kind: task
        capability_slot: intake.prepare
        input:
          capability_leafs: []
        input_projection:
          type: object
          fields:
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            requirement:
              type: graph_input_pointer
              pointer: /requirement
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
        retry: once
        timeout: short
      execute:
        kind: task
        capability_slot: intake.execute
        input_projection:
          type: predecessor
          predecessor: prepare
        retry: agent-transient
        timeout: short
      finalize:
        kind: task
        capability_slot: intake.finalize
        input:
          capability_leafs: []
        input_projection:
          type: object
          fields:
            agent_result:
              type: predecessor
              predecessor: execute
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
        retry: once
        timeout: short
      done:
        kind: end
    edges:
      - {from: prepare, to: execute}
      - {from: execute, to: finalize}
      - {from: finalize, to: done}
  explore:
    max_activations: 8
    start: prepare
    nodes:
      prepare:
        kind: task
        capability_slot: explore.prepare
        input:
          capability_leafs: []
        input_projection:
          type: object
          fields:
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
        resources:
          parameters:
            change_id: /change_id
          reads:
            - qa
          writes:
            - qa/changes/{change_id}/explore/context.json
        retry: once
        timeout: short
      execute:
        kind: task
        capability_slot: explore.execute
        input_projection:
          type: predecessor
          predecessor: prepare
        retry: agent-transient
        timeout: short
      finalize:
        kind: task
        capability_slot: explore.finalize
        input:
          capability_leafs: []
        input_projection:
          type: object
          fields:
            agent_result:
              type: predecessor
              predecessor: execute
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
        retry: once
        timeout: short
      done:
        kind: end
    edges:
      - {from: prepare, to: execute}
      - {from: execute, to: finalize}
      - {from: finalize, to: done}
  case-design:
    max_activations: 8
    start: prepare
    nodes:
      prepare:
        kind: task
        capability_slot: case-design.prepare
        routing: {mode: fanout, min_matches: 2}
        input:
          capability_leafs: []
        input_projection:
          type: object
          fields:
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            selected_test_families:
              type: graph_input_pointer
              pointer: /selected_test_families
            case_delta_paths:
              type: graph_input_pointer
              pointer: /case_delta_paths
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
        retry: once
        timeout: short
      execute:
        kind: task
        capability_slot: case-design.execute
        input_projection:
          type: predecessor
          predecessor: prepare
        retry: agent-transient
        timeout: short
      finalize-inputs:
        kind: join
        join: all
      finalize:
        kind: task
        capability_slot: case-design.finalize
        input:
          capability_leafs: []
        input_projection:
          type: object
          fields:
            agent_result:
              type: predecessor_pointer
              predecessor: finalize-inputs
              pointer: /tokens/1
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            selected_test_families:
              type: graph_input_pointer
              pointer: /selected_test_families
            case_delta_paths:
              type: graph_input_pointer
              pointer: /case_delta_paths
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
            review_repair:
              type: predecessor_pointer
              predecessor: finalize-inputs
              pointer: /tokens/0/instructions/2/json_content/review_repair
            rounds_used:
              type: graph_input_pointer
              pointer: /rounds_used
            rounds_budget:
              type: graph_input_pointer
              pointer: /rounds_budget
            validation_attempt: {type: literal, value: 0}
        routing: {mode: exclusive}
        retry: once
        timeout: short
      repair-prepare:
        kind: task
        capability_slot: case-design.prepare
        routing: {mode: fanout, min_matches: 2}
        input:
          capability_leafs: []
        input_projection:
          type: object
          fields:
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            selected_test_families:
              type: graph_input_pointer
              pointer: /selected_test_families
            case_delta_paths:
              type: graph_input_pointer
              pointer: /case_delta_paths
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
            validation_attempt:
              type: predecessor_pointer
              predecessor: finalize
              pointer: /validation_attempt
            validation_error:
              type: predecessor_pointer
              predecessor: finalize
              pointer: /validation_error
            review_repair:
              type: predecessor_pointer
              predecessor: finalize
              pointer: /review_repair
        retry: once
        timeout: short
      repair-execute:
        kind: task
        capability_slot: case-design.execute
        input_projection:
          type: predecessor
          predecessor: repair-prepare
        retry: agent-transient
        timeout: short
      repair-finalize-inputs:
        kind: join
        join: all
      repair-finalize:
        kind: task
        capability_slot: case-design.finalize
        input:
          capability_leafs: []
        input_projection:
          type: object
          fields:
            agent_result:
              type: predecessor_pointer
              predecessor: repair-finalize-inputs
              pointer: /tokens/1
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            selected_test_families:
              type: graph_input_pointer
              pointer: /selected_test_families
            case_delta_paths:
              type: graph_input_pointer
              pointer: /case_delta_paths
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
            review_repair:
              type: predecessor_pointer
              predecessor: repair-finalize-inputs
              pointer: /tokens/0/instructions/2/json_content/review_repair
            rounds_used:
              type: graph_input_pointer
              pointer: /rounds_used
            rounds_budget:
              type: graph_input_pointer
              pointer: /rounds_budget
            validation_attempt: {type: literal, value: 1}
        retry: once
        timeout: short
      done:
        kind: end
    edges:
      - {from: prepare, to: execute}
      - {from: prepare, to: finalize-inputs}
      - {from: execute, to: finalize-inputs}
      - {from: finalize-inputs, to: finalize}
      - {from: finalize, to: done, condition: "output.validation_status == 'pass'"}
      - {from: finalize, to: repair-prepare, otherwise: true}
      - {from: repair-prepare, to: repair-execute}
      - {from: repair-prepare, to: repair-finalize-inputs}
      - {from: repair-execute, to: repair-finalize-inputs}
      - {from: repair-finalize-inputs, to: repair-finalize}
      - {from: repair-finalize, to: done}
  case-review:
    max_activations: 8
    start: prepare
    nodes:
      prepare:
        kind: task
        capability_slot: case-review.prepare
        input:
          capability_leafs: []
        input_projection:
          type: object
          fields:
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            case_delta_paths:
              type: graph_input_pointer
              pointer: /case_delta_paths
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
        retry: once
        timeout: short
      execute:
        kind: task
        capability_slot: case-review.execute
        input_projection:
          type: predecessor
          predecessor: prepare
        retry: agent-transient
        timeout: short
      finalize:
        kind: task
        capability_slot: case-review.finalize
        input:
          capability_leafs: []
        input_projection:
          type: object
          fields:
            agent_result:
              type: predecessor
              predecessor: execute
            change_id:
              type: graph_input_pointer
              pointer: /change_id
            case_delta_paths:
              type: graph_input_pointer
              pointer: /case_delta_paths
            capability_leafs:
              type: graph_input_pointer
              pointer: /capability_leafs
            artifact_paths:
              type: graph_input_pointer
              pointer: /allowed_artifact_paths
            rounds_used:
              type: graph_input_pointer
              pointer: /rounds_used
            rounds_budget:
              type: graph_input_pointer
              pointer: /rounds_budget
        retry: once
        timeout: short
      done:
        kind: end
    edges:
      - {from: prepare, to: execute}
      - {from: execute, to: finalize}
      - {from: finalize, to: done}
