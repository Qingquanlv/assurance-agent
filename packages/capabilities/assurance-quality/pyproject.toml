[project]
name = "assurance-quality"
version = "0.2.0"
description = "Assurance quality capability wheel"
requires-python = ">=3.11,<4.0"
dependencies = [
    "agent-runtime-contracts",
    "assurance-intake==0.2.0",
    "assurance-generation==0.2.0",
    "assurance-execution==0.2.0",
    "assurance-healing==0.2.0",
    "graph-engine",
    "langgraph==1.2.11",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.entry-points."graph_engine.plugins"]
quality = "assurance_quality.plugin:QualityPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assurance_quality"]

[tool.uv.sources]
agent-runtime-contracts = { workspace = true }
assurance-intake = { workspace = true }
assurance-generation = { workspace = true }
assurance-execution = { workspace = true }
assurance-healing = { workspace = true }
graph-engine = { workspace = true }
