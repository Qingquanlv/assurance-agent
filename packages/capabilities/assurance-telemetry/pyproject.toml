[project]
name = "assurance-telemetry"
version = "0.2.0"
description = "Assurance telemetry capability wheel"
requires-python = ">=3.11,<4.0"
dependencies = [
    "assurance-generation==0.2.0",
    "assurance-intake==0.2.0",
    "graph-engine",
    "httpx==0.28.1",
    "opentelemetry-api==1.32.1",
    "opentelemetry-sdk==1.32.1",
    "pydantic>=2.7",
]

[project.entry-points."graph_engine.plugins"]
telemetry = "assurance_telemetry.plugin:TelemetryPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assurance_telemetry"]

[tool.uv.sources]
assurance-generation = { workspace = true }
assurance-intake = { workspace = true }
graph-engine = { workspace = true }
