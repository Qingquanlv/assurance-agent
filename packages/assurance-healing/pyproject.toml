[project]
name = "assurance-healing"
version = "0.1.0"
description = "Assurance healing capability wheel"
requires-python = ">=3.11,<4.0"
dependencies = [
    "agent-runtime-contracts",
    "assurance-execution==0.1.0",
    "assurance-generation==0.1.0",
    "assurance-intake==0.1.0",
    "graph-engine",
    "pydantic>=2.7",
]

[project.entry-points."graph_engine.plugins"]
healing = "assurance_healing.plugin:HealingPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assurance_healing"]

[tool.uv.sources]
agent-runtime-contracts = { workspace = true }
assurance-execution = { workspace = true }
assurance-generation = { workspace = true }
assurance-intake = { workspace = true }
graph-engine = { workspace = true }
