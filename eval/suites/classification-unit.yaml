name: classification-unit
version: "1"
scorer: classification-unit
regression:
  repeat: 1
  metrics:
    category_match_rate: {direction: higher_is_better, max_regression: 0.0}
    unknown_rate: {direction: lower_is_better, max_regression: 0.0}
executor:
  type: in_process
  target_module: assurance_agent.eval.scorers.classification_unit
  target_export: score
thresholds:
  - metric: category_match_rate
    gate: hard
    op: gte
    value: 1.0
