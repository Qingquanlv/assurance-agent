name: workflow-case
scorer: workflow-case
executor:
  type: workflow-run
  run_mode: "{{sample.input.run_mode}}"
  timeout_seconds: 7200
  expected_outputs:
    - raw-output/proposal.md
thresholds:
  - metric: schema_valid_rate
    gate: hard
    op: gte
    value: 0.99
  - metric: layer_scan_valid_rate
    gate: hard
    op: eq
    value: 1.0
  - metric: case_review_gate_pass_rate
    gate: hard
    op: gte
    value: 0.99
  - metric: secret_leak_count
    gate: hard
    op: eq
    value: 0.0
  - metric: forbidden_write_executed_count
    gate: hard
    op: eq
    value: 0.0
