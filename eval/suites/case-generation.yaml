name: case-generation
version: "2"
scorer: case-generation
regression:
  repeat: 1
  metrics:
    evidence_integrity: {direction: higher_is_better, max_regression: 0.0}
    schema_valid_rate: {direction: higher_is_better, max_regression: 0.0}
    hallucination_rate: {direction: lower_is_better, max_regression: 0.0}
    requirement_f1: {direction: higher_is_better, max_regression: 0.0}
executor:
  type: workflow-run
  entrypoint: case
  run_mode: case-only
  timeout_seconds: 600
  expected_outputs:
    - cases/system/api/case.yaml
judge:
  model: "gpt-4o"
  prompt_ref: "eval/judge/case-generation-judge.md"
  temperature: 0.0
  confidence_threshold: 0.80
thresholds:
  - metric: hallucination_rate
    gate: hard
    op: lte
    value: 0.05
  - metric: schema_valid_rate
    gate: hard
    op: gte
    value: 0.99
  - metric: path_coverage_rate
    gate: advisory
    op: gte
    value: 0.90
  - metric: risk_coverage_rate
    gate: advisory
    op: gte
    value: 0.80
  - metric: traceability_rate
    gate: advisory
    op: gte
    value: 0.95
  - metric: requirement_f1
    gate: advisory
    op: gte
    value: 0.85
