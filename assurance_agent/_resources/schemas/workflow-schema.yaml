# =============================================================================
# AA Workflow Schema v2 (canonical GraphRuntime)
# =============================================================================
#
# Packaged schema_version must be exactly "2". Topology, gates, and routes are
# the sole orchestration contract for CLI / eval / benchmark.
# =============================================================================

schema_version: "2"
name: aa-full

params:
  run_mode:
    type: enum
    values:
      - full
      - case-only
      - api-only
      - e2e-only
      - plan-only
      - codegen-only
      - review-case
      - review-plan
    default: full
  test_types:
    type: list
    values: [api, e2e, fuzz, performance]
    min_items: 1
    unique: true
    default: [api, e2e]
  run_tests: {type: bool, default: true}
  max_case_fix_attempts: {type: int, default: 3}
  max_plan_fix_attempts: {type: int, default: 3}
  max_healing_attempts: {type: int, default: 3}
  max_coverage_repair_attempts: {type: int, default: 1}
  auto_archive: {type: bool, default: false}
  force_continue: {type: bool, default: false}
  retro_id: {type: str, default: ""}
  retro_last: {type: int, default: 10}
  retro_min_evidence: {type: int, default: 2}
  retro_dry_run: {type: bool, default: false}
  change_ids: {type: list, default: []}
  batch_scope: {type: object, default: {}}
  since: {type: str, default: ""}
  until: {type: str, default: ""}
  problem_id: {type: str, default: ""}
  review_id: {type: str, default: ""}
  improvement_id: {type: str, default: ""}
  improvement_review_id: {type: str, default: ""}
  delivery_action: {type: str, default: ""}
  delivery_actor: {type: str, default: ""}
  delivery_reason: {type: str, default: ""}
  artifact_digest: {type: str, default: ""}
  expected_target_sha256: {type: str, default: ""}
  expected_applied_digest: {type: str, default: ""}
  expected_l1_digest: {type: str, default: ""}
  subject_sha256: {type: str, default: ""}
  expected_improvement_version: {type: int, default: 0}
  policy_version: {type: str, default: "1"}
  attempt: {type: int, default: 1}
  # Nightly mutation sampling budget (seconds). Collectors in M2 Task 3 read this
  # when non-zero; zero means "use policy.evidence_sufficiency.mutation_budget_seconds".
  mutation_budget_seconds: {type: int, default: 0}

entrypoints:
  full:
    graph: workflow
    allow: "params.run_mode == 'full'"
  intake:
    graph: intake-workflow
    allow: "params.run_mode in ['full', 'case-only', 'review-case']"
  execute:
    graph: execute-workflow
    allow: >
      params.run_mode in
      ['full','api-only','e2e-only','plan-only','codegen-only','review-plan']
  case:
    graph: intake-workflow
    with:
      run_mode: case-only
  archive:
    graph: archive-workflow
    with:
      auto_archive: true
  retro:
    graph: retro-orchestration-workflow
  improvement-auto-review:
    graph: improvement-auto-review-cycle
    restart: repeatable
    allow: "params.improvement_id != '' and params.review_id != '' and params.subject_sha256 != '' and params.expected_improvement_version > 0"
  issue-review:
    graph: issue-review-workflow
    restart: repeatable
    allow: "params.problem_id != '' and params.review_id != ''"
  issue-analyze:
    graph: issue-analyze-workflow
    restart: repeatable
  issue-reconcile:
    graph: issue-reconcile-workflow
    restart: repeatable
  improvement-review:
    graph: improvement-review-workflow
    restart: repeatable
    allow: "params.improvement_id != '' and params.improvement_review_id != ''"
  improvement-evaluate:
    graph: improvement-evaluate-workflow
    restart: repeatable
    allow: "params.improvement_id != ''"
    with:
      delivery_action: evaluate
  improvement-export:
    graph: improvement-export-workflow
    restart: repeatable
    allow: "params.improvement_id != ''"
    with:
      delivery_action: export
  improvement-apply:
    graph: improvement-apply-workflow
    restart: repeatable
    allow: "params.improvement_id != ''"
    with:
      delivery_action: apply
  improvement-rollback:
    graph: improvement-rollback-workflow
    restart: repeatable
    allow: "params.improvement_id != ''"
    with:
      delivery_action: rollback
  # Nightly oracle-strength metrics (Verification Metrics M2). Repeatable;
  # runs against the explicit `--change` change_id (CLI-required). Never
  # reopens a passed PR inspect/metrics.json verdict. Entrypoint allow only
  # sees params (not context), so change_id is not re-gated here.
  metrics-nightly:
    graph: metrics-nightly-workflow
    restart: repeatable

policies:
  retry:
    agent-transient:
      max_attempts: 3
      # invalid_output: registry schema validation of declared must_compat
      # artifacts runs at output freeze; a fresh agent attempt with prior-failure
      # feedback is the intended recovery, so treat it as transient.
      retry_on: [timeout, transport, rate_limit, invalid_output]
      backoff:
        initial_seconds: 2
        multiplier: 2
        max_seconds: 30
        jitter: true
    cli-transient:
      max_attempts: 2
      retry_on: [timeout, transport]
      backoff:
        initial_seconds: 1
        multiplier: 2
        max_seconds: 10
        jitter: true
    never:
      max_attempts: 1
      retry_on: []
    llm-default:
      max_attempts: 3
      retry_on: [timeout, transport, rate_limit, invalid_output]
      backoff:
        initial_seconds: 2
        multiplier: 2
        max_seconds: 30
        jitter: true
    project-sync:
      max_attempts: 3
      retry_on: [conflict, transport]
      backoff:
        initial_seconds: 1
        multiplier: 2
        max_seconds: 15
        jitter: true

  timeout:
    agent:
      run_seconds: 5400
      heartbeat_seconds: 120
    cli:
      run_seconds: 900
      heartbeat_seconds: 30
    local-operation:
      run_seconds: 60
      heartbeat_seconds: 10

  scheduler:
    max_parallel_tasks: 4
    conflict_order: [topology, declaration, task_id]

graphs:
  bootstrap:
    max_supersteps: 5
    nodes:
      registry:
        uses: operation:skill-registry-check
        outputs: [change:registry/skill-registry-check.json]
        gate: registry-gate
        retry: never
        timeout: local-operation
    edges:
      - {from: START, to: registry}
    routes:
      - from: registry
        select: "node('registry').gate.verdict"
        cases: {pass: END, stop: STOP}
        default: STOP

  workflow:
    max_supersteps: 100
    nodes:
      bootstrap:
        uses: graph:bootstrap
      intake:
        uses: graph:intake
      assurance:
        uses: graph:assurance
      archive:
        uses: graph:archive-workflow
        when: "params.auto_archive == true"
    edges:
      - {from: START, to: bootstrap}
      - {from: bootstrap, to: intake}
      - {from: intake, to: assurance}
      - {from: assurance, to: archive, when: "params.auto_archive == true"}
      - {from: assurance, to: END, when: "params.auto_archive == false"}
      - {from: archive, to: END}

  intake-workflow:
    max_supersteps: 50
    nodes:
      bootstrap: {uses: graph:bootstrap}
      intake: {uses: graph:intake}
    edges:
      - {from: START, to: bootstrap}
      - {from: bootstrap, to: intake}
      - {from: intake, to: END}

  execute-workflow:
    max_supersteps: 150
    nodes:
      bootstrap: {uses: graph:bootstrap}
      assurance: {uses: graph:assurance}
    edges:
      - {from: START, to: bootstrap}
      - {from: bootstrap, to: assurance}
      - {from: assurance, to: END}

  archive-workflow:
    max_supersteps: 10
    nodes:
      # Gate runs before the skill: `archive` declares the archive dir as a
      # required output, so a post-hoc gate can only report a stop verdict after
      # the evidence was already copied (and the retry loop would force it).
      precheck:
        uses: builtin:gate
        with: {gate: archive-gate}

      archive:
        uses: skill:aa-archive
        agent: aa-archiver
        outputs: ["project:qa/archive/${context.change_id}/"]
        retry: agent-transient
        timeout: agent
    edges:
      - {from: START, to: precheck}
      - {from: archive, to: END}

    routes:
      - from: precheck
        select: "node('precheck').gate.verdict"
        cases: {pass: archive, stop: STOP}
        default: STOP

  retro-workflow:
    max_supersteps: 40
    nodes:
      drain-reconcile-outbox:
        uses: operation:drain-improvement-outbox
        resources:
          reads:
            - project:qa/improvements/**
          writes:
            - project:qa/improvements/**
          synchronized:
            - project:qa/improvements/**
          exclusive:
            - project:improvement-registry
        retry: never
        timeout: local-operation
      collect-retro-evidence:
        uses: operation:retro-collect-v3
        outputs:
          - project:qa/retro/${params.retro_id}/window.json
          - project:qa/retro/${params.retro_id}/evidence/issue-slice.json
          - project:qa/retro/${params.retro_id}/evidence/workflow-slice.json
          - project:qa/retro/${params.retro_id}/evidence/eval-slice.json
        resources:
          writes:
            - project:qa/retro/${params.retro_id}/window.json
            - project:qa/retro/${params.retro_id}/evidence/**
            - project:qa/retro/${params.retro_id}/signals/discovery.json
            - project:qa/retro/${params.retro_id}/signals/coverage_gap.json
          synchronized:
            - project:qa/archive/**
            - project:qa/changes/**
            - project:qa/issues/**
            - project:qa/eval/**
            - project:qa/retro/${params.retro_id}/**
        retry: never
        timeout: local-operation
        recover:
          errors: [conflict, timeout, transport, rate_limit, auth, invalid_input, invalid_output, forbidden_write, contract, batch_scope_invalid, internal]
          via: recover-collect-failure
          continue_to: reconcile-improvements
      recover-collect-failure:
        uses: operation:record-retro-pipeline-failure
        with: {stage: collect}
        resources:
          writes:
            - project:qa/retro/${params.retro_id}/**
        retry: never
        timeout: local-operation
      analyze-issue:
        uses: skill:aa-retro-issue-analysis
        agent: aa-doc-author
        outputs:
          - project:qa/retro/${params.retro_id}/signals/issue.json
        resources:
          reads:
            - project:qa/retro/${params.retro_id}/evidence/issue-slice.json
            - project:qa/retro/${params.retro_id}/evidence/agent/issue-slice.json
          writes:
            - project:qa/retro/${params.retro_id}/signals/issue.json
        recover:
          errors: [timeout, transport, rate_limit, invalid_output]
          via: record-issue-analysis-failed
          continue_to: issue-settled
        retry: agent-transient
        timeout: agent
      materialize-empty-issue-analysis:
        uses: operation:materialize-empty-retro-analysis
        with: {domain: issue}
        outputs:
          - project:qa/retro/${params.retro_id}/signals/issue.json
        resources:
          reads:
            - project:qa/retro/${params.retro_id}/evidence/issue-slice.json
          writes:
            - project:qa/retro/${params.retro_id}/signals/issue.json
      evidence-gap-fallback:
        uses: operation:retro-evidence-gap-fallback
        outputs:
          - project:qa/retro/${params.retro_id}/signals/issue.json
          - project:qa/retro/${params.retro_id}/signals/workflow.json
          - project:qa/retro/${params.retro_id}/signals/eval.json
          - project:qa/retro/${params.retro_id}/context.json
          - project:qa/retro/${params.retro_id}/context-agent.json
          - project:qa/retro/${params.retro_id}/proposal-candidates.json
          - project:qa/retro/${params.retro_id}/retro-summary.md
        resources:
          reads:
            - project:qa/retro/${params.retro_id}/window.json
            - project:qa/retro/${params.retro_id}/evidence/**
          writes:
            - project:qa/retro/${params.retro_id}/signals/**
            - project:qa/retro/${params.retro_id}/context.json
            - project:qa/retro/${params.retro_id}/context-agent.json
            - project:qa/retro/${params.retro_id}/proposal-candidates.json
            - project:qa/retro/${params.retro_id}/retro-summary.md
        retry: never
        timeout: local-operation
      record-issue-analysis-failed:
        uses: operation:record-analysis-failed
        with: {domain: issue}
        outputs:
          - project:qa/retro/${params.retro_id}/signals/issue.json
        resources:
          reads:
            - project:qa/retro/${params.retro_id}/evidence/issue-slice.json
          writes:
            - project:qa/retro/${params.retro_id}/signals/issue.json
      issue-settled: {uses: operation:no-op}
      analyze-workflow:
        uses: skill:aa-retro-workflow-analysis
        agent: aa-doc-author
        outputs:
          - project:qa/retro/${params.retro_id}/signals/workflow.json
        resources:
          reads:
            - project:qa/retro/${params.retro_id}/evidence/workflow-slice.json
            - project:qa/retro/${params.retro_id}/evidence/agent/workflow-slice.json
          writes:
            - project:qa/retro/${params.retro_id}/signals/workflow.json
        recover:
          errors: [timeout, transport, rate_limit, invalid_output]
          via: record-workflow-analysis-failed
          continue_to: workflow-settled
        retry: agent-transient
        timeout: agent
      materialize-empty-workflow-analysis:
        uses: operation:materialize-empty-retro-analysis
        with: {domain: workflow}
        outputs:
          - project:qa/retro/${params.retro_id}/signals/workflow.json
        resources:
          reads:
            - project:qa/retro/${params.retro_id}/evidence/workflow-slice.json
          writes:
            - project:qa/retro/${params.retro_id}/signals/workflow.json
      record-workflow-analysis-failed:
        uses: operation:record-analysis-failed
        with: {domain: workflow}
        outputs:
          - project:qa/retro/${params.retro_id}/signals/workflow.json
        resources:
          reads:
            - project:qa/retro/${params.retro_id}/evidence/workflow-slice.json
          writes:
            - project:qa/retro/${params.retro_id}/signals/workflow.json
      workflow-settled: {uses: operation:no-op}
      analyze-eval:
        uses: skill:aa-retro-eval-analysis
        agent: aa-doc-author
        outputs:
          - project:qa/retro/${params.retro_id}/signals/eval.json
        resources:
          reads:
            - project:qa/retro/${params.retro_id}/evidence/eval-slice.json
            - project:qa/retro/${params.retro_id}/evidence/agent/eval-slice.json
          writes:
            - project:qa/retro/${params.retro_id}/signals/eval.json
        recover:
          errors: [timeout, transport, rate_limit, invalid_output]
          via: record-eval-analysis-failed
          continue_to: eval-settled
        retry: agent-transient
        timeout: agent
      materialize-empty-eval-analysis:
        uses: operation:materialize-empty-retro-analysis
        with: {domain: eval}
        outputs:
          - project:qa/retro/${params.retro_id}/signals/eval.json
        resources:
          reads:
            - project:qa/retro/${params.retro_id}/evidence/eval-slice.json
          writes:
            - project:qa/retro/${params.retro_id}/signals/eval.json
      record-eval-analysis-failed:
        uses: operation:record-analysis-failed
        with: {domain: eval}
        outputs:
          - project:qa/retro/${params.retro_id}/signals/eval.json
        resources:
          reads:
            - project:qa/retro/${params.retro_id}/evidence/eval-slice.json
          writes:
            - project:qa/retro/${params.retro_id}/signals/eval.json
      eval-settled: {uses: operation:no-op}
      analysis-join:
        uses: builtin:join
        join:
          sources: [issue-settled, workflow-settled, eval-settled]
          mode: all_active
      assemble-retro-context:
        uses: operation:assemble-retro-context-v3
        outputs:
          - project:qa/retro/${params.retro_id}/context.json
          - project:qa/retro/${params.retro_id}/context-agent.json
        resources:
          reads:
            - project:qa/retro/${params.retro_id}/window.json
            - project:qa/retro/${params.retro_id}/evidence/**
            - project:qa/retro/${params.retro_id}/signals/**
          writes:
            - project:qa/retro/${params.retro_id}/context.json
            - project:qa/retro/${params.retro_id}/context-agent.json
            - project:qa/retro/${params.retro_id}/proposal-candidates.json
            - project:qa/retro/${params.retro_id}/retro-summary.md
        retry: never
        timeout: local-operation
        recover:
          errors: [conflict, timeout, transport, rate_limit, auth, invalid_input, invalid_output, forbidden_write, contract, batch_scope_invalid, internal]
          via: recover-assemble-failure
          continue_to: reconcile-improvements
      recover-assemble-failure:
        uses: operation:record-retro-pipeline-failure
        with: {stage: assemble}
        resources:
          writes:
            - project:qa/retro/${params.retro_id}/**
        retry: never
        timeout: local-operation
      propose-improvements:
        uses: skill:aa-retro
        agent: aa-doc-author
        outputs:
          - project:qa/retro/${params.retro_id}/proposal-candidates.json
          - project:qa/retro/${params.retro_id}/retro-summary.md
        resources:
          reads:
            - project:qa/retro/${params.retro_id}/context.json
            - project:qa/retro/${params.retro_id}/context-agent.json
          writes:
            - project:qa/retro/${params.retro_id}/proposal-candidates.json
            - project:qa/retro/${params.retro_id}/retro-summary.md
        retry: agent-transient
        timeout: agent
        recover:
          errors: [conflict, timeout, transport, rate_limit, auth, invalid_input, invalid_output, forbidden_write, contract, batch_scope_invalid, internal]
          via: recover-propose-failure
          continue_to: reconcile-improvements
      recover-propose-failure:
        uses: operation:record-retro-pipeline-failure
        with: {stage: propose}
        resources:
          writes:
            - project:qa/retro/${params.retro_id}/**
        retry: never
        timeout: local-operation
      reconcile-improvements:
        uses: operation:reconcile-improvements
        resources:
          reads:
            - project:qa/retro/${params.retro_id}/context.json
            - project:qa/retro/${params.retro_id}/proposal-candidates.json
            - project:qa/improvements/**
          writes:
            - project:qa/retro/${params.retro_id}/accept-status.json
            - project:qa/retro/${params.retro_id}/review-queue.md
            - project:qa/improvements/**
        retry: never
        timeout: local-operation
        recover:
          errors: [conflict, timeout, transport, rate_limit, auth, invalid_input, invalid_output, forbidden_write, contract, batch_scope_invalid, internal]
          via: recover-reconcile-failure
          continue_to: finalize-retro-status
      recover-reconcile-failure:
        uses: operation:record-retro-pipeline-failure
        with: {stage: reconcile}
        resources:
          writes:
            - project:qa/retro/${params.retro_id}/**
            - project:qa/improvements/outbox/**
        retry: never
        timeout: local-operation
      finalize-retro-status:
        uses: operation:finalize-retro-status
        resources:
          reads:
            - project:qa/retro/${params.retro_id}/**
            - project:qa/improvements/outbox/**
          writes:
            - project:qa/retro/${params.retro_id}/retro-status.json
        retry: never
        timeout: local-operation
    edges:
      - {from: START, to: drain-reconcile-outbox}
      - {from: drain-reconcile-outbox, to: collect-retro-evidence}
      - {from: collect-retro-evidence, to: evidence-gap-fallback, when: "node('collect-retro-evidence').value.all_domain_evidence_absent == true"}
      - {from: collect-retro-evidence, to: analyze-issue, when: "node('collect-retro-evidence').value.all_domain_evidence_absent == false and node('collect-retro-evidence').value.issue_count > 0"}
      - {from: collect-retro-evidence, to: materialize-empty-issue-analysis, when: "node('collect-retro-evidence').value.all_domain_evidence_absent == false and node('collect-retro-evidence').value.issue_count == 0"}
      - {from: collect-retro-evidence, to: analyze-workflow, when: "node('collect-retro-evidence').value.all_domain_evidence_absent == false and node('collect-retro-evidence').value.workflow_count > 0"}
      - {from: collect-retro-evidence, to: materialize-empty-workflow-analysis, when: "node('collect-retro-evidence').value.all_domain_evidence_absent == false and node('collect-retro-evidence').value.workflow_count == 0"}
      - {from: collect-retro-evidence, to: analyze-eval, when: "node('collect-retro-evidence').value.all_domain_evidence_absent == false and node('collect-retro-evidence').value.eval_count > 0"}
      - {from: collect-retro-evidence, to: materialize-empty-eval-analysis, when: "node('collect-retro-evidence').value.all_domain_evidence_absent == false and node('collect-retro-evidence').value.eval_count == 0"}
      - {from: analyze-issue, to: issue-settled}
      - {from: materialize-empty-issue-analysis, to: issue-settled}
      - {from: analyze-workflow, to: workflow-settled}
      - {from: materialize-empty-workflow-analysis, to: workflow-settled}
      - {from: analyze-eval, to: eval-settled}
      - {from: materialize-empty-eval-analysis, to: eval-settled}
      - {from: issue-settled, to: analysis-join}
      - {from: workflow-settled, to: analysis-join}
      - {from: eval-settled, to: analysis-join}
      - {from: analysis-join, to: assemble-retro-context}
      - {from: evidence-gap-fallback, to: reconcile-improvements}
      - {from: assemble-retro-context, to: finalize-retro-status, when: "params.retro_dry_run == true or node('assemble-retro-context').value.signal_count == 0"}
      - {from: assemble-retro-context, to: propose-improvements, when: "params.retro_dry_run == false and node('assemble-retro-context').value.signal_count > 0"}
      - {from: propose-improvements, to: reconcile-improvements}
      - {from: reconcile-improvements, to: finalize-retro-status}
      - {from: finalize-retro-status, to: END}

  improvement-auto-review-cycle:
    max_supersteps: 20
    nodes:
      load-review-subject:
        uses: operation:load-review-subject
        recover:
          errors: [invalid_input, invalid_output, conflict, internal]
          via: record-review-error
          continue_to: END
      review-improvement:
        uses: skill:aa-improvement-reviewer
        agent: aa-reviewer
        resources:
          reads:
            - project:qa/improvements/review-subjects/${params.subject_sha256}.json
            - project:qa/improvements/review-subjects/agent/${params.subject_sha256}.json
        outputs:
          - project:qa/improvements/reviews/${params.review_id}/assessment.json
          - project:qa/improvements/reviews/${params.review_id}/summary.md
        retry: agent-transient
        timeout: agent
        recover:
          errors: [conflict, timeout, transport, rate_limit, auth, invalid_input, invalid_output, forbidden_write, contract, batch_scope_invalid, internal]
          via: record-review-error
          continue_to: END
      validate-improvement-review-assessment:
        uses: operation:validate-improvement-review-assessment
        outputs:
          - project:qa/improvements/reviews/${params.review_id}/gate-input.json
        recover:
          errors: [invalid_output]
          via: record-review-error
          continue_to: END
      improvement-auto-review-gate:
        uses: builtin:gate
        with:
          expression: "node('validate-improvement-review-assessment').value.auto_approve == true"
      apply-auto-approval:
        uses: operation:apply-improvement-auto-review
        with: {verdict: auto_approve}
        recover:
          errors: [invalid_input, invalid_output, conflict, internal]
          via: record-review-error
          continue_to: END
      record-auto-review:
        uses: operation:apply-improvement-auto-review
        with: {verdict: record}
        recover:
          errors: [invalid_input, invalid_output, conflict, internal]
          via: record-review-error
          continue_to: END
      record-review-error:
        uses: operation:record-improvement-auto-review-error
    edges:
      - {from: START, to: load-review-subject}
      - {from: load-review-subject, to: review-improvement}
      - {from: review-improvement, to: validate-improvement-review-assessment}
      - {from: validate-improvement-review-assessment, to: improvement-auto-review-gate}
      - {from: apply-auto-approval, to: END}
      - {from: record-auto-review, to: END}
    routes:
      - from: improvement-auto-review-gate
        select: "node('improvement-auto-review-gate').value"
        cases: {"true": apply-auto-approval, "false": record-auto-review}
        default: record-auto-review

  retro-orchestration-workflow:
    max_supersteps: 16
    nodes:
      run-retro:
        uses: graph:retro-workflow
      select-current-retro-auto-review-items:
        uses: operation:select-current-retro-auto-review-items
        recover:
          errors: [invalid_input, invalid_output, conflict, contract, internal]
          via: record-auto-review-orchestration-error
          continue_to: END
      auto-review-items:
        uses: graph:improvement-auto-review-cycle
        fan_out:
          items: "node('select-current-retro-auto-review-items').value.items"
          item_as: review_item
          key: "${review_item.review_id}"
          max_items: 128
          completion: all
        with:
          improvement_id: "${review_item.improvement_id}"
          subject_sha256: "${review_item.subject_sha256}"
          expected_improvement_version: "${review_item.expected_improvement_version}"
          review_id: "${review_item.review_id}"
          policy_version: "${review_item.policy_version}"
          attempt: "${review_item.attempt}"
        recover:
          errors: [invalid_input, invalid_output, conflict, contract, internal]
          via: record-auto-review-orchestration-error
          continue_to: END
      summarize-auto-review-batch:
        uses: operation:summarize-auto-review-batch
        recover:
          errors: [invalid_input, invalid_output, conflict, internal]
          via: record-auto-review-orchestration-error
          continue_to: END
      record-auto-review-orchestration-error:
        uses: operation:record-auto-review-orchestration-error
    edges:
      - {from: START, to: run-retro}
      - {from: run-retro, to: select-current-retro-auto-review-items}
      - {from: select-current-retro-auto-review-items, to: auto-review-items}
      - {from: auto-review-items, to: summarize-auto-review-batch}
      - {from: summarize-auto-review-batch, to: END}

  intake:
    max_supersteps: 30
    nodes:
      explore:
        uses: skill:aa-explore
        agent: aa-explorer
        when: "params.run_mode in ['full', 'case-only']"
        outputs: [change:explore/advisory.json]
        retry: agent-transient
        timeout: agent

      case-design:
        uses: skill:aa-case-design
        agent: aa-doc-author
        when: "params.run_mode in ['full', 'case-only']"
        outputs:
          - change:.qa.yaml
          - change:proposal.md
          - change:cases/
          - change:trace/minimum-coverage-matrix.yaml
        gate: case-design-gate
        retry: agent-transient
        timeout: agent

      case-review-cycle:
        uses: graph:case-review-cycle

    edges:
      - {from: START, to: explore, when: "params.run_mode in ['full', 'case-only']"}
      - {from: START, to: case-review-cycle, when: "params.run_mode == 'review-case'"}
      - {from: explore, to: case-design}
      - {from: case-review-cycle, to: END}

    routes:
      - from: case-design
        select: "node('case-design').gate.verdict"
        cases: {pass: case-review-cycle, stop: STOP}
        default: STOP

  case-review-cycle:
    max_supersteps: 20
    budgets:
      fix_attempts:
        limit: "params.max_case_fix_attempts"
    nodes:
      review:
        uses: skill:aa-case-reviewer
        agent: aa-reviewer
        outputs: [change:review/case-review.json]
        gate: case-review-gate
        retry: agent-transient
        timeout: agent

      fix:
        uses: skill:aa-case-fixer
        agent: aa-doc-author
        outputs: [change:review/case-review-apply-summary.md]
        retry: agent-transient
        timeout: agent
        budget:
          consume: fix_attempts
          "on": committed
          exhausted_to: exhausted

      human-review:
        uses: builtin:interrupt
        interrupt:
          reason: "case review requires human review"
          checkpoint: case-review-gate
          bind: audited_gate_read
          actions: [fix_and_proceed, accept_risk, stop]

      exhausted:
        uses: operation:stop
        with: {reason: "case fix attempts exhausted"}

    edges:
      - {from: START, to: review}
      - {from: fix, to: review}
      - {from: exhausted, to: STOP}

    routes:
      - from: review
        select: "node('review').gate.verdict"
        cases:
          pass: END
          needs_fix: fix
          needs_human_review: human-review
          reject: STOP
          stop: STOP
        default: STOP
      - from: human-review
        select: "resume.action"
        cases:
          fix_and_proceed: fix
          accept_risk: END
          stop: STOP
        default: STOP

  assurance:
    max_supersteps: 100
    nodes:
      fact-baseline:
        uses: skill:aa-fact-baseline
        agent: aa-doc-author
        when: >
          params.run_mode in
          ['full','api-only','e2e-only','plan-only','review-plan']
        outputs: [change:facts/fact-baseline.json]
        retry: agent-transient
        timeout: agent

      api:
        uses: graph:api-branch
        when: >
          'api' in params.test_types and params.run_mode in
          ['full','api-only','plan-only','review-plan','codegen-only']

      e2e:
        uses: graph:e2e-branch
        when: >
          'e2e' in params.test_types and params.run_mode in
          ['full','e2e-only','plan-only','review-plan','codegen-only']

      fuzz:
        uses: graph:fuzz-branch
        when: >
          'fuzz' in params.test_types and params.run_mode in
          ['full','plan-only','review-plan','codegen-only']

      performance:
        uses: graph:performance-branch
        when: >
          'performance' in params.test_types and params.run_mode in
          ['full','plan-only','review-plan','codegen-only']

      generation-join:
        uses: builtin:join
        join:
          sources: [api, e2e, fuzz, performance]
          mode: all_active

      execution:
        uses: operation:run-tests-and-collect-pr-metrics
        when: >
          params.run_tests == true and
          params.run_mode in ['full','api-only','e2e-only','codegen-only']
        outputs: [change:execution/execution-manifest.yaml]
        retry: cli-transient
        timeout: cli

      inspect-with-issues:
        uses: graph:inspect-with-issues

      healing:
        uses: graph:healing

      # Coverage shortfall repair loop. Between healing (test failures) and
      # materialize (authoritative metrics write). Own budget / safety / status;
      # never writes inspect/metrics.json.
      coverage-repair:
        uses: graph:coverage-repair

      # Single authoritative write of inspect/metrics.json from the latest
      # complete batch. Runs once after coverage-repair returns — aggregates the
      # post-repair batch and remains the sole writer of that path.
      materialize-pr-metrics:
        uses: operation:materialize-pr-metrics
        outputs:
          - change:inspect/metrics.json
        retry: never
        timeout: local-operation

      # PR metric floors / collection gaps, adjudicated by
      # evaluate_metrics_sufficiency (no tautological DSL). Independent of
      # execution final_status and of the quality gate: metrics shortboards must
      # not masquerade as test failures for healing-loop reject or archive stop.
      #
      # Placement matches the trace gate: after healing + coverage-repair
      # complete (post-fixer aborts STOP inside healing and never return here),
      # before report.
      metrics-sufficiency:
        uses: builtin:gate
        with: {gate: metrics-sufficiency-gate}

      metrics-sufficiency-review:
        uses: builtin:interrupt
        interrupt:
          reason: "verification metrics sufficiency requires human review"
          checkpoint: metrics-sufficiency-gate
          bind: audited_gate_read
          actions: [accept_risk, stop]

      # Case-evidence sufficiency, adjudicated once, here — after healing has had
      # its attempts and before the report is written. Independent of the quality
      # gate on purpose: `final_status` says what the execution found, this says
      # whether the evidence behind it is good enough to believe (spec M1). A
      # `stop` therefore pre-empts `report`, which is the accepted sequencing: a
      # quality report over evidence the gate refused would be the most
      # authoritative-looking document in the change.
      #
      # Reaching this node at all means healing *completed*, and healing only
      # completes on paths where the facts document describes the tests on disk:
      # its post-fixer aborts route to `STOP` inside the subgraph rather than
      # returning here (see the healing routes below).
      trace-sufficiency:
        uses: builtin:gate
        with: {gate: trace-sufficiency-gate}

      trace-sufficiency-review:
        uses: builtin:interrupt
        interrupt:
          reason: "case evidence sufficiency requires human review"
          checkpoint: trace-sufficiency-gate
          bind: audited_gate_read
          # No `fix_and_proceed`: healing has already run and returned by now, so
          # offering it would route to a node that cannot help.
          actions: [accept_risk, stop]

      report:
        uses: operation:generate-report
        outputs:
          - change:report/quality-report.json
          - change:report/quality-report.md
          - change:report/executive-summary.md
        retry: never
        timeout: local-operation

    edges:
      - {from: START, to: fact-baseline, when: "params.run_mode != 'codegen-only'"}
      - {from: START, to: api, when: "params.run_mode == 'codegen-only'"}
      - {from: START, to: e2e, when: "params.run_mode == 'codegen-only'"}
      - {from: START, to: fuzz, when: "params.run_mode == 'codegen-only'"}
      - {from: START, to: performance, when: "params.run_mode == 'codegen-only'"}
      # Guard the fact-baseline fan-out so it is mutually exclusive with the
      # codegen-only START edges above. Without the guard, a run where
      # fact-baseline is already succeeded (e.g. an imported checkpoint / eval
      # fixture seeded at plan tier) AND run_mode == 'codegen-only' would deliver
      # BOTH edge:START and edge:fact-baseline into api/e2e/fuzz/performance,
      # tripping the "selected by 2 non-mutually-exclusive incoming paths" planner
      # error. codegen-only re-entry reads seeded facts from disk, not via token.
      - {from: fact-baseline, to: api, when: "params.run_mode != 'codegen-only'"}
      - {from: fact-baseline, to: e2e, when: "params.run_mode != 'codegen-only'"}
      - {from: fact-baseline, to: fuzz, when: "params.run_mode != 'codegen-only'"}
      - {from: fact-baseline, to: performance, when: "params.run_mode != 'codegen-only'"}
      - {from: api, to: generation-join}
      - {from: e2e, to: generation-join}
      - {from: fuzz, to: generation-join}
      - {from: performance, to: generation-join}
      - {from: generation-join, to: execution, when: "params.run_tests == true"}
      - {from: generation-join, to: END, when: "params.run_tests == false"}
      - {from: execution, to: inspect-with-issues}
      - {from: inspect-with-issues, to: healing}
      - {from: healing, to: coverage-repair}
      - {from: coverage-repair, to: materialize-pr-metrics}
      - {from: materialize-pr-metrics, to: metrics-sufficiency}
      - {from: report, to: END}

    routes:
      - from: metrics-sufficiency
        select: "node('metrics-sufficiency').gate.verdict"
        cases:
          pass: trace-sufficiency
          skip: trace-sufficiency
          needs_human_review: metrics-sufficiency-review
          stop: STOP
          # A collection gap ("no number to judge") blocks release
          # (`archive-gate` below now reads `inspect/metrics.json` too) but is
          # not a reason to end the run before report/archive/retro — mirrors
          # `trace-sufficiency`'s own `reject: report` a few lines down.
          reject: trace-sufficiency
        default: STOP

      - from: metrics-sufficiency-review
        select: "resume.action"
        cases:
          accept_risk: trace-sufficiency
          stop: STOP
        default: STOP

      # `report` has no plain incoming edge. Trusted evidence reaches it whether
      # the quality disposition is pass or reject; unreadable evidence still
      # stops before a report can look authoritative.
      - from: trace-sufficiency
        select: "node('trace-sufficiency').gate.verdict"
        cases:
          pass: report
          needs_human_review: trace-sufficiency-review
          stop: STOP
          reject: report
        default: STOP

      - from: trace-sufficiency-review
        select: "resume.action"
        cases:
          accept_risk: report
          stop: STOP
        default: STOP

  api-branch:
    max_supersteps: 30
    nodes:
      plan:
        uses: skill:aa-api-plan
        agent: aa-doc-author
        when: "params.run_mode in ['full','api-only','plan-only','review-plan']"
        outputs:
          - change:plans/api-plan.md
          - change:plans/api-test-data-plan.md
          - change:plans/api-codegen-plan.md
          - change:plans/m3-review-summary.md
        retry: agent-transient
        timeout: agent

      review-cycle:
        uses: graph:api-plan-cycle

      # Hard precondition, evaluated before codegen: an attached gate on `codegen`
      # can only report after the suite was already generated.
      codegen-precheck:
        uses: builtin:gate
        with: {gate: api-codegen-precondition-gate}

      codegen:
        uses: skill:aa-api-codegen
        agent: aa-test-author
        when: "params.run_mode in ['full','api-only','codegen-only']"
        outputs:
          - change:codegen/api-codegen-summary.md
          - change:codegen/api-generated-files.json
        retry: agent-transient
        timeout: agent

    edges:
      - {from: START, to: plan, when: "params.run_mode != 'codegen-only'"}
      - {from: START, to: review-cycle, when: "params.run_mode == 'codegen-only'"}
      - {from: plan, to: review-cycle}
      - {from: review-cycle, to: codegen-precheck, when: "params.run_mode in ['full','api-only','codegen-only']"}
      - {from: review-cycle, to: END, when: "params.run_mode in ['plan-only','review-plan']"}
      - {from: codegen, to: END}

    routes:
      - from: codegen-precheck
        select: "node('codegen-precheck').gate.verdict"
        cases: {pass: codegen, skip: END, stop: STOP}
        default: STOP

  api-plan-cycle:
    max_supersteps: 20
    budgets:
      fix_attempts:
        limit: "params.max_plan_fix_attempts"
    nodes:
      applicability:
        uses: operation:derive-plan-layer-applicability
        with: {layer: api}

      review:
        uses: skill:aa-api-plan-reviewer
        agent: aa-reviewer
        outputs: [change:review/api-plan-review.json, change:review/api-plan-review-summary.md]
        retry: agent-transient
        timeout: agent

      mechanical-plan-checks:
        uses: operation:verify-plan-mechanical
        with: {layer: api, require_review: true}
        outputs: [change:review/api-plan-checks.json]
        resources:
          writes:
            - change:review/api-plan-checks.json
          reads:
            - change:plans/api-plan.md
            - change:plans/api-test-data-plan.md
            - change:plans/api-codegen-plan.md
            - change:review/api-plan-review.json
            - change:cases/**
            - repo:.aa/data-knowledge.yaml
          synchronized:
            - project:.aa/data-knowledge.yaml
          exclusive:
            - project:data-knowledge

      review-gate:
        uses: builtin:gate
        with: {gate: api-plan-review-gate}

      fix:
        uses: skill:aa-api-plan-fixer
        agent: aa-doc-author
        outputs: [change:review/api-plan-review-apply-summary.md]
        retry: agent-transient
        timeout: agent
        budget:
          consume: fix_attempts
          "on": committed
          exhausted_to: exhausted

      human-review:
        uses: builtin:interrupt
        interrupt:
          reason: "api plan review requires human review"
          checkpoint: api-plan-review-gate
          bind: audited_gate_read
          actions: [fix_and_proceed, accept_risk, stop]

      knowledge-remediation:
        uses: builtin:interrupt
        interrupt:
          reason: "api plan review requires L1 capability remediation (aa knowledge promote)"
          checkpoint: api-plan-review-gate
          bind: audited_gate_read
          actions: [fix_and_proceed, accept_risk, stop]

      exhausted:
        uses: operation:stop
        with: {reason: "api plan fix attempts exhausted"}

    edges:
      - {from: START, to: applicability}
      - {from: review, to: mechanical-plan-checks}
      - {from: mechanical-plan-checks, to: review-gate}
      - {from: fix, to: review}
      - {from: exhausted, to: STOP}

    routes:
      - from: applicability
        select: "node('applicability').value.applicable"
        cases: {"true": review, "false": mechanical-plan-checks}
        default: STOP
      - from: review-gate
        select: "plan_review_route('review-gate')"
        cases:
          pass: END
          skip: END
          needs_fix: fix
          knowledge_remediation: knowledge-remediation
          needs_human_review: human-review
          reject: STOP
          stop: STOP
        default: STOP
      - from: human-review
        select: "resume.action"
        cases:
          fix_and_proceed: fix
          accept_risk: END
          stop: STOP
        default: STOP
      - from: knowledge-remediation
        select: "resume.action"
        cases:
          fix_and_proceed: mechanical-plan-checks
          accept_risk: END
          stop: STOP
        default: STOP

  e2e-branch:
