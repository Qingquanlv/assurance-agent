  e2e-plan-cycle:
    max_supersteps: 20
    budgets:
      fix_attempts:
        limit: "params.max_plan_fix_attempts"
    nodes:
      applicability:
        uses: operation:derive-plan-layer-applicability
        with: {layer: e2e}

      review:
