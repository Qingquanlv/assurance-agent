# =============================================================================
# AA Workflow Schema v2 (canonical GraphRuntime)
# =============================================================================
#
# Packaged schema_version must be exactly "2". Topology, gates, and routes are
# the sole orchestration contract for CLI / eval / benchmark.
# =============================================================================

schema_version: "2"
name: aa-full

params:
  run_mode:
    type: enum
    values:
      - full
      - case-only
      - api-only
      - e2e-only
      - plan-only
      - codegen-only
      - review-case
      - review-plan
    default: full
  test_types:
    type: list
    values: [api, e2e, fuzz, performance]
    min_items: 1
    unique: true
    default: [api, e2e]
  run_tests: {type: bool, default: true}
  max_case_fix_attempts: {type: int, default: 3}
  max_plan_fix_attempts: {type: int, default: 3}
  max_healing_attempts: {type: int, default: 3}
  auto_archive: {type: bool, default: false}
  force_continue: {type: bool, default: false}
  retro_id: {type: str, default: ""}
  retro_last: {type: int, default: 10}
  retro_min_evidence: {type: int, default: 2}
  retro_dry_run: {type: bool, default: false}
  change_ids: {type: list, default: []}
  since: {type: str, default: ""}
  until: {type: str, default: ""}
  problem_id: {type: str, default: ""}
  review_id: {type: str, default: ""}

entrypoints:
  full:
    graph: workflow
    allow: "params.run_mode == 'full'"
  intake:
    graph: intake-workflow
    allow: "params.run_mode in ['full', 'case-only', 'review-case']"
  execute:
    graph: execute-workflow
    allow: >
      params.run_mode in
      ['full','api-only','e2e-only','plan-only','codegen-only','review-plan']
  case:
    graph: intake-workflow
    with:
      run_mode: case-only
  archive:
    graph: archive-workflow
    with:
      auto_archive: true
  retro:
    graph: retro-workflow
  issue-review:
    graph: issue-review-workflow
    restart: repeatable
    allow: "params.problem_id != '' and params.review_id != ''"
  issue-analyze:
    graph: issue-analyze-workflow
    restart: repeatable
  issue-reconcile:
    graph: issue-reconcile-workflow
    restart: repeatable

policies:
  retry:
    agent-transient:
      max_attempts: 3
      # invalid_output: registry schema validation of declared must_compat
      # artifacts runs at output freeze; a fresh agent attempt with prior-failure
      # feedback is the intended recovery, so treat it as transient.
      retry_on: [timeout, transport, rate_limit, invalid_output]
      backoff:
        initial_seconds: 2
        multiplier: 2
        max_seconds: 30
        jitter: true
    cli-transient:
      max_attempts: 2
      retry_on: [timeout, transport]
      backoff:
        initial_seconds: 1
        multiplier: 2
        max_seconds: 10
        jitter: true
    never:
      max_attempts: 1
      retry_on: []
    llm-default:
      max_attempts: 3
      retry_on: [timeout, transport, rate_limit, invalid_output]
      backoff:
        initial_seconds: 2
        multiplier: 2
        max_seconds: 30
        jitter: true
    project-sync:
      max_attempts: 3
      retry_on: [conflict, transport]
      backoff:
        initial_seconds: 1
        multiplier: 2
        max_seconds: 15
        jitter: true

  timeout:
    agent:
      run_seconds: 5400
      heartbeat_seconds: 120
    cli:
      run_seconds: 900
      heartbeat_seconds: 30
    local-operation:
      run_seconds: 60
      heartbeat_seconds: 10

  scheduler:
    max_parallel_tasks: 4
    conflict_order: [topology, declaration, task_id]

graphs:
  bootstrap:
    max_supersteps: 5
    nodes:
      registry:
        uses: operation:skill-registry-check
        outputs: [change:registry/skill-registry-check.json]
        gate: registry-gate
        retry: never
        timeout: local-operation
    edges:
      - {from: START, to: registry}
    routes:
      - from: registry
        select: "node('registry').gate.verdict"
        cases: {pass: END, stop: STOP}
        default: STOP

  workflow:
    max_supersteps: 100
    nodes:
      bootstrap:
        uses: graph:bootstrap
      intake:
        uses: graph:intake
      assurance:
        uses: graph:assurance
      archive:
        uses: graph:archive-workflow
        when: "params.auto_archive == true"
    edges:
      - {from: START, to: bootstrap}
      - {from: bootstrap, to: intake}
      - {from: intake, to: assurance}
      - {from: assurance, to: archive, when: "params.auto_archive == true"}
      - {from: assurance, to: END, when: "params.auto_archive == false"}
      - {from: archive, to: END}

  intake-workflow:
    max_supersteps: 50
    nodes:
      bootstrap: {uses: graph:bootstrap}
      intake: {uses: graph:intake}
    edges:
      - {from: START, to: bootstrap}
      - {from: bootstrap, to: intake}
      - {from: intake, to: END}

  execute-workflow:
    max_supersteps: 150
    nodes:
      bootstrap: {uses: graph:bootstrap}
      assurance: {uses: graph:assurance}
    edges:
      - {from: START, to: bootstrap}
      - {from: bootstrap, to: assurance}
      - {from: assurance, to: END}

  archive-workflow:
    max_supersteps: 10
    nodes:
      # Gate runs before the skill: `archive` declares the archive dir as a
      # required output, so a post-hoc gate can only report a stop verdict after
      # the evidence was already copied (and the retry loop would force it).
      precheck:
        uses: builtin:gate
        with: {gate: archive-gate}

      archive:
        uses: skill:aa-archive
        agent: aa-archiver
        outputs: ["project:qa/archive/${context.change_id}/"]
        retry: agent-transient
        timeout: agent
    edges:
      - {from: START, to: precheck}
      - {from: archive, to: END}

    routes:
      - from: precheck
        select: "node('precheck').gate.verdict"
        cases: {pass: archive, stop: STOP}
        default: STOP

  retro-workflow:
    max_supersteps: 20
    nodes:
      collect-retro-evidence:
        uses: operation:retro-collect
        outputs:
          - project:qa/retro/${params.retro_id}/context.json
        resources:
          writes:
            - project:qa/retro/${params.retro_id}/context.json
        retry: never
        timeout: local-operation
      propose-improvements:
        uses: skill:aa-retro
        agent: aa-doc-author
        outputs:
          - project:qa/retro/${params.retro_id}/proposal-candidates.json
          - project:qa/retro/${params.retro_id}/retro-summary.md
        resources:
          reads:
            - project:qa/retro/${params.retro_id}/context.json
          writes:
            - project:qa/retro/${params.retro_id}/proposal-candidates.json
            - project:qa/retro/${params.retro_id}/retro-summary.md
        retry: agent-transient
        timeout: agent
      reconcile-improvements:
        uses: operation:reconcile-improvements
        outputs:
          - project:qa/retro/${params.retro_id}/accept-status.json
          - project:qa/retro/${params.retro_id}/review-queue.md
        resources:
          reads:
            - project:qa/retro/${params.retro_id}/context.json
            - project:qa/retro/${params.retro_id}/proposal-candidates.json
            - project:qa/improvements/**
          writes:
            - project:qa/retro/${params.retro_id}/accept-status.json
            - project:qa/retro/${params.retro_id}/review-queue.md
            - project:qa/improvements/**
        retry: never
        timeout: local-operation
    edges:
      - {from: START, to: collect-retro-evidence}
      - {from: collect-retro-evidence, to: END, when: "params.retro_dry_run == true or node('collect-retro-evidence').value.signal_count == 0"}
      - {from: collect-retro-evidence, to: propose-improvements, when: "params.retro_dry_run == false and node('collect-retro-evidence').value.signal_count > 0"}
      - {from: propose-improvements, to: reconcile-improvements}
      - {from: reconcile-improvements, to: END}

  intake:
    max_supersteps: 30
    nodes:
      explore:
        uses: skill:aa-explore
        agent: aa-doc-author
        when: "params.run_mode in ['full', 'case-only']"
        outputs: [change:explore/advisory.json]
        retry: agent-transient
        timeout: agent

      case-design:
        uses: skill:aa-case-design
        agent: aa-doc-author
        when: "params.run_mode in ['full', 'case-only']"
        outputs: [change:.qa.yaml, change:proposal.md, change:cases/]
        gate: case-design-gate
        retry: agent-transient
        timeout: agent

      case-review-cycle:
        uses: graph:case-review-cycle

    edges:
      - {from: START, to: explore, when: "params.run_mode in ['full', 'case-only']"}
      - {from: START, to: case-review-cycle, when: "params.run_mode == 'review-case'"}
      - {from: explore, to: case-design}
      - {from: case-review-cycle, to: END}

    routes:
      - from: case-design
        select: "node('case-design').gate.verdict"
        cases: {pass: case-review-cycle, stop: STOP}
        default: STOP

  case-review-cycle:
    max_supersteps: 20
    budgets:
      fix_attempts:
        limit: "params.max_case_fix_attempts"
    nodes:
      review:
        uses: skill:aa-case-reviewer
        agent: aa-reviewer
        outputs: [change:review/case-review.json]
        gate: case-review-gate
        retry: agent-transient
        timeout: agent

      fix:
        uses: skill:aa-case-fixer
        agent: aa-doc-author
        outputs: [change:review/case-review-apply-summary.md]
        retry: agent-transient
        timeout: agent
        budget:
          consume: fix_attempts
          "on": committed
          exhausted_to: exhausted

      human-review:
        uses: builtin:interrupt
        interrupt:
          reason: "case review requires human review"
          checkpoint: case-review-gate
          bind: audited_gate_read
          actions: [fix_and_proceed, accept_risk, stop]

      exhausted:
        uses: operation:stop
        with: {reason: "case fix attempts exhausted"}

    edges:
      - {from: START, to: review}
      - {from: fix, to: review}
      - {from: exhausted, to: STOP}

    routes:
      - from: review
        select: "node('review').gate.verdict"
        cases:
          pass: END
          needs_fix: fix
          needs_human_review: human-review
          reject: STOP
          stop: STOP
        default: STOP
      - from: human-review
        select: "resume.action"
        cases:
          fix_and_proceed: fix
          accept_risk: END
          stop: STOP
        default: STOP

  assurance:
    max_supersteps: 100
    nodes:
      fact-baseline:
        uses: skill:aa-fact-baseline
        agent: aa-doc-author
        when: >
          params.run_mode in
          ['full','api-only','e2e-only','plan-only','review-plan']
        outputs: [change:facts/fact-baseline.json]
        retry: agent-transient
        timeout: agent

      api:
        uses: graph:api-branch
        when: >
          'api' in params.test_types and params.run_mode in
          ['full','api-only','plan-only','review-plan','codegen-only']

      e2e:
        uses: graph:e2e-branch
        when: >
          'e2e' in params.test_types and params.run_mode in
          ['full','e2e-only','plan-only','review-plan','codegen-only']

      fuzz:
        uses: graph:fuzz-branch
        when: >
          'fuzz' in params.test_types and params.run_mode in
          ['full','plan-only','review-plan','codegen-only']

      performance:
        uses: graph:performance-branch
        when: >
          'performance' in params.test_types and params.run_mode in
          ['full','plan-only','review-plan','codegen-only']

      generation-join:
        uses: builtin:join
        join:
          sources: [api, e2e, fuzz, performance]
          mode: all_active

      execution:
        uses: operation:run-tests
        when: >
          params.run_tests == true and
          params.run_mode in ['full','api-only','e2e-only','codegen-only']
        outputs: [change:execution/execution-manifest.yaml]
        retry: cli-transient
        timeout: cli

      inspect-with-issues:
        uses: graph:inspect-with-issues

      healing:
        uses: graph:healing

      report:
        uses: skill:aa-report-generator
        agent: aa-reporter
        outputs:
          - change:report/quality-report.json
          - change:report/executive-summary.md
        retry: agent-transient
        timeout: agent

    edges:
      - {from: START, to: fact-baseline, when: "params.run_mode != 'codegen-only'"}
      - {from: START, to: api, when: "params.run_mode == 'codegen-only'"}
      - {from: START, to: e2e, when: "params.run_mode == 'codegen-only'"}
      - {from: START, to: fuzz, when: "params.run_mode == 'codegen-only'"}
      - {from: START, to: performance, when: "params.run_mode == 'codegen-only'"}
      # Guard the fact-baseline fan-out so it is mutually exclusive with the
      # codegen-only START edges above. Without the guard, a run where
      # fact-baseline is already succeeded (e.g. an imported checkpoint / eval
      # fixture seeded at plan tier) AND run_mode == 'codegen-only' would deliver
      # BOTH edge:START and edge:fact-baseline into api/e2e/fuzz/performance,
      # tripping the "selected by 2 non-mutually-exclusive incoming paths" planner
      # error. codegen-only re-entry reads seeded facts from disk, not via token.
      - {from: fact-baseline, to: api, when: "params.run_mode != 'codegen-only'"}
      - {from: fact-baseline, to: e2e, when: "params.run_mode != 'codegen-only'"}
      - {from: fact-baseline, to: fuzz, when: "params.run_mode != 'codegen-only'"}
      - {from: fact-baseline, to: performance, when: "params.run_mode != 'codegen-only'"}
      - {from: api, to: generation-join}
      - {from: e2e, to: generation-join}
      - {from: fuzz, to: generation-join}
      - {from: performance, to: generation-join}
      - {from: generation-join, to: execution, when: "params.run_tests == true"}
      - {from: generation-join, to: END, when: "params.run_tests == false"}
      - {from: execution, to: inspect-with-issues}
      - {from: inspect-with-issues, to: healing}
      - {from: healing, to: report}
      - {from: report, to: END}

  api-branch:
    max_supersteps: 30
    nodes:
      plan:
        uses: skill:aa-api-plan
        agent: aa-doc-author
        when: "params.run_mode in ['full','api-only','plan-only','review-plan']"
        outputs:
          - change:plans/api-plan.md
          - change:plans/api-test-data-plan.md
          - change:plans/api-codegen-plan.md
          - change:plans/m3-review-summary.md
        retry: agent-transient
        timeout: agent

      review-cycle:
        uses: graph:api-plan-cycle

      # Hard precondition, evaluated before codegen: an attached gate on `codegen`
      # can only report after the suite was already generated.
      codegen-precheck:
        uses: builtin:gate
        with: {gate: api-codegen-precondition-gate}

      codegen:
        uses: skill:aa-api-codegen
        agent: aa-test-author
        when: "params.run_mode in ['full','api-only','codegen-only']"
        outputs: [change:codegen/api-codegen-summary.md]
        retry: agent-transient
        timeout: agent

    edges:
      - {from: START, to: plan, when: "params.run_mode != 'codegen-only'"}
      - {from: START, to: review-cycle, when: "params.run_mode == 'codegen-only'"}
      - {from: plan, to: review-cycle}
      - {from: review-cycle, to: codegen-precheck, when: "params.run_mode in ['full','api-only','codegen-only']"}
      - {from: review-cycle, to: END, when: "params.run_mode in ['plan-only','review-plan']"}
      - {from: codegen, to: END}

    routes:
      - from: codegen-precheck
        select: "node('codegen-precheck').gate.verdict"
        cases: {pass: codegen, stop: STOP}
        default: STOP

  api-plan-cycle:
    max_supersteps: 20
    budgets:
      fix_attempts:
        limit: "params.max_plan_fix_attempts"
    nodes:
      review:
        uses: skill:aa-api-plan-reviewer
        agent: aa-reviewer
        outputs: [change:review/api-plan-review.json, change:review/api-plan-review-summary.md]
        gate: api-plan-review-gate
        retry: agent-transient
        timeout: agent

      fix:
        uses: skill:aa-api-plan-fixer
        agent: aa-doc-author
        outputs: [change:review/api-plan-review-apply-summary.md]
        retry: agent-transient
        timeout: agent
        budget:
          consume: fix_attempts
          "on": committed
          exhausted_to: exhausted

      human-review:
        uses: builtin:interrupt
        interrupt:
          reason: "api plan review requires human review"
          checkpoint: api-plan-review-gate
          bind: audited_gate_read
          actions: [fix_and_proceed, accept_risk, stop]

      knowledge-remediation:
        uses: builtin:interrupt
        interrupt:
          reason: "api plan review requires L1 capability remediation (aa knowledge promote)"
          checkpoint: api-plan-review-gate
          bind: audited_gate_read
          actions: [fix_and_proceed, accept_risk, stop]

      exhausted:
        uses: operation:stop
        with: {reason: "api plan fix attempts exhausted"}

    edges:
      - {from: START, to: review}
      - {from: fix, to: review}
      - {from: exhausted, to: STOP}

    routes:
      - from: review
        select: "plan_review_route('review')"
        cases:
          pass: END
          needs_fix: fix
          knowledge_remediation: knowledge-remediation
          needs_human_review: human-review
          reject: STOP
          stop: STOP
        default: STOP
      - from: human-review
        select: "resume.action"
        cases:
          fix_and_proceed: fix
          accept_risk: END
          stop: STOP
        default: STOP
      - from: knowledge-remediation
        select: "resume.action"
        cases:
          fix_and_proceed: review
          accept_risk: END
          stop: STOP
        default: STOP

  e2e-branch:
    max_supersteps: 30
    nodes:
      plan:
        uses: skill:aa-e2e-plan
        agent: aa-doc-author
        when: "params.run_mode in ['full','e2e-only','plan-only','review-plan']"
        outputs:
          - change:plans/e2e-plan.md
          - change:plans/e2e-test-data-plan.md
          - change:plans/e2e-codegen-plan.md
          - change:plans/m4-review-summary.md
        retry: agent-transient
        timeout: agent

      review-cycle:
        uses: graph:e2e-plan-cycle

      codegen-precheck:
        uses: builtin:gate
        with: {gate: e2e-codegen-precondition-gate}

      codegen:
        uses: skill:aa-e2e-codegen
        agent: aa-test-author
        when: "params.run_mode in ['full','e2e-only','codegen-only']"
        outputs: [change:codegen/e2e-codegen-summary.md]
        retry: agent-transient
        timeout: agent

    edges:
      - {from: START, to: plan, when: "params.run_mode != 'codegen-only'"}
      - {from: START, to: review-cycle, when: "params.run_mode == 'codegen-only'"}
      - {from: plan, to: review-cycle}
      - {from: review-cycle, to: codegen-precheck, when: "params.run_mode in ['full','e2e-only','codegen-only']"}
      - {from: review-cycle, to: END, when: "params.run_mode in ['plan-only','review-plan']"}
      - {from: codegen, to: END}

    routes:
      - from: codegen-precheck
        select: "node('codegen-precheck').gate.verdict"
        cases: {pass: codegen, stop: STOP}
        default: STOP

  e2e-plan-cycle:
    max_supersteps: 20
    budgets:
      fix_attempts:
        limit: "params.max_plan_fix_attempts"
    nodes:
      review:
        uses: skill:aa-e2e-plan-reviewer
        agent: aa-reviewer
        outputs: [change:review/plan-review.json, change:review/plan-review-summary.md]
        gate: e2e-plan-review-gate
        retry: agent-transient
        timeout: agent

      fix:
        uses: skill:aa-e2e-plan-fixer
        agent: aa-doc-author
        outputs: [change:review/plan-review-apply-summary.md]
        retry: agent-transient
        timeout: agent
        budget:
          consume: fix_attempts
          "on": committed
          exhausted_to: exhausted

      human-review:
        uses: builtin:interrupt
        interrupt:
          reason: "e2e plan review requires human review"
          checkpoint: e2e-plan-review-gate
          bind: audited_gate_read
          actions: [fix_and_proceed, accept_risk, stop]

      knowledge-remediation:
        uses: builtin:interrupt
        interrupt:
          reason: "e2e plan review requires L1 capability remediation (aa knowledge promote)"
          checkpoint: e2e-plan-review-gate
          bind: audited_gate_read
          actions: [fix_and_proceed, accept_risk, stop]

      exhausted:
        uses: operation:stop
        with: {reason: "e2e plan fix attempts exhausted"}

    edges:
      - {from: START, to: review}
      - {from: fix, to: review}
      - {from: exhausted, to: STOP}

    routes:
      - from: review
        select: "plan_review_route('review')"
        cases:
          pass: END
          needs_fix: fix
          knowledge_remediation: knowledge-remediation
          needs_human_review: human-review
          reject: STOP
          stop: STOP
        default: STOP
      - from: human-review
        select: "resume.action"
        cases:
          fix_and_proceed: fix
          accept_risk: END
          stop: STOP
        default: STOP
      - from: knowledge-remediation
        select: "resume.action"
        cases:
          fix_and_proceed: review
          accept_risk: END
          stop: STOP
        default: STOP

  fuzz-branch:
    max_supersteps: 30
    nodes:
      plan:
        uses: skill:aa-fuzz-plan
        agent: aa-doc-author
        when: "params.run_mode in ['full','plan-only','review-plan']"
        outputs:
          - change:plans/fuzz-plan.md
          - change:plans/fuzz-codegen-plan.md
          - change:plans/fuzz-review-summary.md
        retry: agent-transient
        timeout: agent

      review-cycle:
        uses: graph:fuzz-plan-review-cycle

      # Re-reads the fuzz plan-review verdict so the branch can route an
      # empty-scope `skip` (layer selected but no cases) straight to END,
      # bypassing codegen. gate() is only resolvable inside a builtin:gate
      # node — never in a node/edge `when` — so the branch cannot inline it.
      # This routed node is also the codegen precondition: `pass` is the sole
      # edge into codegen, which is exactly what fuzz-codegen-precondition-gate
      # asserts, so attaching that gate to `codegen` only duplicated the check
      # after the fact.
      codegen-gate:
        uses: builtin:gate
        with: {gate: fuzz-plan-review-gate}

      codegen:
        uses: skill:aa-fuzz-codegen
        agent: aa-test-author
        when: "params.run_mode in ['full','codegen-only']"
        outputs: [change:codegen/fuzz-codegen-summary.md]
        retry: agent-transient
        timeout: agent

    edges:
      - {from: START, to: plan, when: "params.run_mode != 'codegen-only'"}
      - {from: START, to: review-cycle, when: "params.run_mode == 'codegen-only'"}
      - {from: plan, to: review-cycle}
      - {from: review-cycle, to: codegen-gate, when: "params.run_mode in ['full','codegen-only']"}
      - {from: review-cycle, to: END, when: "params.run_mode in ['plan-only','review-plan']"}
      - {from: codegen, to: END}

    routes:
      - from: codegen-gate
        select: "node('codegen-gate').gate.verdict"
        cases:
          pass: codegen
          skip: END
        default: END

  fuzz-plan-review-cycle:
    max_supersteps: 10
    nodes:
      review:
        uses: skill:aa-fuzz-plan-reviewer
        agent: aa-reviewer
        outputs: [change:review/fuzz-plan-review.json, change:review/fuzz-plan-review-summary.md]
        gate: fuzz-plan-review-gate
        retry: agent-transient
        timeout: agent

      human-review:
        uses: builtin:interrupt
        interrupt:
          reason: "fuzz plan review requires human review"
          checkpoint: fuzz-plan-review-gate
          bind: audited_gate_read
          actions: [fix_and_proceed, accept_risk, stop]

    edges:
      - {from: START, to: review}

    routes:
      - from: review
        select: "node('review').gate.verdict"
        cases:
          pass: END
          skip: END
          needs_fix: human-review
          needs_human_review: human-review
          reject: STOP
          stop: STOP
        default: STOP
      - from: human-review
        select: "resume.action"
        cases:
          fix_and_proceed: END
          accept_risk: END
          stop: STOP
        default: STOP

  performance-branch:
    max_supersteps: 30
    nodes:
      plan:
        uses: skill:aa-performance-plan
        agent: aa-doc-author
        when: "params.run_mode in ['full','plan-only','review-plan']"
        outputs:
          - change:plans/performance-plan.md
          - change:plans/performance-codegen-plan.md
          - change:plans/performance-review-summary.md
        retry: agent-transient
        timeout: agent

      review-cycle:
        uses: graph:performance-plan-review-cycle

      # Re-reads the performance plan-review verdict so the branch can route an
      # empty-scope `skip` (layer selected but no cases) straight to END,
      # bypassing codegen. gate() is only resolvable inside a builtin:gate
      # node — never in a node/edge `when` — so the branch cannot inline it.
      # This routed node is also the codegen precondition: `pass` is the sole
      # edge into codegen, which is exactly what
      # performance-codegen-precondition-gate asserts, so attaching that gate to
      # `codegen` only duplicated the check after the fact.
      codegen-gate:
        uses: builtin:gate
        with: {gate: performance-plan-review-gate}

      codegen:
        uses: skill:aa-performance-codegen
        agent: aa-test-author
        when: "params.run_mode in ['full','codegen-only']"
        outputs: [change:codegen/performance-codegen-summary.md]
        retry: agent-transient
        timeout: agent

    edges:
      - {from: START, to: plan, when: "params.run_mode != 'codegen-only'"}
      - {from: START, to: review-cycle, when: "params.run_mode == 'codegen-only'"}
      - {from: plan, to: review-cycle}
      - {from: review-cycle, to: codegen-gate, when: "params.run_mode in ['full','codegen-only']"}
      - {from: review-cycle, to: END, when: "params.run_mode in ['plan-only','review-plan']"}
      - {from: codegen, to: END}

    routes:
      - from: codegen-gate
        select: "node('codegen-gate').gate.verdict"
        cases:
          pass: codegen
          skip: END
        default: END

  performance-plan-review-cycle:
    max_supersteps: 10
    nodes:
      review:
        uses: skill:aa-performance-plan-reviewer
        agent: aa-reviewer
        outputs: [change:review/performance-plan-review.json, change:review/performance-plan-review-summary.md]
        gate: performance-plan-review-gate
        retry: agent-transient
        timeout: agent

      human-review:
        uses: builtin:interrupt
        interrupt:
          reason: "performance plan review requires human review"
          checkpoint: performance-plan-review-gate
          bind: audited_gate_read
          actions: [fix_and_proceed, accept_risk, stop]

    edges:
      - {from: START, to: review}

    routes:
      - from: review
        select: "node('review').gate.verdict"
        cases:
          pass: END
          skip: END
          needs_fix: human-review
          needs_human_review: human-review
          reject: STOP
          stop: STOP
        default: STOP
      - from: human-review
        select: "resume.action"
        cases:
          fix_and_proceed: END
          accept_risk: END
          stop: STOP
        default: STOP

  inspect-with-issues:
    # Runs after every authoritative execution batch (initial run and every
    # healing rerun). Keeps operation:inspect first so failure-analysis /
    # quality-gate artifacts remain authoritative, then collects Observations
    # and optionally invokes the LLM analyzer before reconciling Issues.
    max_supersteps: 15
    nodes:
      inspect:
        uses: operation:inspect
        outputs:
          - change:inspect/failure-analysis.json
          - change:inspect/quality-gate-result.json
        retry: cli-transient
        timeout: cli

      collect-observations:
        uses: operation:collect-observations
        retry: never
        timeout: local-operation

      analyze-issues:
        uses: skill:aa-issue-analyzer
        agent: aa-reporter
        outputs:
          - change:inspect/issue-candidates.json
          - change:inspect/issue-analysis-status.json
        retry: llm-default
        timeout: agent
        recover:
          errors: [timeout, transport, rate_limit, invalid_output]
          via: record-analysis-failure
          continue_to: inspect-complete

      record-empty-analysis:
        uses: operation:record-empty-issue-analysis
        retry: never
        timeout: local-operation

      reconcile-issues:
        uses: operation:reconcile-issues
        retry: project-sync
        timeout: cli
        recover:
          errors: [conflict, transport]
          via: record-project-sync-pending
          continue_to: inspect-complete

      record-analysis-failure:
        uses: operation:record-issue-analysis-failure
        retry: never
        timeout: local-operation

      record-project-sync-pending:
        uses: operation:record-project-sync-pending
        retry: never
        timeout: local-operation

      inspect-complete:
        uses: operation:no-op

    edges:
      - {from: START, to: inspect}
      - {from: inspect, to: collect-observations}
      - {from: collect-observations, to: analyze-issues,
         when: "node('collect-observations').value.abnormal_count > 0"}
      - {from: collect-observations, to: record-empty-analysis,
         when: "node('collect-observations').value.abnormal_count == 0"}
      - {from: record-empty-analysis, to: reconcile-issues}
      - {from: analyze-issues, to: reconcile-issues}
      - {from: reconcile-issues, to: inspect-complete}
      - {from: inspect-complete, to: END}

  healing:
    max_supersteps: 50
    budgets:
      healing_attempts:
        limit: "params.max_healing_attempts"

    nodes:
      entry:
        uses: builtin:gate
        with: {gate: healing-entry-gate}

      proposal:
        uses: skill:aa-fix-proposal
        agent: aa-doc-author
        outputs: [change:healing/fix-proposal.json]
        retry: agent-transient
        timeout: agent

      proposal-eligible:
        uses: builtin:gate
        with:
          expression: >
            file_exists('healing/fix-proposal.json') and
            any(fix_proposal.proposals,
                eligible == true and target in ['api', 'e2e'])

      allocate:
        uses: operation:allocate-healing-attempt
        retry: never
        timeout: local-operation
        budget:
          consume: healing_attempts
          "on": committed
          exhausted_to: complete-exhausted

      fix-api:
        uses: skill:aa-api-codegen-fixer
        agent: aa-test-author
        when: "any(fix_proposal.proposals, target == 'api' and eligible == true)"
        outputs: [change:healing/api-apply-summary.json]
        retry: agent-transient
        timeout: agent

      fix-e2e:
        uses: skill:aa-e2e-codegen-fixer
        agent: aa-test-author
        when: "any(fix_proposal.proposals, target == 'e2e' and eligible == true)"
        outputs: [change:healing/e2e-apply-summary.json]
        retry: agent-transient
        timeout: agent

      fixer-join:
        uses: builtin:join
        join:
          sources: [fix-api, fix-e2e]
          mode: all_active

      safety:
        uses: builtin:gate
        with: {gate: fixer-safety-gate}

      safety-interrupt:
        uses: builtin:interrupt
        interrupt:
          reason: "fixer safety requires human review"
          checkpoint: healing.safety
          bind: audited_gate_read
          actions: [fix_and_proceed, accept_risk, stop]

      rerun:
        uses: operation:run-tests
        outputs: [change:execution/execution-manifest.yaml]
        retry: cli-transient
        timeout: cli

      inspect-with-issues:
        uses: graph:inspect-with-issues

      decide:
        uses: builtin:gate
        with: {gate: healing-loop-gate}

      complete-not-needed:
        uses: operation:record-healing-status
        with: {status: not_needed}
        retry: never

      complete-resolved:
        uses: operation:record-healing-status
        with: {status: resolved}
        retry: never

      complete-exhausted:
        uses: operation:record-healing-status
        with: {status: exhausted}
        retry: never

      complete-failed:
        uses: operation:record-healing-status
        with: {status: failed}
        retry: never

    edges:
      - {from: START, to: entry}
      - {from: proposal, to: proposal-eligible}
      - {from: proposal-eligible, to: allocate, when: "node('proposal-eligible').value == true"}
      - {from: proposal-eligible, to: complete-failed, when: "node('proposal-eligible').value == false"}
      - {from: allocate, to: fix-api}
      - {from: allocate, to: fix-e2e}
      - {from: fix-api, to: fixer-join}
      - {from: fix-e2e, to: fixer-join}
      - {from: fixer-join, to: safety}
      - {from: rerun, to: inspect-with-issues}
      - {from: inspect-with-issues, to: decide}
      - {from: complete-not-needed, to: END}
      - {from: complete-resolved, to: END}
      - {from: complete-exhausted, to: END}
      - {from: complete-failed, to: END}

    routes:
      - from: entry
        select: "node('entry').gate.verdict"
        cases:
          enter: proposal
          skip: complete-not-needed
          stop: complete-failed
          reject: complete-failed
        default: complete-failed

      - from: safety
        select: "node('safety').gate.verdict"
        cases:
          pass: rerun
          needs_human_review: safety-interrupt
          stop: complete-failed
          reject: complete-failed
        default: complete-failed

      - from: safety-interrupt
        select: "resume.action"
        cases:
          accept_risk: rerun
          fix_and_proceed: proposal
          stop: complete-failed
        default: complete-failed

      - from: decide
        select: "node('decide').gate.verdict"
        cases:
          exit: complete-resolved
          continue: proposal
          stop: complete-exhausted
          reject: complete-failed
        default: complete-failed

  # ---- issue-review-workflow: human Problem review (repeatable) --------
  issue-review-workflow:
    # Non-blocking, repeatable human review of a single Problem.
    # load-problem writes the review context; triage-advisor writes advice
    # (display-only); human-interrupt captures the decision; apply-review
    # appends the canonical event to the project Problem ledger.
    max_supersteps: 6
    nodes:
      load-problem:
        uses: operation:load-problem-review-context
        retry: never
        timeout: local-operation

      triage-advisor:
        uses: skill:aa-issue-triage-advisor
        agent: aa-reporter
        outputs:
          - change:issue-review/**
        retry: llm-default
        timeout: agent

      human-interrupt:
        uses: builtin:interrupt
        interrupt:
          reason: "Review problem and take action"
          checkpoint: review
          bind: audited_gate_read
          actions:
            - confirm_assessment
            - mark_not_an_issue
            - accept_risk
            - start_work
            - confirm_link
            - merge
            - reopen
            - submit_resolution
            - stop

      apply-review:
        uses: operation:apply-problem-review
        retry: project-sync
        timeout: cli

    edges:
      - {from: START, to: load-problem}
      - {from: load-problem, to: triage-advisor}
      - {from: triage-advisor, to: human-interrupt}
      - {from: apply-review, to: END}

    routes:
      - from: human-interrupt
        select: "resume.action"
        cases:
          confirm_assessment: apply-review
          mark_not_an_issue: apply-review
          accept_risk: apply-review
          start_work: apply-review
          confirm_link: apply-review
          merge: apply-review
          reopen: apply-review
          submit_resolution: apply-review
          stop: STOP
        default: STOP

  # ---- issue-analyze-workflow: retry analyzer without re-collecting -----
  issue-analyze-workflow:
    # Reruns the LLM analyzer against the latest existing Observation/evidence
    # digest and then reconciles on success.  Never re-collects evidence.
    # Repeatable: can be retried as many times as needed after analysis failure.
    max_supersteps: 8
    nodes:
      analyze-issues:
        uses: skill:aa-issue-analyzer
        agent: aa-reporter
        outputs:
          - change:inspect/issue-candidates.json
          - change:inspect/issue-analysis-status.json
        retry: llm-default
        timeout: agent
        recover:
          errors: [timeout, transport, rate_limit, invalid_output]
          via: record-analysis-failure
          continue_to: END

      record-analysis-failure:
        uses: operation:record-issue-analysis-failure
        retry: never
        timeout: local-operation

      reconcile-issues:
        uses: operation:reconcile-issues
        retry: project-sync
        timeout: cli
        recover:
          errors: [conflict, transport]
          via: record-project-sync-pending
          continue_to: END

      record-project-sync-pending:
        uses: operation:record-project-sync-pending
        retry: never
        timeout: local-operation

    edges:
      - {from: START, to: analyze-issues}
      - {from: analyze-issues, to: reconcile-issues}
      - {from: reconcile-issues, to: END}

  # ---- issue-reconcile-workflow: idempotent reconcile retry --------------
  issue-reconcile-workflow:
    # Reruns only operation:reconcile-issues for the latest pinned
    # candidate/evidence digest.  Idempotent retry path for project_sync_pending.
    # Never calls the LLM.
    max_supersteps: 4
    nodes:
      reconcile-issues:
        uses: operation:reconcile-issues
        retry: project-sync
        timeout: cli
        recover:
          errors: [conflict, transport]
          via: record-project-sync-pending
          continue_to: END

      record-project-sync-pending:
        uses: operation:record-project-sync-pending
        retry: never
        timeout: local-operation

    edges:
      - {from: START, to: reconcile-issues}
      - {from: reconcile-issues, to: END}

gates:
  registry-gate:
    reads: [{ path: registry/skill-registry-check.json, as: registry }]
    invalid_json: stop
    missing_field_is: stop
    pass_when: "registry.status == 'pass' and registry.healing_available == true"
    stop_when: "registry.status == 'fail' or registry.healing_available == false"

  case-review-gate:
    reads: [review/case-review.json]
    invalid_json: stop
    missing_field_is: stop
    needs_fix_when: "case_review.decision == 'needs_fix' and case_review.auto_fix_allowed == true"
    needs_human_review_when: >
      case_review.decision == 'needs_human_review'
      or (
        case_review.human_review_required == true
        and not (params.force_continue == true and case_review.decision == 'pass')
      )
    reject_when: "case_review.decision == 'reject'"
    pass_when: "case_review.decision == 'pass'"

  case-design-gate:
    reads:
      - { path: .qa.yaml, as: qa }
    invalid_json: stop
    missing_field_is: stop
    pass_when: >
      qa.approval.mode == 'autonomous'
      or (
        qa.approval.approved_by == 'user'
        and qa.approval.approved_approach != null
        and qa.approval.approved_at != null
      )

  api-plan-review-gate: &plan-review-gate
    reads:
      - review/api-plan-review.json
      - { path: repo:.aa/data-knowledge.yaml, as: data_knowledge }
    invalid_json: stop
    missing_field_is: stop
    stop_when: >
      not defined(api_plan_review.required_capabilities)
      or api_plan_review.required_capabilities == null
      or len(api_plan_review.required_capabilities) == 0
    needs_fix_when: "api_plan_review.decision == 'needs_fix' and api_plan_review.auto_fix_allowed == true"
    needs_human_review_when: >
      (
        defined(api_plan_review.required_capabilities)
        and len(api_plan_review.required_capabilities) > 0
        and not capabilities_present(api_plan_review, data_knowledge)
      )
      or api_plan_review.decision == 'needs_human_review'
      or (
        (api_plan_review.human_review_required == true or api_plan_review.risk_level in ['high','critical'])
        and not (
          params.force_continue == true
          and api_plan_review.decision == 'pass'
          and api_plan_review.codegen_readiness in ['ready','ready_with_warnings']
        )
      )
    reject_when: "api_plan_review.decision == 'reject' or api_plan_review.codegen_readiness == 'not_ready'"
    pass_when: >
      api_plan_review.decision == 'pass'
      and api_plan_review.codegen_readiness in ['ready','ready_with_warnings']
      and capabilities_present(api_plan_review, data_knowledge)

  e2e-plan-review-gate:
    reads:
      - review/plan-review.json
      - { path: repo:.aa/data-knowledge.yaml, as: data_knowledge }
    invalid_json: stop
    missing_field_is: stop
    stop_when: >
      not defined(plan_review.required_capabilities)
      or plan_review.required_capabilities == null
      or len(plan_review.required_capabilities) == 0
    needs_fix_when: "plan_review.decision == 'needs_fix' and plan_review.auto_fix_allowed == true"
    needs_human_review_when: >
      (
        defined(plan_review.required_capabilities)
        and len(plan_review.required_capabilities) > 0
        and not capabilities_present(plan_review, data_knowledge)
      )
      or plan_review.decision == 'needs_human_review'
      or (
        (plan_review.human_review_required == true or plan_review.risk_level in ['high','critical'])
        and not (
          params.force_continue == true
          and plan_review.decision == 'pass'
          and plan_review.codegen_readiness in ['ready','ready_with_warnings']
        )
      )
    reject_when: "plan_review.decision == 'reject' or plan_review.codegen_readiness == 'not_ready'"
    pass_when: >
      plan_review.decision == 'pass'
      and plan_review.codegen_readiness in ['ready','ready_with_warnings']
      and capabilities_present(plan_review, data_knowledge)

  fuzz-plan-review-gate:
    reads: [review/fuzz-plan-review.json]
    invalid_json: stop
    missing_field_is: stop
    needs_fix_when: "fuzz_plan_review.decision == 'needs_fix' and fuzz_plan_review.auto_fix_allowed == true"
    needs_human_review_when: >
      fuzz_plan_review.decision in ['needs_human_review','changes_requested']
      or (
        fuzz_plan_review.human_review_required == true
        and not (params.force_continue == true and fuzz_plan_review.decision in ['pass','approved'])
      )
    # Empty-scope skip: the layer was selected but has no applicable cases, so
    # there is nothing to fuzz. Route a graceful skip (branch ends, codegen is
    # skipped) rather than a dead-end reject that halts the whole run.
    skip_when: "fuzz_plan_review.layer_applicable == false"
    reject_when: "fuzz_plan_review.decision == 'reject'"
    pass_when: "fuzz_plan_review.decision in ['pass','approved']"

  performance-plan-review-gate:
    reads: [review/performance-plan-review.json]
    invalid_json: stop
    missing_field_is: stop
    needs_fix_when: "performance_plan_review.decision == 'needs_fix' and performance_plan_review.auto_fix_allowed == true"
    needs_human_review_when: >
      performance_plan_review.decision in ['needs_human_review','changes_requested']
      or (
        performance_plan_review.human_review_required == true
        and not (params.force_continue == true and performance_plan_review.decision in ['pass','approved'])
      )
    # Empty-scope skip: the layer was selected but has no applicable cases, so
    # there is nothing to load-test. Route a graceful skip (branch ends, codegen
    # is skipped) rather than a dead-end reject that halts the whole run.
    skip_when: "performance_plan_review.layer_applicable == false"
    reject_when: "performance_plan_review.decision == 'reject'"
    pass_when: "performance_plan_review.decision in ['pass','approved']"

  api-codegen-precondition-gate:
    reads: []
    pass_when: "gate('api-plan-review-gate').verdict == 'pass' and file_exists('repo:.aa/data-knowledge.yaml')"
    stop_when: "not file_exists('repo:.aa/data-knowledge.yaml')"

  e2e-codegen-precondition-gate:
    reads: []
    pass_when: "gate('e2e-plan-review-gate').verdict == 'pass' and file_exists('repo:.aa/data-knowledge.yaml')"
    stop_when: "not file_exists('repo:.aa/data-knowledge.yaml')"

  fuzz-codegen-precondition-gate:
    reads: []
    pass_when: "gate('fuzz-plan-review-gate').verdict == 'pass'"
    stop_when: "gate('fuzz-plan-review-gate').verdict == 'stop'"

  performance-codegen-precondition-gate:
    reads: []
    pass_when: "gate('performance-plan-review-gate').verdict == 'pass'"
    stop_when: "gate('performance-plan-review-gate').verdict == 'stop'"

  fixer-safety-gate:
    reads: [healing/fixer-safety-check.json]
    missing_file_is: stop
    needs_human_review_when: "fixer_safety_check.passed == false or fixer_safety_check.needs_review == true"
    pass_when: >
      fixer_safety_check.passed == true
      and fixer_safety_check.product_code_modified == false
      and fixer_safety_check.assertion_expected_value_changes_detected == false
      and fixer_safety_check.skip_or_xfail_added == false
      and fixer_safety_check.unrelated_tests_modified == false
      and fixer_safety_check.high_risk_proposal_applied == false

  healing-entry-gate:
    reads:
      - { path: execution/execution-manifest.yaml, as: execution }
      - { path: inspect/failure-analysis.json, as: failure_analysis }
      - { path: registry/skill-registry-check.json, as: registry }
    missing_file_is: stop
    invalid_json: stop
    missing_field_is: stop
    enter_when: >
      execution.final_status == 'FAIL'
      and any(failure_analysis.failures, fix_proposal_eligible == true)
      and failure_analysis.inspect_mode == 'primary'
      and registry.healing_available == true
    stop_when: >
      execution.final_status == 'FAIL'
      and any(failure_analysis.failures, fix_proposal_eligible == true)
      and registry.healing_available == false
    skip_when: >
      execution.final_status in ['PASS','PASS_WITH_WARNINGS']
      or not any(failure_analysis.failures, fix_proposal_eligible == true)

  healing-loop-gate:
    reads:
      - { path: execution/execution-manifest.yaml, as: execution }
      - { path: inspect/failure-analysis.json, as: failure_analysis }
      - { path: healing/status.json, as: healing }
    missing_file_is: stop
    invalid_json: stop
    missing_field_is: stop
    exit_when: "execution.final_status in ['PASS','PASS_WITH_WARNINGS']"
    continue_when: >
      execution.final_status == 'FAIL'
      and any(failure_analysis.failures, fix_proposal_eligible == true)
      and healing.attempts_used < params.max_healing_attempts
    stop_when: >
      healing.attempts_used >= params.max_healing_attempts
      or healing.all_fixers_no_op == true
    reject_when: >
      execution.final_status == 'FAIL'
      and not any(failure_analysis.failures, fix_proposal_eligible == true)

  archive-gate:
    reads:
      - { path: execution/execution-manifest.yaml, as: execution }
      - { path: inspect/failure-analysis.json, as: failure_analysis }
      - { path: healing/status.json, as: healing }
      - { path: review/case-review.json, as: case_review }
      - { path: review/api-plan-review.json, as: api_plan_review }
      - { path: review/plan-review.json, as: plan_review }
    missing_file_is: stop
    invalid_json: stop
    missing_field_is: stop
    pass_when: >
      params.auto_archive == true
      and case_review.decision == 'pass'
      and (not ('api' in params.test_types) or api_plan_review.decision == 'pass')
      and (not ('e2e' in params.test_types) or plan_review.decision == 'pass')
      and execution.final_status in ['PASS','PASS_WITH_WARNINGS']
      and healing.status in ['not_needed','resolved','skipped']
      and failure_analysis.source_batch_id == execution.batch_id
      and not any(failure_analysis.failures, fix_proposal_eligible == true)
    stop_when: >
      execution.final_status == 'FAIL'
      or healing.status in ['applied','exhausted','failed']
      or failure_analysis.source_batch_id != execution.batch_id
