        with: {layer: fuzz}

      plan:
        uses: skill:aa-fuzz-plan
        agent: aa-doc-author
        when: "params.run_mode in ['full','plan-only','review-plan']"
        outputs:
          - change:plans/fuzz-plan.md
          - change:plans/fuzz-codegen-plan.md
          - change:plans/fuzz-review-summary.md
        retry: agent-transient
        timeout: agent

      review-cycle:
        uses: graph:fuzz-plan-cycle

      codegen-precheck:
        uses: builtin:gate
        with: {gate: fuzz-codegen-precondition-gate}

      codegen:
        uses: skill:aa-fuzz-codegen
        agent: aa-test-author
        when: "params.run_mode in ['full','codegen-only']"
        outputs:
          - change:codegen/fuzz-codegen-summary.md
          - change:codegen/fuzz-generated-files.json
        retry: agent-transient
        timeout: agent

    edges:
      - {from: START, to: applicability-preflight}
      - {from: plan, to: review-cycle}
      # Mutually exclusive with the false route: only applicable codegen-only bypasses plan.
      - {from: applicability-preflight, to: review-cycle, when: "params.run_mode == 'codegen-only' and node('applicability-preflight').value.applicable == true"}
      - {from: review-cycle, to: codegen-precheck, when: "params.run_mode in ['full','codegen-only']"}
      - {from: review-cycle, to: END, when: "params.run_mode in ['plan-only','review-plan']"}
      - {from: codegen, to: END}

    routes:
      - from: applicability-preflight
        select: "node('applicability-preflight').value.applicable"
        cases: {"true": plan, "false": review-cycle}
        default: STOP
      - from: codegen-precheck
        select: "node('codegen-precheck').gate.verdict"
        cases: {pass: codegen, skip: END, stop: STOP}
        default: STOP

  fuzz-plan-cycle:
    max_supersteps: 20
    budgets:
      fix_attempts:
        limit: "params.max_plan_fix_attempts"
    nodes:
      applicability:
        uses: operation:derive-plan-layer-applicability
        with: {layer: fuzz}

      review:
        uses: skill:aa-fuzz-plan-reviewer
        agent: aa-reviewer
        outputs: [change:review/fuzz-plan-review.json, change:review/fuzz-plan-review-summary.md]
        retry: agent-transient
        timeout: agent

      mechanical-plan-checks:
        uses: operation:verify-plan-mechanical
        with: {layer: fuzz, require_review: true}
        outputs: [change:review/fuzz-plan-checks.json]
        resources:
          writes:
            - change:review/fuzz-plan-checks.json
          reads:
            - change:plans/fuzz-plan.md
            - change:plans/fuzz-codegen-plan.md
            - change:review/fuzz-plan-review.json
            - change:cases/**
            - repo:.aa/data-knowledge.yaml
          synchronized:
            - project:.aa/data-knowledge.yaml
          exclusive:
            - project:data-knowledge

      review-gate:
        uses: builtin:gate
        with: {gate: fuzz-plan-review-gate}

      human-review:
        uses: builtin:interrupt
        interrupt:
          reason: "fuzz plan review requires human review"
          checkpoint: fuzz-plan-review-gate
          bind: audited_gate_read
          actions: [fix_and_proceed, accept_risk, stop]
          manual_revision:
            action: fix_and_proceed
            paths:
              - change:plans/fuzz-plan.md
              - change:plans/fuzz-codegen-plan.md
        budget:
          consume: fix_attempts
          "on": committed
          exhausted_to: exhausted

      exhausted:
        uses: operation:stop
        with: {reason: "fuzz plan fix attempts exhausted"}

      knowledge-remediation:
        uses: builtin:interrupt
        interrupt:
          reason: "fuzz plan review requires L1 capability remediation (aa knowledge promote)"
          checkpoint: fuzz-plan-review-gate
          bind: audited_gate_read
          actions: [fix_and_proceed, accept_risk, stop]

    edges:
      - {from: START, to: applicability}
      - {from: review, to: mechanical-plan-checks}
      - {from: mechanical-plan-checks, to: review-gate}
      - {from: exhausted, to: STOP}

    routes:
      - from: applicability
        select: "node('applicability').value.applicable"
        cases: {"true": review, "false": mechanical-plan-checks}
        default: STOP
      - from: review-gate
        select: "plan_review_route('review-gate')"
        cases:
          pass: END
          skip: END
          needs_fix: human-review
          knowledge_remediation: knowledge-remediation
          needs_human_review: human-review
          reject: STOP
          stop: STOP
        default: STOP
      - from: human-review
        select: "resume.action"
        cases:
          fix_and_proceed: review
          accept_risk: END
          stop: STOP
        default: STOP
      - from: knowledge-remediation
        select: "resume.action"
        cases:
          fix_and_proceed: mechanical-plan-checks
          accept_risk: END
          stop: STOP
        default: STOP

  performance-branch:
    max_supersteps: 30
    nodes:
      applicability-preflight:
        uses: operation:derive-plan-layer-applicability
        with: {layer: performance}

      plan:
        uses: skill:aa-performance-plan
        agent: aa-doc-author
        when: "params.run_mode in ['full','plan-only','review-plan']"
        outputs:
          - change:plans/performance-plan.md
          - change:plans/performance-codegen-plan.md
          - change:plans/performance-review-summary.md
        retry: agent-transient
        timeout: agent

      review-cycle:
        uses: graph:performance-plan-cycle

      codegen-precheck:
        uses: builtin:gate
        with: {gate: performance-codegen-precondition-gate}

      codegen:
        uses: skill:aa-performance-codegen
        agent: aa-test-author
        when: "params.run_mode in ['full','codegen-only']"
        outputs:
          - change:codegen/performance-codegen-summary.md
          - change:codegen/performance-generated-files.json
        retry: agent-transient
        timeout: agent

    edges:
      - {from: START, to: applicability-preflight}
      - {from: plan, to: review-cycle}
      # Mutually exclusive with the false route: only applicable codegen-only bypasses plan.
      - {from: applicability-preflight, to: review-cycle, when: "params.run_mode == 'codegen-only' and node('applicability-preflight').value.applicable == true"}
      - {from: review-cycle, to: codegen-precheck, when: "params.run_mode in ['full','codegen-only']"}
      - {from: review-cycle, to: END, when: "params.run_mode in ['plan-only','review-plan']"}
      - {from: codegen, to: END}

    routes:
      - from: applicability-preflight
        select: "node('applicability-preflight').value.applicable"
        cases: {"true": plan, "false": review-cycle}
        default: STOP
      - from: codegen-precheck
        select: "node('codegen-precheck').gate.verdict"
        cases: {pass: codegen, skip: END, stop: STOP}
        default: STOP

  performance-plan-cycle:
    max_supersteps: 20
    budgets:
      fix_attempts:
        limit: "params.max_plan_fix_attempts"
    nodes:
      applicability:
        uses: operation:derive-plan-layer-applicability
        with: {layer: performance}

      review:
        uses: skill:aa-performance-plan-reviewer
        agent: aa-reviewer
        outputs: [change:review/performance-plan-review.json, change:review/performance-plan-review-summary.md]
        retry: agent-transient
        timeout: agent

      mechanical-plan-checks:
        uses: operation:verify-plan-mechanical
        with: {layer: performance, require_review: true}
        outputs: [change:review/performance-plan-checks.json]
        resources:
          writes:
            - change:review/performance-plan-checks.json
          reads:
            - change:plans/performance-plan.md
            - change:plans/performance-codegen-plan.md
            - change:review/performance-plan-review.json
            - change:cases/**
            - repo:.aa/data-knowledge.yaml
          synchronized:
            - project:.aa/data-knowledge.yaml
          exclusive:
            - project:data-knowledge

      review-gate:
        uses: builtin:gate
        with: {gate: performance-plan-review-gate}

      human-review:
        uses: builtin:interrupt
        interrupt:
          reason: "performance plan review requires human review"
          checkpoint: performance-plan-review-gate
          bind: audited_gate_read
          actions: [fix_and_proceed, accept_risk, stop]
          manual_revision:
            action: fix_and_proceed
            paths:
              - change:plans/performance-plan.md
              - change:plans/performance-codegen-plan.md
        budget:
          consume: fix_attempts
          "on": committed
          exhausted_to: exhausted

      exhausted:
        uses: operation:stop
        with: {reason: "performance plan fix attempts exhausted"}

      knowledge-remediation:
        uses: builtin:interrupt
        interrupt:
          reason: "performance plan review requires L1 capability remediation (aa knowledge promote)"
          checkpoint: performance-plan-review-gate
          bind: audited_gate_read
          actions: [fix_and_proceed, accept_risk, stop]

    edges:
      - {from: START, to: applicability}
      - {from: review, to: mechanical-plan-checks}
      - {from: mechanical-plan-checks, to: review-gate}
      - {from: exhausted, to: STOP}

    routes:
      - from: applicability
        select: "node('applicability').value.applicable"
        cases: {"true": review, "false": mechanical-plan-checks}
        default: STOP
      - from: review-gate
        select: "plan_review_route('review-gate')"
        cases:
          pass: END
          skip: END
          needs_fix: human-review
          knowledge_remediation: knowledge-remediation
          needs_human_review: human-review
          reject: STOP
          stop: STOP
        default: STOP
      - from: human-review
        select: "resume.action"
        cases:
          fix_and_proceed: review
          accept_risk: END
          stop: STOP
        default: STOP
      - from: knowledge-remediation
        select: "resume.action"
        cases:
          fix_and_proceed: mechanical-plan-checks
          accept_risk: END
          stop: STOP
        default: STOP


  inspect-with-issues:
    # Runs after every authoritative execution batch (initial run and every
    # healing rerun). Keeps operation:inspect first so failure-analysis /
    # quality-gate artifacts remain authoritative, then collects Observations
    # and optionally invokes the LLM analyzer before reconciling Issues.
    max_supersteps: 15
    nodes:
      inspect:
        uses: operation:inspect
        outputs:
          - change:inspect/failure-analysis.json
          - change:inspect/quality-gate-result.json
        retry: cli-transient
        timeout: cli

      collect-observations:
        uses: operation:collect-observations
        retry: never
        timeout: local-operation

      analyze-issues:
        uses: skill:aa-issue-analyzer
        agent: aa-reporter
        outputs:
          - change:inspect/issue-candidates.json
          - change:inspect/issue-analysis-status.json
        retry: llm-default
        timeout: agent
        recover:
          errors: [timeout, transport, rate_limit, invalid_output]
          via: record-analysis-failure
          continue_to: materialize-trace-projection

      record-empty-analysis:
        uses: operation:record-empty-issue-analysis
        retry: never
        timeout: local-operation

      reconcile-issues:
        uses: operation:reconcile-issues
        retry: project-sync
        timeout: cli
        recover:
          errors: [conflict, transport]
          via: record-project-sync-pending
          # Both recovery writers publish a *degraded* issue snapshot (an
          # analysis that did not finish, a project sync still pending), and the
          # reconciled fold reports that as an unusable input. Continuing
          # straight to completion would leave the change's trace projection
          # built from data nobody analysed, with no gate to say so — so
          # recovery rejoins at materialization like every other path.
          continue_to: materialize-trace-projection

      record-analysis-failure:
        uses: operation:record-issue-analysis-failure
        retry: never
        timeout: local-operation

      record-project-sync-pending:
        uses: operation:record-project-sync-pending
        retry: never
        timeout: local-operation

      # First point a *reconciled* projection can exist for the change as a
      # whole: the execution-phase fold is per-batch and predates the Problem
      # join. Publishes the facts the `trace-sufficiency-gate` routes on — but
      # this graph does not adjudicate them, and deliberately holds no gate or
      # interrupt at all. It runs once per authoritative batch, including every
      # healing rerun, so a verdict reached here would be a verdict about
      # evidence the fixers have not finished producing: a `stop` would end the
      # run before healing's own `decide` gate saw the rerun it asked for, and a
      # `needs_human_review` would suspend the loop mid-attempt. The judgement
      # happens once, in `assurance`, after healing returns.
      materialize-trace-projection:
        uses: operation:materialize-trace-projection
        outputs:
          - change:inspect/trace-projection.json
          - change:inspect/trace-sufficiency.json
        retry: never
        timeout: local-operation

      build-coverage-gap-signals:
        uses: operation:build-coverage-gap-signals
        outputs:
          - change:inspect/coverage-gaps.json
        retry: never
        timeout: local-operation

      inspect-complete:
        uses: operation:no-op

    edges:
      - {from: START, to: inspect}
      - {from: inspect, to: collect-observations}
      - {from: collect-observations, to: analyze-issues,
         when: "node('collect-observations').value.abnormal_count > 0"}
      - {from: collect-observations, to: record-empty-analysis,
         when: "node('collect-observations').value.abnormal_count == 0"}
      - {from: record-empty-analysis, to: reconcile-issues}
      - {from: analyze-issues, to: reconcile-issues}
      - {from: reconcile-issues, to: materialize-trace-projection}
      - {from: materialize-trace-projection, to: build-coverage-gap-signals}
      - {from: build-coverage-gap-signals, to: inspect-complete}
      - {from: inspect-complete, to: END}

  healing:
    max_supersteps: 50
    budgets:
      healing_attempts:
        limit: "params.max_healing_attempts"

    nodes:
      entry:
        uses: builtin:gate
        with: {gate: healing-entry-gate}

      proposal:
        uses: skill:aa-fix-proposal
        agent: aa-doc-author
        outputs: [change:healing/fix-proposal.json]
        retry: agent-transient
        timeout: agent

      proposal-eligible:
        uses: builtin:gate
        with:
          expression: >
            file_exists('healing/fix-proposal.json') and
            any(fix_proposal.proposals,
                eligible == true and target in ['api', 'e2e'])

      allocate:
        uses: operation:allocate-healing-attempt
        outputs:
          - change:healing/entry-baseline.json
          - change:healing/fixer-authority.json
        retry: never
        timeout: local-operation
        budget:
          consume: healing_attempts
          "on": committed
          exhausted_to: complete-exhausted

      fixer-authority-ready:
        uses: operation:fixer-authority-ready
        retry: never
        timeout: local-operation

      fixer-proposal-approval:
        uses: builtin:gate
        with: {gate: fixer-proposal-approval-gate}

      fixer-approval-interrupt:
        uses: builtin:interrupt
        interrupt:
          reason: healing.fixer_approval
          checkpoint: healing.fixer_approval
          bind: audited_gate_read
          actions: [approve_and_apply, stop]

      record-fixer-approval:
        uses: operation:record-fixer-approval
        outputs: [change:healing/fixer-proposal-approval.json]
        retry: never
        timeout: local-operation

      fixer-dispatch:
        uses: operation:fixer-dispatch
        retry: never
        timeout: local-operation

      fix-api:
        uses: skill:aa-api-codegen-fixer
        agent: aa-test-author
        when: "any(fix_proposal.proposals, target == 'api' and eligible == true)"
        outputs: [change:healing/api-apply-intent.json]
        retry: agent-transient
        timeout: agent

      fix-e2e:
        uses: skill:aa-e2e-codegen-fixer
        agent: aa-test-author
        when: "any(fix_proposal.proposals, target == 'e2e' and eligible == true)"
        outputs: [change:healing/e2e-apply-intent.json]
        retry: agent-transient
        timeout: agent

      record-api:
        uses: operation:record-codegen-fix-apply
        with: {target: api}
        when: "any(fix_proposal.proposals, target == 'api' and eligible == true)"
        outputs:
          - change:healing/api-apply-summary.json
          - change:healing/api-fixer-safety-check.json
        retry: never
        timeout: local-operation

      record-e2e:
        uses: operation:record-codegen-fix-apply
        with: {target: e2e}
        when: "any(fix_proposal.proposals, target == 'e2e' and eligible == true)"
        outputs:
          - change:healing/e2e-apply-summary.json
          - change:healing/e2e-fixer-safety-check.json
        retry: never
        timeout: local-operation

      fixer-join:
        uses: builtin:join
        join:
          sources: [record-api, record-e2e]
          mode: all_active

      combine-fixer-safety:
        uses: operation:combine-fixer-safety
        outputs: [change:healing/fixer-safety-check.json]
        retry: never
        timeout: local-operation

      safety:
        uses: builtin:gate
        with: {gate: fixer-safety-gate}

      safety-interrupt:
        uses: builtin:interrupt
        interrupt:
          reason: "fixer safety requires human review"
          checkpoint: healing.safety
          bind: audited_gate_read
          # No `fix_and_proceed`, for two reasons that agree.
          #
          # The decision layer never supported it here: `SPECIAL_DECISION_SUPPORT`
          # maps `healing.safety` to `accept_risk` and `stop` only, and
          # `latest_valid_gate_decision` explicitly refuses to let any other action
          # recorded at this checkpoint anchor the `fixer-safety-gate`. Offering it
          # meant offering a resume action nothing downstream could consume.
          #
          # It also reopened the stale-facts hole from the other side. Routing it
          # back to `proposal` re-entered the healing loop with fixer edits already
          # written and no rerun since, and the loop has two ordinary completions
          # that do not pass through `rerun` — `proposal-eligible == false` ->
          # `complete-skipped`, and an exhausted attempt budget ->
          # `complete-exhausted`. Either one returned to `assurance` as a normal
          # completed healing, and `trace-sufficiency` then adjudicated pre-fix
          # facts. `accept_risk` -> `rerun` remains the way to let already-applied
          # edits proceed into validation, which is what "another attempt" needs to
          # mean once the edits exist.
          actions: [accept_risk, stop]

      rerun:
        uses: operation:run-tests-and-collect-pr-metrics
        outputs: [change:execution/execution-manifest.yaml]
        retry: cli-transient
        timeout: cli

      inspect-with-issues:
        uses: graph:inspect-with-issues

      decide:
        uses: builtin:gate
        with: {gate: healing-loop-gate}

      complete-not-needed:
        uses: operation:record-healing-status
        with: {status: not_needed}
        retry: never

      complete-resolved:
        uses: operation:record-healing-status
        with: {status: resolved}
        retry: never

      complete-exhausted:
        uses: operation:record-healing-status
        with: {status: exhausted}
        retry: never

      complete-skipped:
        uses: operation:record-healing-status
        with: {status: skipped}
        retry: never

      complete-failed:
        uses: operation:record-healing-status
        with: {status: failed}
        retry: never

    edges:
      - {from: START, to: entry}
      - {from: proposal, to: proposal-eligible}
      - {from: proposal-eligible, to: allocate, when: "node('proposal-eligible').value == true"}
      - {from: proposal-eligible, to: complete-skipped, when: "node('proposal-eligible').value == false"}
      - {from: allocate, to: fixer-authority-ready}
      - {from: record-fixer-approval, to: fixer-proposal-approval}
      - {from: fixer-dispatch, to: fix-api, when: "any(fix_proposal.proposals, target == 'api' and eligible == true)"}
      - {from: fixer-dispatch, to: fix-e2e, when: "any(fix_proposal.proposals, target == 'e2e' and eligible == true)"}
      - {from: fix-api, to: record-api}
      - {from: fix-e2e, to: record-e2e}
      - {from: record-api, to: fixer-join}
      - {from: record-e2e, to: fixer-join}
      - {from: fixer-join, to: combine-fixer-safety}
      - {from: combine-fixer-safety, to: safety}
      - {from: rerun, to: inspect-with-issues}
      - {from: inspect-with-issues, to: decide}
      - {from: complete-not-needed, to: END}
      - {from: complete-resolved, to: END}
      - {from: complete-exhausted, to: END}
      - {from: complete-skipped, to: END}
      - {from: complete-failed, to: END}

    routes:
      - from: entry
        select: "node('entry').gate.verdict"
        cases:
          enter: proposal
          skip: complete-not-needed
          stop: complete-failed
          reject: complete-failed
        default: complete-failed

      - from: fixer-authority-ready
        select: "node('fixer-authority-ready').value.route"
        cases:
          pass: fixer-proposal-approval
          stop: complete-failed
        default: complete-failed

      - from: fixer-proposal-approval
        select: "node('fixer-proposal-approval').gate.verdict"
        cases:
          pass: fixer-dispatch
          needs_human_review: fixer-approval-interrupt
          stop: complete-failed
          reject: complete-failed
        default: complete-failed

      - from: fixer-approval-interrupt
        select: "resume.action"
        cases:
          approve_and_apply: record-fixer-approval
          stop: complete-failed
        default: complete-failed


      # Post-fixer aborts stop the run rather than returning through
      # `complete-failed`. By the time control reaches `safety`, `fix-api` /
      # `fix-e2e` have already written test files and `rerun` has not run, so
      # `inspect/trace-sufficiency.json` still describes the batch from *before*
      # those edits. Ending healing normally would hand `assurance` an ordinary
      # completed healing, and `trace-sufficiency` would then vouch for pre-fix
      # evidence — passing a change whose tests on disk have never been executed.
      # Re-materializing here would not close it: sufficiency measures staleness
      # against the batch's own `executed_at`, so a refold over the same manifest
      # reproduces the same document, edits or not. The only honest answer is that
      # nothing has adjudicated this state, so nothing may pass it.
      #
      # `complete-failed` stays for the two aborts that are *not* post-fixer:
      # `entry` (no fixer has run yet) and `decide`'s `reject` (a rerun and a full
      # re-inspection have run since), where the facts on disk do describe the
      # tests on disk.
      - from: safety
        select: "node('safety').gate.verdict"
        cases:
          pass: rerun
          needs_human_review: safety-interrupt
          stop: STOP
          reject: STOP
        default: STOP

      # Only `rerun` and `STOP` leave this interrupt, which is what makes the
      # invariant hold: once `fix-api`/`fix-e2e` have written, every route to a
      # healing completion runs through `rerun`.
      - from: safety-interrupt
        select: "resume.action"
        cases:
          accept_risk: rerun
          stop: STOP
        default: STOP

      - from: decide
        select: "node('decide').gate.verdict"
        cases:
          exit: complete-resolved
          continue: proposal
          stop: complete-exhausted
          reject: complete-failed
        default: complete-failed

  # Coverage-repair inner loop. Not inside `healing`: healing owns FAIL→fixer;
  # this owns PASS-with-coverage-shortfall→add-tests. Entry and loop use separate
  # gates so entry never references `status.json` (created only by `allocate`) —
  # `missing_field_is` runs before `missing_file_is`, so a shared gate would STOP
  # the ordinary "nothing to repair" first pass. Safety is a private gate with
  # its own evidence path: reusing `fixer-safety-gate` would STOP when healing
  # never ran, or vouch for stale healing evidence when it did. The loop stays
  # inside the subgraph so the main assurance graph remains a DAG. It precedes
  # `materialize-pr-metrics` so the authoritative write aggregates the
  # post-repair batch; this subgraph never declares `inspect/metrics.json`.
  coverage-repair:
    # Required, no default. 50 matches `healing`; the budget (default 1 attempt)
    # is the real bound, this is the runaway backstop.
    max_supersteps: 50
    budgets:
      coverage_repair_attempts:
        limit: "params.max_coverage_repair_attempts"

    nodes:
      probe-entry:
        uses: operation:probe-coverage-repair-need
        retry: never
        timeout: local-operation

      entry:
        uses: builtin:gate
        with: {gate: coverage-repair-entry-gate}

      allocate:
        uses: operation:allocate-coverage-repair-attempt
        retry: never
        timeout: local-operation
        budget:
          consume: coverage_repair_attempts
          "on": committed
          exhausted_to: complete-exhausted

      repair:
        uses: skill:aa-coverage-repair
        agent: aa-test-author
        outputs:
          - change:coverage-repair/apply-summary.json
        retry: agent-transient
        timeout: agent

      compute-safety:
        uses: operation:compute-coverage-repair-safety
        retry: never
        timeout: local-operation

      safety:
        uses: builtin:gate
        with: {gate: coverage-repair-safety-gate}

      safety-interrupt:
        uses: builtin:interrupt
        interrupt:
          reason: "coverage-repair safety requires human review"
          checkpoint: coverage-repair-safety-gate
          bind: audited_gate_read
          # Same invariant as healing: once repair has written, every completion
          # path must pass through rerun. accept_risk → rerun; stop → STOP.
          # Checkpoint is the gate id (not a special alias) so
          # resolve_decision_support / audited_gate_read bind without a
          # healing.safety-style SPECIAL_DECISION_SUPPORT entry.
          actions: [accept_risk, stop]

      rerun:
        uses: operation:run-tests-and-collect-pr-metrics
        outputs: [change:execution/execution-manifest.yaml]
        retry: cli-transient
        timeout: cli

      inspect-with-issues:
        uses: graph:inspect-with-issues

      probe-loop:
        uses: operation:probe-coverage-repair-need
        retry: never
        timeout: local-operation

      decide:
        uses: builtin:gate
        with: {gate: coverage-repair-loop-gate}

      complete-not-eligible:
        uses: operation:record-coverage-repair-status
        with: {status: not_eligible}
        retry: never

      complete-repaired:
        uses: operation:record-coverage-repair-status
        with: {status: repaired}
        retry: never

      complete-exhausted:
        uses: operation:record-coverage-repair-status
        with: {status: exhausted}
        retry: never

      complete-failed:
        uses: operation:record-coverage-repair-status
        with: {status: failed}
        retry: never

    edges:
      - {from: START, to: probe-entry}
      - {from: probe-entry, to: entry}
      - {from: allocate, to: repair}
      - {from: repair, to: compute-safety}
      - {from: compute-safety, to: safety}
      - {from: rerun, to: inspect-with-issues}
      - {from: inspect-with-issues, to: probe-loop}
      - {from: probe-loop, to: decide}
      - {from: complete-not-eligible, to: END}
      - {from: complete-repaired, to: END}
      - {from: complete-exhausted, to: END}
      - {from: complete-failed, to: END}

    routes:
      - from: entry
        select: "node('entry').gate.verdict"
        cases:
          enter: allocate
          skip: complete-not-eligible
          stop: complete-failed
        default: complete-failed

      - from: safety
        select: "node('safety').gate.verdict"
        cases:
          pass: rerun
          needs_human_review: safety-interrupt
          stop: STOP
          reject: STOP
        default: STOP

      - from: safety-interrupt
        select: "resume.action"
        cases:
          accept_risk: rerun
          stop: STOP
        default: STOP

      - from: decide
        select: "node('decide').gate.verdict"
        cases:
          reject: complete-failed
          exit: complete-repaired
          skip: complete-exhausted
          continue: allocate
        default: complete-failed

  # ---- improvement-evaluate-workflow: memory_patch eval only -------------
  improvement-evaluate-workflow:
    max_supersteps: 4
    nodes:
      load-improvement-delivery:
        uses: operation:load-improvement-delivery
        retry: never
        timeout: local-operation
      evaluate-memory:
        uses: operation:evaluate-memory-improvement
        retry: never
        timeout: cli
    edges:
      - {from: START, to: load-improvement-delivery}
      - {from: evaluate-memory, to: END}
    routes:
      - from: load-improvement-delivery
        select: "node('load-improvement-delivery').value.delivery"
        cases:
          memory_patch: evaluate-memory
        default: STOP

  # ---- improvement-export-workflow: change_draft | knowledge_delta --------
  improvement-export-workflow:
    max_supersteps: 4
    nodes:
      load-improvement-delivery:
        uses: operation:load-improvement-delivery
        retry: never
        timeout: local-operation
      export-change:
        uses: operation:export-change-improvement
        retry: project-sync
        timeout: cli
      export-knowledge:
        uses: operation:export-knowledge-improvement
        retry: project-sync
        timeout: cli
    edges:
      - {from: START, to: load-improvement-delivery}
      - {from: export-change, to: END}
      - {from: export-knowledge, to: END}
    routes:
      - from: load-improvement-delivery
        select: "node('load-improvement-delivery').value.delivery"
        cases:
          change_draft: export-change
          knowledge_delta: export-knowledge
        default: STOP

  # ---- improvement-apply-workflow: memory apply | record external apply --
  improvement-apply-workflow:
    max_supersteps: 4
    nodes:
      load-improvement-delivery:
        uses: operation:load-improvement-delivery
        retry: never
        timeout: local-operation
      apply-memory:
        uses: operation:apply-memory-improvement
        retry: project-sync
        timeout: cli
      record-change-applied:
        uses: operation:record-change-improvement-applied
        retry: project-sync
        timeout: cli
      record-knowledge-applied:
        uses: operation:record-knowledge-improvement-applied
        retry: project-sync
        timeout: cli
    edges:
      - {from: START, to: load-improvement-delivery}
      - {from: apply-memory, to: END}
      - {from: record-change-applied, to: END}
      - {from: record-knowledge-applied, to: END}
    routes:
      - from: load-improvement-delivery
        select: "node('load-improvement-delivery').value.delivery"
        cases:
          memory_patch: apply-memory
          change_draft: record-change-applied
          knowledge_delta: record-knowledge-applied
        default: STOP

  # ---- improvement-rollback-workflow: applied memory_patch only ----------
  improvement-rollback-workflow:
    max_supersteps: 4
    nodes:
      load-improvement-delivery:
        uses: operation:load-improvement-delivery
        retry: never
        timeout: local-operation
      rollback-memory:
        uses: operation:rollback-memory-improvement
        retry: project-sync
        timeout: cli
    edges:
      - {from: START, to: load-improvement-delivery}
      - {from: rollback-memory, to: END}
    routes:
      - from: load-improvement-delivery
        select: "node('load-improvement-delivery').value.delivery"
        cases:
          memory_patch: rollback-memory
        default: STOP

  # ---- improvement-review-workflow: human Improvement review (repeatable) -
  improvement-review-workflow:
    # Non-blocking, repeatable human review of a single Improvement.
    # load-improvement writes the review context; human-interrupt captures
    # the decision; apply-review appends the canonical event to the project
    # Improvement ledger only (never qa/issues/**).
    max_supersteps: 6
    nodes:
      load-improvement:
        uses: operation:load-improvement-review-context
        retry: never
        timeout: local-operation

      human-interrupt:
        uses: builtin:interrupt
        interrupt:
          reason: "Review improvement and take action"
          checkpoint: improvement-review
          bind: audited_gate_read
          actions:
            - approve
            - reject
            - request_rework
            - supersede
            - stop

      apply-review:
        uses: operation:apply-improvement-review
        retry: project-sync
        timeout: cli

    edges:
      - {from: START, to: load-improvement}
      - {from: load-improvement, to: human-interrupt}
      - {from: apply-review, to: END}

    routes:
      - from: human-interrupt
        select: "resume.action"
        cases:
          approve: apply-review
          reject: apply-review
          request_rework: apply-review
          supersede: apply-review
          stop: STOP
        default: STOP

  # ---- issue-review-workflow: human Problem review (repeatable) --------
  issue-review-workflow:
    # Non-blocking, repeatable human review of a single Problem.
    # load-problem writes the review context; triage-advisor writes advice
    # (display-only); human-interrupt captures the decision; apply-review
    # appends the canonical event to the project Problem ledger.
    max_supersteps: 6
    nodes:
      load-problem:
        uses: operation:load-problem-review-context
        retry: never
        timeout: local-operation

      triage-advisor:
        uses: skill:aa-issue-triage-advisor
        agent: aa-reporter
        outputs:
          - change:issue-review/**
        retry: llm-default
        timeout: agent

      human-interrupt:
        uses: builtin:interrupt
        interrupt:
          reason: "Review problem and take action"
          checkpoint: review
          bind: audited_gate_read
          actions:
            - confirm_assessment
            - mark_not_an_issue
            - accept_risk
            - start_work
            - confirm_link
            - merge
            - reopen
            - submit_resolution
            - stop

      apply-review:
        uses: operation:apply-problem-review
        retry: project-sync
        timeout: cli

    edges:
      - {from: START, to: load-problem}
      - {from: load-problem, to: triage-advisor}
      - {from: triage-advisor, to: human-interrupt}
      - {from: apply-review, to: END}

    routes:
      - from: human-interrupt
        select: "resume.action"
        cases:
          confirm_assessment: apply-review
          mark_not_an_issue: apply-review
          accept_risk: apply-review
          start_work: apply-review
          confirm_link: apply-review
          merge: apply-review
          reopen: apply-review
          submit_resolution: apply-review
          stop: STOP
        default: STOP

  # ---- issue-analyze-workflow: retry analyzer without re-collecting -----
  issue-analyze-workflow:
    # Reruns the LLM analyzer against the latest existing Observation/evidence
    # digest and then reconciles on success.  Never re-collects evidence.
    # Repeatable: can be retried as many times as needed after analysis failure.
    max_supersteps: 9
    nodes:
      analyze-issues:
        uses: skill:aa-issue-analyzer
        agent: aa-reporter
        outputs:
          - change:inspect/issue-candidates.json
          - change:inspect/issue-analysis-status.json
        retry: llm-default
        timeout: agent
        recover:
          errors: [timeout, transport, rate_limit, invalid_output]
          via: record-analysis-failure
          continue_to: materialize-trace-projection

      record-analysis-failure:
        uses: operation:record-issue-analysis-failure
        retry: never
        timeout: local-operation

      reconcile-issues:
        uses: operation:reconcile-issues
        retry: project-sync
        timeout: cli
        recover:
          errors: [conflict, transport]
          via: record-project-sync-pending
          continue_to: materialize-trace-projection

      record-project-sync-pending:
        uses: operation:record-project-sync-pending
        retry: never
        timeout: local-operation

      materialize-trace-projection:
        uses: operation:materialize-trace-projection
        outputs:
          - change:inspect/trace-projection.json

    edges:
      - {from: START, to: analyze-issues}
      - {from: analyze-issues, to: reconcile-issues}
      - {from: reconcile-issues, to: materialize-trace-projection}
      - {from: materialize-trace-projection, to: END}

  # ---- issue-reconcile-workflow: idempotent reconcile retry --------------
  issue-reconcile-workflow:
    # Reruns only operation:reconcile-issues for the latest pinned
    # candidate/evidence digest.  Idempotent retry path for project_sync_pending.
    # Never calls the LLM.
    max_supersteps: 6
    nodes:
      reconcile-issues:
        uses: operation:reconcile-issues
        retry: project-sync
        timeout: cli
        recover:
          errors: [conflict, transport]
          via: record-project-sync-pending
          continue_to: materialize-trace-projection

      record-project-sync-pending:
        uses: operation:record-project-sync-pending
        retry: never
        timeout: local-operation

      materialize-trace-projection:
        uses: operation:materialize-trace-projection
        outputs:
          - change:inspect/trace-projection.json

    edges:
      - {from: START, to: reconcile-issues}
      - {from: reconcile-issues, to: materialize-trace-projection}
      - {from: materialize-trace-projection, to: END}

  # ---- metrics-nightly-workflow: nightly oracle-strength carrier (M2/M3) ----
  # Explicit change_id via `aa workflow run --change … --entrypoint metrics-nightly`.
  # Order: load PR metrics → mutation/assertion/perf/yield collectors → aggregate
  # nightly → retrospective shortboards. Never writes inspect/metrics.json.
  metrics-nightly-workflow:
    max_supersteps: 14
    nodes:
      run-nightly-metrics-pipeline:
        uses: operation:run-nightly-metrics-pipeline
        retry: never
        timeout: local-operation
        outputs:
          - change:inspect/metrics-nightly.json
          - change:inspect/metrics-nightly-shortboards.json
    edges:
      - {from: START, to: run-nightly-metrics-pipeline}
      - {from: run-nightly-metrics-pipeline, to: END}

gates:
  registry-gate:
    reads: [{ path: registry/skill-registry-check.json, as: registry }]
    invalid_json: stop
    missing_field_is: stop
    pass_when: "registry.status == 'pass' and registry.healing_available == true"
    stop_when: "registry.status == 'fail' or registry.healing_available == false"

  case-review-gate:
    reads: [review/case-review.json]
    invalid_json: stop
    missing_field_is: stop
    needs_fix_when: "case_review.decision == 'needs_fix' and case_review.auto_fix_allowed == true"
    needs_human_review_when: >
      case_review.decision == 'needs_human_review'
      or (
        case_review.human_review_required == true
        and not (
          params.force_continue == true
          and policy.force_continue_allowed == true
          and case_review.decision == 'pass'
        )
      )
    reject_when: "case_review.decision == 'reject'"
    pass_when: "case_review.decision == 'pass'"

  case-design-gate:
    reads:
      - { path: .qa.yaml, as: qa }
    invalid_json: stop
    missing_field_is: stop
    pass_when: >
      qa.approval.mode == 'autonomous'
      or (
        qa.approval.approved_by == 'user'
        and qa.approval.approved_approach != null
        and qa.approval.approved_at != null
      )

  api-plan-review-gate: &plan-review-gate
    reads:
      - { path: review/api-plan-review.json, as: api_plan_review }
      - { path: review/api-plan-checks.json, as: api_plan_checks }
      - { path: repo:.aa/data-knowledge.yaml, as: data_knowledge }
    invalid_json: stop
    missing_field_is: stop
    stop_when: >
      plan_assurance_state(api_plan_checks, api_plan_review, data_knowledge, 'api') == 'invalid'
    skip_when: >
      plan_assurance_state(api_plan_checks, api_plan_review, data_knowledge, 'api') == 'not_applicable'
    needs_fix_when: "api_plan_review.decision == 'needs_fix' and api_plan_review.auto_fix_allowed == true"
    needs_human_review_when: >
      api_plan_review.decision != 'reject'
      and plan_assurance_state(api_plan_checks, api_plan_review, data_knowledge, 'api') == 'applicable'
      and (
        not capabilities_present(api_plan_review, data_knowledge)
        or api_plan_review.decision == 'needs_human_review'
        or (
          (api_plan_review.human_review_required == true or api_plan_review.risk_level in policy.human_review_risk_levels)
          and not (
            params.force_continue == true
            and policy.force_continue_allowed == true
            and api_plan_review.decision == 'pass'
            and api_plan_review.codegen_readiness in ['ready','ready_with_warnings']
          )
        )
        or (
          check_failed(api_plan_checks, 'l1_path') and policy.plan_checks.l1_path == 'require_human'
        )
        or (
          check_failed(api_plan_checks, 'shared_factory') and policy.plan_checks.shared_factory == 'require_human'
        )
        or (
          check_failed(api_plan_checks, 'assert_ideal') and policy.plan_checks.assert_ideal == 'require_human'
        )
        or (
          check_failed(api_plan_checks, 'capability_keys') and policy.plan_checks.capability_keys == 'require_human'
        )
      )
    reject_when: >
      api_plan_review.decision == 'reject'
      or api_plan_review.codegen_readiness == 'not_ready'
      or (
        plan_assurance_state(api_plan_checks, api_plan_review, data_knowledge, 'api') == 'applicable'
        and (
          (check_failed(api_plan_checks, 'l1_path') and policy.plan_checks.l1_path == 'block')
          or (check_failed(api_plan_checks, 'shared_factory') and policy.plan_checks.shared_factory == 'block')
          or (check_failed(api_plan_checks, 'assert_ideal') and policy.plan_checks.assert_ideal == 'block')
          or (check_failed(api_plan_checks, 'capability_keys') and policy.plan_checks.capability_keys == 'block')
        )
      )
    pass_when: >
      plan_assurance_state(api_plan_checks, api_plan_review, data_knowledge, 'api') == 'applicable'
      and api_plan_review.decision == 'pass'
      and api_plan_review.codegen_readiness in ['ready','ready_with_warnings']
