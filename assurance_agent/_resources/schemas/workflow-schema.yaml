      - { path: repo:.aa/data-knowledge.yaml, as: data_knowledge }
    skip_when: >
      plan_assurance_state(api_plan_checks, api_plan_review, data_knowledge, 'api') == 'not_applicable'
    stop_when: >
      node('review-cycle').status != 'succeeded'
      or plan_assurance_state(api_plan_checks, api_plan_review, data_knowledge, 'api') == 'invalid'
      or not file_exists('repo:.aa/data-knowledge.yaml')
    pass_when: >
      node('review-cycle').status == 'succeeded'
      and plan_assurance_state(api_plan_checks, api_plan_review, data_knowledge, 'api') == 'applicable'
      and gate('api-plan-review-gate').verdict == 'pass'
      and file_exists('repo:.aa/data-knowledge.yaml')
      and capabilities_present(api_plan_review, data_knowledge)

  e2e-codegen-precondition-gate:
    reads:
      - { path: review/plan-review.json, as: plan_review }
      - { path: review/e2e-plan-checks.json, as: e2e_plan_checks }
      - { path: repo:.aa/data-knowledge.yaml, as: data_knowledge }
    skip_when: >
      plan_assurance_state(e2e_plan_checks, plan_review, data_knowledge, 'e2e') == 'not_applicable'
    stop_when: >
      node('review-cycle').status != 'succeeded'
      or plan_assurance_state(e2e_plan_checks, plan_review, data_knowledge, 'e2e') == 'invalid'
      or not file_exists('repo:.aa/data-knowledge.yaml')
    pass_when: >
      node('review-cycle').status == 'succeeded'
      and plan_assurance_state(e2e_plan_checks, plan_review, data_knowledge, 'e2e') == 'applicable'
      and gate('e2e-plan-review-gate').verdict == 'pass'
      and file_exists('repo:.aa/data-knowledge.yaml')
      and capabilities_present(plan_review, data_knowledge)

  fuzz-codegen-precondition-gate:
    reads:
      - {path: review/fuzz-plan-review.json, as: fuzz_plan_review}
      - {path: review/fuzz-plan-checks.json, as: fuzz_plan_checks}
      - {path: repo:.aa/data-knowledge.yaml, as: data_knowledge}
    skip_when: >
      plan_assurance_state(fuzz_plan_checks, fuzz_plan_review, data_knowledge, 'fuzz') == 'not_applicable'
    stop_when: >
      node('review-cycle').status != 'succeeded'
      or plan_assurance_state(fuzz_plan_checks, fuzz_plan_review, data_knowledge, 'fuzz') == 'invalid'
      or not file_exists('repo:.aa/data-knowledge.yaml')
    pass_when: >
      node('review-cycle').status == 'succeeded'
      and plan_assurance_state(fuzz_plan_checks, fuzz_plan_review, data_knowledge, 'fuzz') == 'applicable'
      and gate('fuzz-plan-review-gate').verdict == 'pass'
      and capabilities_present(fuzz_plan_review, data_knowledge)
      and file_exists('repo:.aa/data-knowledge.yaml')

  performance-codegen-precondition-gate:
    reads:
      - {path: review/performance-plan-review.json, as: performance_plan_review}
      - {path: review/performance-plan-checks.json, as: performance_plan_checks}
      - {path: repo:.aa/data-knowledge.yaml, as: data_knowledge}
    skip_when: >
      plan_assurance_state(performance_plan_checks, performance_plan_review, data_knowledge, 'performance') == 'not_applicable'
    stop_when: >
      node('review-cycle').status != 'succeeded'
      or plan_assurance_state(performance_plan_checks, performance_plan_review, data_knowledge, 'performance') == 'invalid'
      or not file_exists('repo:.aa/data-knowledge.yaml')
    pass_when: >
      node('review-cycle').status == 'succeeded'
      and plan_assurance_state(performance_plan_checks, performance_plan_review, data_knowledge, 'performance') == 'applicable'
      and gate('performance-plan-review-gate').verdict == 'pass'
      and capabilities_present(performance_plan_review, data_knowledge)
      and file_exists('repo:.aa/data-knowledge.yaml')

  fixer-proposal-approval-gate:
    reads:
      - { path: healing/fix-proposal.json, as: fix_proposal }
    missing_file_is: stop
    stop_when: >
      not any(fix_proposal.proposals, eligible == true and target in ['api', 'e2e'])
    needs_human_review_when: >
      any(
        fix_proposal.proposals,
        eligible == true
        and target in ['api', 'e2e']
        and (risk_level in ['high', 'critical'] or needs_review == true)
      )
      and not file_exists('healing/fixer-proposal-approval.json')
    pass_when: >
      any(fix_proposal.proposals, eligible == true and target in ['api', 'e2e'])
      and (
        not any(
          fix_proposal.proposals,
          eligible == true
          and target in ['api', 'e2e']
          and (risk_level in ['high', 'critical'] or needs_review == true)
        )
        or file_exists('healing/fixer-proposal-approval.json')
      )

  fixer-safety-gate:
    reads: [healing/fixer-safety-check.json]
    missing_file_is: stop
    needs_human_review_when: >
      fixer_safety_check.passed == false
      or fixer_safety_check.needs_review == true
      or (
        policy.healing.auth_module == 'require_human'
        and fixer_safety_check.high_risk_proposal_applied == true
      )
    pass_when: >
      fixer_safety_check.passed == true
      and fixer_safety_check.product_code_modified == false
      and fixer_safety_check.assertion_expected_value_changes_detected == false
      and fixer_safety_check.skip_or_xfail_added == false
      and fixer_safety_check.unrelated_tests_modified == false
      and fixer_safety_check.high_risk_proposal_applied == false
      and policy.healing.auth_module != null

  # Entry adjudication for coverage repair. Reads only `brief.json`, which
  # `probe-entry` always writes before this gate runs. It must NOT read
  # `status.json`: that file is created by `allocate`, and gate evaluation applies
  # `missing_field_is` before `missing_file_is`, so referencing a field in a
  # not-yet-created file makes the ordinary "nothing to repair" first pass STOP
  # instead of skip. `eligible` is a stored brief field, not a rule re-derivation.
  coverage-repair-entry-gate:
    reads:
      - { path: coverage-repair/brief.json, as: brief }
    missing_file_is: stop
    invalid_json: stop
    missing_field_is: stop
    enter_when: "brief.eligible == true"
    skip_when: "brief.eligible == false"

  # Loop control. Only reachable downstream of `allocate`, so `status.json` is
  # guaranteed present; `execution-manifest.yaml` has existed since `execution`.
  # Budget exhaustion is NOT adjudicated here — `allocate`'s `exhausted_to`
  # owns it, exactly as in healing.
  coverage-repair-loop-gate:
    reads:
      - { path: coverage-repair/brief.json, as: brief }
      - { path: coverage-repair/status.json, as: repair }
      - { path: execution/execution-manifest.yaml, as: execution }
    missing_file_is: stop
    invalid_json: stop
    missing_field_is: stop
    reject_when: >
      execution.final_status == 'FAIL'
      or brief.probe_verdict == 'reject'
      or brief.probe_verdict == 'stop'
    exit_when: >
      brief.eligible == false
      and (brief.probe_verdict == 'pass' or brief.probe_verdict == 'skipped')
    skip_when: "brief.eligible == false and brief.probe_verdict == 'needs_human'"
    continue_when: "brief.eligible == true"

  # Coverage-repair safety. Deliberately NOT `fixer-safety-gate`: that gate reads
  # healing/fixer-safety-check.json and stops on a missing file, whose only
  # producer runs inside healing's apply path. Repair's typical scenario (tests
  # pass, coverage short) never enters healing, so reuse would STOP every repair;
  # when healing did run, reuse would vouch for stale evidence.
  coverage-repair-safety-gate:
    reads:
      - { path: coverage-repair/safety-check.json, as: safety }
    missing_file_is: stop
    invalid_json: stop
    missing_field_is: stop
    needs_human_review_when: >
      safety.needs_review == true
      or safety.skip_or_xfail_added == true
      or safety.stale_summary == true
      or len(safety.unbriefed_files_modified) > 0
    pass_when: >
      safety.passed == true
      and safety.product_code_modified == false
      and safety.declaration_files_modified == false
      and safety.skip_or_xfail_added == false

  healing-entry-gate:
    reads:
      - { path: execution/execution-manifest.yaml, as: execution }
      - { path: inspect/failure-analysis.json, as: failure_analysis }
      - { path: registry/skill-registry-check.json, as: registry }
    missing_file_is: stop
    invalid_json: stop
    missing_field_is: stop
    enter_when: >
      execution.final_status == 'FAIL'
      and any(failure_analysis.failures, fix_proposal_eligible == true)
      and failure_analysis.inspect_mode == 'primary'
      and registry.healing_available == true
    stop_when: >
      execution.final_status == 'FAIL'
      and any(failure_analysis.failures, fix_proposal_eligible == true)
      and registry.healing_available == false
    skip_when: >
      execution.final_status in ['PASS','PASS_WITH_WARNINGS']
      or not any(failure_analysis.failures, fix_proposal_eligible == true)

  healing-loop-gate:
    reads:
      - { path: execution/execution-manifest.yaml, as: execution }
      - { path: inspect/failure-analysis.json, as: failure_analysis }
      - { path: healing/status.json, as: healing }
    missing_file_is: stop
    invalid_json: stop
    missing_field_is: stop
    exit_when: "execution.final_status in ['PASS','PASS_WITH_WARNINGS']"
    continue_when: >
      execution.final_status == 'FAIL'
      and any(failure_analysis.failures, fix_proposal_eligible == true)
      and healing.attempts_used < params.max_healing_attempts
    stop_when: >
      healing.attempts_used >= params.max_healing_attempts
      or healing.all_fixers_no_op == true
    reject_when: >
      execution.final_status == 'FAIL'
      and not any(failure_analysis.failures, fix_proposal_eligible == true)

  # PR verification metrics sufficiency. No *_when DSL: floors/cadence/
  # on_insufficient are consumed by evaluate_metrics_sufficiency (Task 2), and
  # the runtime maps that decision onto pass / needs_human_review / reject /
  # stop / skip.
  # A tautological DSL restating floors would drift from the Python truth table.
  #
  # Isolation: this gate never writes execution-manifest / quality-gate artifacts;
  # healing-loop reject does not read inspect/metrics.json. `archive-gate` does
  # read it (see below), so a `reject` verdict here still blocks archival even
  # though the graph keeps flowing to report.
  metrics-sufficiency-gate:
    reads:
      - { path: inspect/metrics.json, as: metrics }
    missing_file_is: stop
    invalid_json: stop
    missing_field_is: stop

  # Case-evidence sufficiency, judged independently of what the execution found.
  # Reads only the facts document `operation:materialize-trace-projection`
  # publishes for it: the producer states facts and this gate maps them onto a
  # verdict, so there is one routing table rather than two that drift.
  #
  # Rule order is safety order (declaration order is evaluation order):
  #   1. stop — nothing trustworthy was judged (`error_code` / blocked
  #      integrity), or thin evidence a `block` policy refuses.
  #   2. needs_human_review — thin evidence a `require_human` policy escalates.
  #   3. reject — trustworthy evidence found an open product bug. Reject blocks
  #      release but routes onward to the failure report and benchmark analysis.
  #   4. pass — judged, believable, no open bug, and either sufficient or a
  #      `warn` policy that accepts the shortfall.
  # Anything unmatched, unreadable or missing is `stop`: a gate with no verdict
  # must not be indistinguishable from one that passed.
  trace-sufficiency-gate:
    reads:
      - { path: inspect/trace-sufficiency.json, as: trace }
    missing_file_is: stop
    invalid_json: stop
    missing_field_is: stop
    stop_when: >
      trace.error_code != null
      or trace.integrity_blocks_routing == true
      or (
        trace.error_code == null
        and trace.integrity_blocks_routing == false
        and trace.sufficient == false
        and policy.evidence_sufficiency.on_insufficient == 'block'
      )
    needs_human_review_when: >
      trace.error_code == null
      and trace.integrity_blocks_routing == false
      and trace.sufficient == false
      and policy.evidence_sufficiency.on_insufficient == 'require_human'
    reject_when: >
      trace.error_code == null
      and trace.integrity_blocks_routing == false
      and trace.has_open_problems == true
    pass_when: >
      trace.error_code == null
      and trace.integrity_blocks_routing == false
      and trace.has_open_problems == false
      and (
        trace.sufficient == true
        or policy.evidence_sufficiency.on_insufficient == 'warn'
      )

  archive-gate:
    reads:
      - { path: execution/execution-manifest.yaml, as: execution }
      - { path: inspect/failure-analysis.json, as: failure_analysis }
      - { path: inspect/trace-sufficiency.json, as: trace }
      - { path: healing/status.json, as: healing }
      - { path: review/case-review.json, as: case_review }
      - { path: review/api-plan-review.json, as: api_plan_review }
      - { path: review/plan-review.json, as: plan_review }
      - { path: inspect/metrics.json, as: metrics }
    missing_file_is: stop
    invalid_json: stop
    missing_field_is: stop
    causes:
      archive.execution_failed: "execution.final_status == 'FAIL'"
      archive.open_product_problem: "trace.has_open_problems == true"
      archive.healing_unsettled: "healing.status in ['applied','exhausted','failed']"
      archive.batch_mismatch: "failure_analysis.source_batch_id != execution.batch_id"
      # Mirrors `metrics-sufficiency-gate`'s `reject`: a collection gap ("no
      # number to judge") blocks archival the same way an open Problem does,
      # instead of being waved through because the graph kept flowing.
      archive.metrics_collection_gap: "len(metrics.collection_gaps) > 0"
    pass_when: >
      params.auto_archive == true
      and case_review.decision == 'pass'
      and (not ('api' in params.test_types) or api_plan_review.decision == 'pass')
      and (not ('e2e' in params.test_types) or plan_review.decision == 'pass')
      and execution.final_status in ['PASS','PASS_WITH_WARNINGS']
      and trace.has_open_problems == false
      and healing.status in ['not_needed','resolved','skipped']
      and failure_analysis.source_batch_id == execution.batch_id
      and not any(failure_analysis.failures, fix_proposal_eligible == true)
      and len(metrics.collection_gaps) == 0
    stop_when: >
      execution.final_status == 'FAIL'
      or trace.has_open_problems == true
      or healing.status in ['applied','exhausted','failed']
      or failure_analysis.source_batch_id != execution.batch_id
      or len(metrics.collection_gaps) > 0
