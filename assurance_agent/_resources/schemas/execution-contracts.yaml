    - change:review/case-review-apply-summary.md
    - change:cases/**
    - change:.qa.yaml
    - change:proposal.md
    - change:trace/minimum-coverage-matrix.yaml
    authorization_writes:
    - change:review/**
    - change:cases/**
    - change:.qa.yaml
    - change:proposal.md
    - change:trace/minimum-coverage-matrix.yaml
    retryable_errors:
