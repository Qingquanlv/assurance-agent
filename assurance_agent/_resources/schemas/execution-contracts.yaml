schema_version: '1'
contracts:
  builtin:join:
    handler: builtin
    side_effect_free: true
  builtin:gate:
    handler: builtin
    side_effect_free: true
  builtin:interrupt:
    handler: builtin
    side_effect_free: true
  operation:no-op:
    handler: operation
    side_effect_free: true
  operation:stop:
    handler: operation
    side_effect_free: true
  operation:record-healing-status:
    handler: operation
    writes:
    - change:healing/status.json
    authorization_writes:
    - change:healing/status.json
    retryable_errors: []
  operation:skill-registry-check:
    handler: operation
    reads:
    - project:skills/**
    writes:
    - change:registry/**
    authorization_writes:
    - change:registry/**
    retryable_errors: []
  operation:verify-plan-mechanical:
    handler: operation
    reads:
    - project:.aa/data-knowledge.yaml
    read_isolation: declared_only
    writes:
    - change:review/api-plan-checks.json
    - change:review/e2e-plan-checks.json
    - change:review/fuzz-plan-checks.json
    - change:review/performance-plan-checks.json
    authorization_writes:
    - change:review/api-plan-checks.json
    - change:review/e2e-plan-checks.json
    - change:review/fuzz-plan-checks.json
    - change:review/performance-plan-checks.json
    synchronized:
    - project:.aa/data-knowledge.yaml
    exclusive:
    - project:data-knowledge
    retryable_errors: []
  operation:derive-plan-layer-applicability:
    handler: operation
    reads:
    - change:cases/**/case.yaml
    side_effect_free: true
    retryable_errors: []
  operation:run-tests:
    handler: operation
    reads:
    - repo:tests/api/**
    - repo:tests/e2e/**
    - repo:tests/fuzz/**
    - repo:tests/perf/**
    - change:codegen/**
    - change:cases/**
    - change:execution/**
    - project:.aa/policy.yaml
    - project:.aa/cache/diff-base/**
    writes:
    - change:execution/**
    - project:.aa/cache/diff-base/**
    authorization_writes:
    - change:execution/**
    - project:.aa/cache/diff-base/**
    synchronized:
    - project:.aa/cache/diff-base/**
    exclusive:
    - repo:test-runtime
    - project:diff-base-cache
    retryable_errors:
    - timeout
    - transport
  operation:inspect:
    handler: operation
    reads:
    - change:execution/**
    - change:codegen/**
    writes:
    - change:inspect/**
    authorization_writes:
    - change:inspect/**
    retryable_errors:
    - timeout
    - transport
  operation:generate-report:
    handler: operation
    reads:
    - change:inspect/**
    - change:execution/**
    - change:review/**
    - change:healing/**
    - change:issues/snapshot.json
    - project:qa/issues/problems.json
    writes:
    - change:report/**
    authorization_writes:
    - change:report/**
    retryable_errors: []
  operation:allocate-healing-attempt:
    handler: operation
    reads:
    - change:execution/execution-manifest.yaml
    - change:healing/fix-proposal.json
    - change:codegen/**
    - change:execution/**
    writes:
    - change:healing/entry-baseline.json
    - change:healing/fixer-authority.json
    - change:healing/status.json
    authorization_writes:
    - change:healing/entry-baseline.json
    - change:healing/fixer-authority.json
    - change:healing/status.json
    retryable_errors: []
    durable_effects:
    - healing_allocation/v2
  skill:aa-explore:
    handler: agent
    reads:
    - project:qa/**
    - repo:**
    writes:
    - change:explore/**
    authorization_writes:
    - change:explore/**
    retryable_errors:
    - timeout
    - transport
    - rate_limit
    - invalid_output
    reconnect: true
  skill:aa-case-design:
    handler: agent
    reads:
    - change:explore/advisory.json
    - project:qa/**
    - repo:**
    writes:
    - change:.qa.yaml
    - change:proposal.md
    - change:cases/**
    - change:trace/minimum-coverage-matrix.yaml
    - change:plans/data-knowledge.proposal.api.yaml
    - change:plans/data-knowledge.proposal.e2e.yaml
    authorization_writes:
    - change:.qa.yaml
    - change:proposal.md
    - change:cases/**
    - change:trace/minimum-coverage-matrix.yaml
    - change:plans/data-knowledge.proposal.api.yaml
    - change:plans/data-knowledge.proposal.e2e.yaml
    retryable_errors:
    - timeout
    - transport
    - rate_limit
    - invalid_output
    reconnect: true
  skill:aa-case-reviewer:
    handler: agent
    reads:
    - change:.qa.yaml
    - change:proposal.md
    - change:cases/**
    - change:trace/minimum-coverage-matrix.yaml
    writes:
    - change:review/case-review.json
    authorization_writes:
    - change:review/**
    retryable_errors:
    - timeout
    - transport
    - rate_limit
    - invalid_output
    reconnect: true
  skill:aa-case-fixer:
