# =============================================================================
# AA Execution Contracts
# =============================================================================
#
# Default resource claims, write authorization and retry semantics for
# workflow node targets. A project-local `.aa/execution-contracts.yaml`
# overrides this packaged registry entirely. Targets missing from the
# registry — or write-capable targets whose write scope cannot be derived —
# fall back to a conservative `global:exclusive` claim at compile time.
# =============================================================================

schema_version: "1"

contracts:
  # ---- builtins ------------------------------------------------------------
  builtin:join:
    handler: builtin
    side_effect_free: true

  builtin:gate:
    handler: builtin
    side_effect_free: true

  builtin:interrupt:
    handler: builtin
    side_effect_free: true

  # ---- operations ----------------------------------------------------------
  operation:no-op:
    handler: operation
    side_effect_free: true

  operation:stop:
    handler: operation
    side_effect_free: true

  operation:record-healing-status:
    handler: operation
    writes:
      - change:healing/status.json
    authorization_writes:
      - change:healing/status.json
    retryable_errors: []

  operation:skill-registry-check:
    handler: operation
    reads:
      - project:skills/**
    writes:
      - change:registry/**
    authorization_writes:
      - change:registry/**
    retryable_errors: []

  operation:verify-plan-mechanical:
    handler: operation
    reads:
      - change:plans/**
      - change:cases/**
      - repo:.aa/data-knowledge.yaml
    writes:
      - change:review/*-plan-checks.json
    authorization_writes:
      - change:review/*-plan-checks.json
    retryable_errors: []

  operation:run-tests:
    handler: operation
    reads:
      - repo:tests/api/**
      - repo:tests/e2e/**
      - repo:tests/fuzz/**
      - repo:tests/perf/**
      - change:codegen/**
      # `aa run` folds a trace projection before it builds the gate: case
      # documents supply the rows, earlier execution batches supply their
      # timestamps and results, and the project policy supplies the sufficiency
      # constants. Declared so the scheduler serializes writers of those paths.
      - change:cases/**
      - change:execution/**
      - project:.aa/policy.yaml
      # A1/B1 diff base: the api runner diffs the product tree against this
      # snapshot to emit raw/changed-lines.json, then repoints it past a green
      # batch. Declared as a write because a task workspace is a materialized
      # copy — an undeclared snapshot is a forbidden_write, and a snapshot kept
      # out of the write-set would be discarded with the workspace, leaving the
      # next batch with no base to diff against.
      - project:.aa/cache/diff-base/**
    writes:
      - change:execution/**
      - project:.aa/cache/diff-base/**
    authorization_writes:
      - change:execution/**
      - project:.aa/cache/diff-base/**
    synchronized:
      - project:.aa/cache/diff-base/**
    exclusive: [repo:test-runtime, project:diff-base-cache]
    retryable_errors: [timeout, transport]

  operation:inspect:
    handler: operation
    reads:
      - change:execution/**
      - change:codegen/**
    writes:
      - change:inspect/**
    authorization_writes:
      - change:inspect/**
    retryable_errors: [timeout, transport]

  operation:generate-report:
    handler: operation
    reads:
      - change:inspect/**
      - change:execution/**
      - change:review/**
      - change:healing/**
      - change:issues/snapshot.json
      - project:qa/issues/problems.json
    writes:
      - change:report/**
    authorization_writes:
      - change:report/**
    retryable_errors: []

  operation:allocate-healing-attempt:
    handler: operation
    reads:
      - change:execution/execution-manifest.yaml
      - change:healing/fix-proposal.json
    writes:
      - change:healing/entry-baseline.json
      - change:healing/status.json
    authorization_writes:
      - change:healing/entry-baseline.json
      - change:healing/status.json
      - change:healing/**
    retryable_errors: []

  # Coverage-repair inner loop (design §8.1). Probe may not write
  # change:inspect/** — metrics/gaps stay write-once (§7). Safety must not
  # read change:healing/** — evidence is not reused across loops (v3-2).
  operation:probe-coverage-repair-need:
    handler: operation
    reads:
      - change:execution/runs/**
      - change:inspect/coverage-gaps.json
      - change:cases/**            # resolve_risk_tier, read-only
      - change:plans/**            # exact rerun scope from codegen plans
      - repo:.aa/policy.yaml       # v3-5: same policy source as materialize
    writes:
      - change:coverage-repair/brief.json
      - change:coverage-repair/brief.md
    authorization_writes:
      - change:coverage-repair/**
    retryable_errors: []

  operation:compute-coverage-repair-safety:
    handler: operation
    reads:
      - change:coverage-repair/brief.json
      - change:coverage-repair/entry-baseline.json   # v4-2: mechanical change-set baseline
      - change:coverage-repair/apply-summary.json    # contrast only, not the change-set source
      - repo:tests/**                               # hash_test_tree
      - repo:**                                     # hash_product_tree (roots from config)
      - project:.aa/config.yaml                     # load_product_code_roots
    writes:
      - change:coverage-repair/safety-check.json
    authorization_writes:
      - change:coverage-repair/**
    retryable_errors: []

  operation:allocate-coverage-repair-attempt:
    handler: operation
    reads:
      - change:coverage-repair/brief.json
      - change:coverage-repair/status.json
      - repo:tests/**              # v4-2: freeze baseline across three trees
      - repo:**
      - project:.aa/config.yaml
    writes:
      - change:coverage-repair/status.json
      - change:coverage-repair/entry-baseline.json
    authorization_writes:
      - change:coverage-repair/**
    retryable_errors: []

  operation:record-coverage-repair-status:
    handler: operation
    reads:
      - change:coverage-repair/status.json
      - change:coverage-repair/brief.json
    writes:
      - change:coverage-repair/status.json
    authorization_writes:
      - change:coverage-repair/**
    retryable_errors: []

  # ---- intake / case -------------------------------------------------------
  skill:aa-explore:
    handler: agent
    reads:
      - project:qa/**
      - repo:**
    writes:
      - change:explore/**
    authorization_writes:
      - change:explore/**
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true

  skill:aa-case-design:
    handler: agent
    reads:
      - change:explore/advisory.json
      - project:qa/**
      - repo:**
    writes:
      - change:.qa.yaml
      - change:proposal.md
      - change:cases/**
      - change:trace/minimum-coverage-matrix.yaml
    authorization_writes:
      - change:.qa.yaml
      - change:proposal.md
      - change:cases/**
      - change:trace/minimum-coverage-matrix.yaml
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true

  skill:aa-case-reviewer:
    handler: agent
    reads:
      - change:.qa.yaml
      - change:proposal.md
      - change:cases/**
      - change:trace/minimum-coverage-matrix.yaml
      - repo:**
    writes:
      - change:review/case-review.json
    authorization_writes:
      - change:review/**
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true

  skill:aa-case-fixer:
    handler: agent
    reads:
      - change:review/case-review.json
      - change:.qa.yaml
      - change:cases/**
      - change:trace/minimum-coverage-matrix.yaml
    writes:
      - change:review/case-review-apply-summary.md
      - change:cases/**
      - change:.qa.yaml
      - change:proposal.md
      - change:trace/minimum-coverage-matrix.yaml
    authorization_writes:
      - change:review/**
      - change:cases/**
      - change:.qa.yaml
      - change:proposal.md
      - change:trace/minimum-coverage-matrix.yaml
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true

  skill:aa-fact-baseline:
    handler: agent
    reads:
      - change:cases/**
      - change:.qa.yaml
      - repo:**
    writes:
      - change:facts/**
    authorization_writes:
      - change:facts/**
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true

  # ---- API branch ----------------------------------------------------------
  skill:aa-api-plan:
    handler: agent
    reads:
      - change:facts/fact-baseline.json
      - change:cases/**
    writes:
      - change:plans/api-plan.md
      - change:plans/api-test-data-plan.md
      - change:plans/api-codegen-plan.md
      - change:plans/m3-review-summary.md
    authorization_writes:
      - change:plans/**
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true

  skill:aa-api-plan-reviewer:
    handler: agent
    reads:
      - change:plans/api-*.md
      - change:plans/m3-review-summary.md
    writes:
      - change:review/api-plan-review.json
      - change:review/api-plan-review-summary.md
    authorization_writes:
      - change:review/api-plan-review.json
      - change:review/api-plan-review-summary.md
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true

  skill:aa-api-plan-fixer:
    handler: agent
    reads:
      - change:review/api-plan-review.json
      - change:plans/api-*.md
    writes:
      - change:review/api-plan-review-apply-summary.md
      - change:plans/api-*.md
      - change:plans/m3-review-summary.md
    authorization_writes:
      - change:review/**
      - change:plans/**
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true

  skill:aa-api-codegen:
    handler: agent
    reads:
      - change:plans/api-*.md
      - change:review/api-plan-review.json
      - repo:.aa/data-knowledge.yaml
    writes:
      - change:codegen/api-codegen-summary.md
      - change:codegen/api-generated-files.json
      - repo:tests/api/**
      # Shared domain factories (create-if-missing / reuse). Serialized by the
      # repo:test-infra exclusive lock so concurrent layers cannot clobber.
      - repo:tests/testdata/**
    exclusive: [repo:test-infra]
    authorization_writes:
      - change:codegen/api-codegen-summary.md
      - change:codegen/api-generated-files.json
      - repo:tests/api/**
      - repo:tests/testdata/**
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true

  # ---- E2E branch ----------------------------------------------------------
  skill:aa-e2e-plan:
    handler: agent
    reads:
      - change:facts/fact-baseline.json
      - change:cases/**
    writes:
      - change:plans/e2e-plan.md
      - change:plans/e2e-test-data-plan.md
      - change:plans/e2e-codegen-plan.md
      - change:plans/m4-review-summary.md
    authorization_writes:
      - change:plans/**
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true

  skill:aa-e2e-plan-reviewer:
    handler: agent
    reads:
      - change:plans/e2e-*.md
      - change:plans/m4-review-summary.md
    writes:
      - change:review/plan-review.json
      - change:review/plan-review-summary.md
    authorization_writes:
      - change:review/**
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true

  skill:aa-e2e-plan-fixer:
    handler: agent
    reads:
      - change:review/plan-review.json
      - change:plans/e2e-*.md
    writes:
      - change:review/plan-review-apply-summary.md
      - change:plans/e2e-*.md
      - change:plans/m4-review-summary.md
    authorization_writes:
      - change:review/**
      - change:plans/**
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true

  skill:aa-e2e-codegen:
    handler: agent
    reads:
      - change:plans/e2e-*.md
      - change:review/plan-review.json
      - repo:.aa/data-knowledge.yaml
    writes:
      - change:codegen/e2e-codegen-summary.md
      - change:codegen/e2e-generated-files.json
      - repo:tests/e2e/**
      - repo:tests/testdata/**
    exclusive: [repo:test-infra]
    authorization_writes:
      - change:codegen/e2e-codegen-summary.md
      - change:codegen/e2e-generated-files.json
      - repo:tests/e2e/**
      - repo:tests/testdata/**
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true

  # ---- Fuzz branch ---------------------------------------------------------
  skill:aa-fuzz-plan:
    handler: agent
    reads:
      - change:facts/fact-baseline.json
      - change:cases/**
    writes:
      - change:plans/fuzz-plan.md
      - change:plans/fuzz-codegen-plan.md
      - change:plans/fuzz-review-summary.md
    authorization_writes:
      - change:plans/**
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true

  skill:aa-fuzz-plan-reviewer:
    handler: agent
    reads:
      - change:plans/fuzz-*.md
    writes:
      - change:review/fuzz-plan-review.json
      - change:review/fuzz-plan-review-summary.md
    authorization_writes:
      - change:review/**
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true

  skill:aa-fuzz-codegen:
    handler: agent
    reads:
      - change:plans/fuzz-*.md
      - change:review/fuzz-plan-review.json
    writes:
      - change:codegen/fuzz-codegen-summary.md
      - change:codegen/fuzz-generated-files.json
      - repo:tests/fuzz/**
      - repo:tests/testdata/**
    exclusive: [repo:test-infra]
    authorization_writes:
      - change:codegen/fuzz-codegen-summary.md
      - change:codegen/fuzz-generated-files.json
      - repo:tests/fuzz/**
      - repo:tests/testdata/**
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true

  # ---- Performance branch --------------------------------------------------
  skill:aa-performance-plan:
    handler: agent
    reads:
      - change:facts/fact-baseline.json
      - change:cases/**
    writes:
      - change:plans/performance-plan.md
      - change:plans/performance-codegen-plan.md
      - change:plans/performance-review-summary.md
    authorization_writes:
      - change:plans/**
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true

  skill:aa-performance-plan-reviewer:
    handler: agent
    reads:
      - change:plans/performance-*.md
    writes:
      - change:review/performance-plan-review.json
      - change:review/performance-plan-review-summary.md
    authorization_writes:
      - change:review/**
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true

  skill:aa-performance-codegen:
    handler: agent
    reads:
      - change:plans/performance-*.md
      - change:review/performance-plan-review.json
    writes:
      - change:codegen/performance-codegen-summary.md
      - change:codegen/performance-generated-files.json
      - repo:tests/perf/**
      - repo:tests/testdata/**
    exclusive: [repo:test-infra]
    authorization_writes:
      - change:codegen/performance-codegen-summary.md
      - change:codegen/performance-generated-files.json
      - repo:tests/perf/**
      - repo:tests/testdata/**
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true

  # ---- inspect / healing / report / archive --------------------------------
  skill:aa-inspect:
    handler: agent
    reads:
      - change:execution/**
      - change:codegen/**
    writes:
      - change:inspect/**
    authorization_writes:
      - change:inspect/**
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true

  skill:aa-fix-proposal:
    handler: agent
    reads:
      - change:inspect/failure-analysis.json
      - change:execution/**
    writes:
      - change:healing/fix-proposal.json
      - change:healing/fix-proposal.md
    authorization_writes:
      - change:healing/fix-proposal.json
      - change:healing/fix-proposal.md
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true

  skill:aa-api-codegen-fixer:
    handler: agent
    reads:
      - change:healing/fix-proposal.json
      - change:codegen/api-codegen-summary.md
      - repo:tests/api/**
      - repo:tests/testdata/**
    writes:
      - change:healing/api-apply-summary.json
      - change:healing/fixer-safety-check.json
      - repo:tests/api/**
      # Shared domain factories referenced by api tests. Trusted edits only
      # (preserve shared contract); serialized by the repo:test-infra lock.
      - repo:tests/testdata/**
    exclusive: [repo:test-infra]
    authorization_writes:
      - change:healing/**
      - repo:tests/api/**
      - repo:tests/testdata/**
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true

  skill:aa-e2e-codegen-fixer:
    handler: agent
    reads:
      - change:healing/fix-proposal.json
      - change:codegen/e2e-codegen-summary.md
      - repo:tests/e2e/**
      - repo:tests/testdata/**
    writes:
      - change:healing/e2e-apply-summary.json
      - change:healing/fixer-safety-check.json
      - repo:tests/e2e/**
      - repo:tests/testdata/**
    exclusive: [repo:test-infra]
    authorization_writes:
      - change:healing/**
      - repo:tests/e2e/**
      - repo:tests/testdata/**
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true

  # Coverage-repair skill (design §8.1). No change:cases/** or project:.aa/**
  # write authority — declaration layer is immutable (§4).
  skill:aa-coverage-repair:
    handler: agent
    reads:
      - change:coverage-repair/brief.json
      - change:coverage-repair/entry-baseline.json
      - change:cases/**            # read-only: understand declared obligations
      - change:inspect/**
      - repo:tests/**
      - project:qa/**
    writes:
      - repo:tests/**
      - change:coverage-repair/apply-summary.json
    exclusive: [repo:test-infra]
    authorization_writes:
      - repo:tests/**
      - change:coverage-repair/**
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true

  skill:aa-report-generator:
    handler: agent
    reads:
      - change:inspect/**
      - change:execution/**
      - change:review/**
      - change:healing/**
      - change:issues/snapshot.json
      - project:qa/issues/problems.json
      - change:report/minimum-coverage-result.json
    writes:
      # MRC JSON is owned by operation:materialize-minimum-coverage — skill may
      # only refine prose around the CLI quality report outputs.
      - change:report/quality-report.json
      - change:report/quality-report.md
      - change:report/executive-summary.md
    authorization_writes:
      - change:report/quality-report.json
      - change:report/quality-report.md
      - change:report/executive-summary.md
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true

  skill:aa-archive:
    handler: agent
    reads:
      - change:**
      - project:qa/changes/**
      - project:qa/issues/problems.json
    writes:
      - project:qa/archive/**
    authorization_writes:
      - project:qa/archive/**
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true

  # ---- issue lifecycle -----------------------------------------------------
  skill:aa-issue-analyzer:
    handler: agent
    reads:
      - change:inspect/observations.json
      - change:inspect/issue-evidence-manifest.json
      - change:execution/**
      - change:cases/**
      - change:facts/**
      - change:review/**
      - change:healing/**
      - change:codegen/**
      - project:qa/issues/problems.json
      - project:qa/issues/review-queue.json
    writes:
      - change:inspect/issue-candidates.json
      - change:inspect/issue-analysis-status.json
    authorization_writes:
      - change:inspect/issue-candidates.json
      - change:inspect/issue-analysis-status.json
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true

  skill:aa-issue-triage-advisor:
    handler: agent
    reads:
      - project:qa/issues/problems.json
      - project:qa/issues/review-queue.json
      - change:issues/snapshot.json
    writes:
      - change:issue-review/**
    authorization_writes:
      - change:issue-review/**
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true

  operation:collect-observations:
    handler: operation
    reads:
      - change:execution/**
      - change:cases/**
      - change:facts/**
      - change:review/**
      - change:healing/**
      - change:codegen/**
    writes:
      - change:inspect/observations.json
      - change:inspect/issue-evidence-manifest.json
      - change:issues/events.jsonl
      - change:issues/snapshot.json
    authorization_writes:
      - change:inspect/observations.json
      - change:inspect/issue-evidence-manifest.json
      - change:issues/events.jsonl
      - change:issues/snapshot.json
    retryable_errors: [timeout, transport]

  operation:record-empty-issue-analysis:
    handler: operation
    reads:
      - change:inspect/issue-evidence-manifest.json
    writes:
      - change:inspect/issue-candidates.json
      - change:inspect/issue-analysis-status.json
    authorization_writes:
      - change:inspect/issue-candidates.json
      - change:inspect/issue-analysis-status.json
    retryable_errors: []

  operation:record-issue-analysis-failure:
    handler: operation
    reads:
      - change:inspect/issue-evidence-manifest.json
    writes:
      - change:inspect/issue-candidates.json
      - change:inspect/issue-analysis-status.json
      - change:issues/events.jsonl
      - change:issues/snapshot.json
    authorization_writes:
      - change:inspect/issue-candidates.json
      - change:inspect/issue-analysis-status.json
      - change:issues/events.jsonl
      - change:issues/snapshot.json
    retryable_errors: []

  operation:record-project-sync-pending:
    handler: operation
    reads:
      - change:inspect/issue-evidence-manifest.json
      - change:inspect/issue-candidates.json
    writes:
      - change:issues/events.jsonl
      - change:issues/snapshot.json
    authorization_writes:
      - change:issues/events.jsonl
      - change:issues/snapshot.json
    retryable_errors: []

  operation:reconcile-issues:
    handler: operation
    reads:
      - change:inspect/**
      - change:issues/**
      - project:qa/issues/**
    writes:
      - change:inspect/issue-reconcile-status.json
      - change:issues/events.jsonl
      - change:issues/snapshot.json
      - project:qa/issues/**
    authorization_writes:
      - change:inspect/issue-reconcile-status.json
      - change:issues/events.jsonl
      - change:issues/snapshot.json
      - project:qa/issues/**
    synchronized:
      - project:qa/issues/**
    exclusive:
      - project:issue-registry
    retryable_errors: [conflict, transport]

  # Publishes the reconciled trace projection and the facts the independent
  # trace-sufficiency gate routes on. Every read is declared because reads are
  # the scheduler's serialization key: `repo:tests/**` in particular, since the
  # fold scans the current test tree to decide whether a mapped test still
  # exists, so a fixer rewriting tests concurrently would change this node's
  # answer mid-flight. The authorization is the two documents and nothing else —
  # a trace verdict must not be able to touch the quality gate or the execution
  # manifest, whose `final_status` states what the execution found.
  operation:materialize-trace-projection:
    handler: operation
    reads:
      - change:cases/**
      - change:execution/**
      - change:inspect/failure-analysis.json
      - change:issues/snapshot.json
      - project:qa/issues/problems.json
      - project:.aa/policy.yaml
      - repo:tests/**
    writes:
      - change:inspect/trace-projection.json
      - change:inspect/trace-sufficiency.json
    authorization_writes:
      - change:inspect/trace-projection.json
      - change:inspect/trace-sufficiency.json
    retryable_errors: []

  # Dual-source Lane B: fold trace projection (+ sufficiency) → typed gap list.
  # Graph placement (after materialize-trace-projection) is deferred; callable +
  # contract land here so wiring can attach without reordering the main graph.
  operation:build-coverage-gap-signals:
    handler: operation
    reads:
      - change:inspect/trace-projection.json
      - change:inspect/trace-sufficiency.json
      # A2/A3 batch evidence feeds the constraint_without_property /
      # matrix_cell_unasserted extension kinds (best-effort; missing is not a gap).
      - change:execution/runs/*/constraint-coverage.json
      - change:execution/runs/*/auth-matrix.json
    writes:
      - change:inspect/coverage-gaps.json
    authorization_writes:
      - change:inspect/coverage-gaps.json
    retryable_errors: []

  # Deterministic MRC × execution join (Verification Metrics M1 Task 5).
  # Graph placement (after materialize-trace-projection / before report) is
  # deferred to Task 8; the callable + contract land here so wiring can attach
  # without inventing a parallel write path.
  operation:materialize-minimum-coverage:
    handler: operation
    reads:
      - change:trace/minimum-coverage-matrix.yaml
      - change:inspect/trace-projection.json
      # Advisory supplies category/layer/mrc_id maps for legacy short-key matrices.
      - change:explore/advisory.json
      - change:risk-advisory/advisory.json
      # L1 closed sets for §12.12 mechanical unknown_closed_key findings.
      - repo:.aa/data-knowledge.yaml
    writes:
      - change:report/minimum-coverage-result.json
    authorization_writes:
      - change:report/minimum-coverage-result.json
    retryable_errors: []

  # PR cadence collectors (Verification Metrics M1 Task 6). Batch-scoped
  # evidence under execution/runs/<batch>/; authoritative inspect/metrics.json
  # aggregation is Task 7. Graph wiring deferred to Task 8.
  operation:collect-diff-coverage:
    handler: operation
    reads:
      - change:execution/**
    writes:
      - change:execution/runs/*/coverage-diff.json
    authorization_writes:
      - change:execution/runs/*/coverage-diff.json
    retryable_errors: []

  operation:compute-constraint-coverage:
    handler: operation
    reads:
      - repo:tests/**
      - repo:.aa/data-knowledge.yaml
      - change:execution/**
      # Active quarantine keys exclude covered (M3 Task 4); missing = empty set.
      - change:inspect/quarantine-projection.json
    writes:
      - change:execution/runs/*/constraint-coverage.json
    authorization_writes:
      - change:execution/runs/*/constraint-coverage.json
    retryable_errors: []

  operation:compute-auth-matrix:
    handler: operation
    reads:
      - repo:.aa/data-knowledge.yaml
      - change:execution/**
      # The touched scope comes from the modules this change's cases declare;
      # undeclared, the workspace prunes them and every change reads as touching
      # nothing — which a touched-target floor cannot measure.
      - change:cases/**
    writes:
      - change:execution/runs/*/auth-matrix.json
    authorization_writes:
      - change:execution/runs/*/auth-matrix.json
    retryable_errors: []

  operation:compute-journey-coverage:
    handler: operation
    reads:
      - change:trace/minimum-coverage-matrix.yaml
      - change:inspect/trace-projection.json
      # Advisory supplies category/layer/mrc_id maps (same paths as MRC materialize).
      - change:explore/advisory.json
      - change:risk-advisory/advisory.json
      - change:execution/**
      # B2 e2e oracle classification reads covering_tests sources.
      - repo:tests/**
      # Active quarantine keys exclude covered (M3 Task 4); missing = empty set.
      - change:inspect/quarantine-projection.json
    writes:
      - change:execution/runs/*/journey-coverage.json
    authorization_writes:
      - change:execution/runs/*/journey-coverage.json
    retryable_errors: []

  # Quarantine ledger from C3 replay receipts (M3 Task 4). Graph wiring optional:
  # A2/A4 load the artifact from disk when present to avoid collect-batch churn.
  operation:materialize-quarantine-projection:
    handler: operation
    reads:
      - change:discovery/**
      - change:inspect/quarantine-projection.json
    writes:
      - change:inspect/quarantine-projection.json
    authorization_writes:
      - change:inspect/quarantine-projection.json
    retryable_errors: []

  # Report-only C1/C2/C3 aggregate (M4 Task 2). Not on metrics-sufficiency or
  # quality_gate paths — graph wiring optional / nightly later.
  operation:materialize-c-layer-metrics:
    handler: operation
    reads:
      - project:qa/issues/problems.json
      - change:discovery/**
      - change:inspect/coverage-gaps.json
      - change:inspect/metrics-c-layer.json
    writes:
      - change:inspect/metrics-c-layer.json
    authorization_writes:
      - change:inspect/metrics-c-layer.json
    retryable_errors: []

  operation:compute-threshold-slack:
    handler: operation
    reads:
      - change:execution/**
    writes:
      - change:execution/runs/*/perf-slack.json
    authorization_writes:
      - change:execution/runs/*/perf-slack.json
    retryable_errors: []

  # PR metrics batch collect + authoritative materialize (Verification Metrics
  # M1 Task 7/8). Collect runs after each run-tests (initial + healing) and writes
  # only batch-scoped evidence. Materialize runs once after healing, selects the
  # latest complete batch, and is the sole writer of inspect/metrics.json.
  # Graph: execution/rerun → collect → … → materialize → metrics-sufficiency-gate.
  operation:collect-pr-metrics-batch:
    handler: operation
    reads:
      - repo:tests/**
      - repo:.aa/data-knowledge.yaml
      - change:trace/minimum-coverage-matrix.yaml
      - change:inspect/trace-projection.json
      - change:explore/advisory.json
      - change:risk-advisory/advisory.json
      - change:execution/**
      - change:inspect/quarantine-projection.json
      # This node is where the five collectors actually run, so A3's touched
      # scope is pruned away unless the case documents are declared here too —
      # the sub-operation's own contract governs nothing in the wired graph.
      - change:cases/**
    writes:
      - change:execution/runs/*/coverage-diff.json
      - change:execution/runs/*/constraint-coverage.json
      - change:execution/runs/*/auth-matrix.json
      - change:execution/runs/*/journey-coverage.json
      - change:execution/runs/*/perf-slack.json
    authorization_writes:
      - change:execution/runs/*/coverage-diff.json
      - change:execution/runs/*/constraint-coverage.json
      - change:execution/runs/*/auth-matrix.json
      - change:execution/runs/*/journey-coverage.json
      - change:execution/runs/*/perf-slack.json
    retryable_errors: []

  operation:materialize-pr-metrics:
    handler: operation
    reads:
      - change:execution/runs/**
      - change:cases/**
      - repo:.aa/policy.yaml
    writes:
      - change:inspect/metrics.json
      - change:inspect/metrics-source-batch.json
      - change:execution/runs/*/metrics.json
    authorization_writes:
      - change:inspect/metrics.json
      - change:inspect/metrics-source-batch.json
      - change:execution/runs/*/metrics.json
    retryable_errors: []

  # Nightly metrics carrier (Verification Metrics M2 Task 1). Collectors are
  # stubs until Tasks 3–5; aggregate is the sole writer of
  # inspect/metrics-nightly.json. No nightly op may write inspect/metrics.json.
  operation:load-latest-pr-metrics:
    handler: operation
    reads:
      - change:inspect/metrics.json
    writes:
      - change:inspect/metrics-nightly-source.json
    authorization_writes:
      - change:inspect/metrics-nightly-source.json
    retryable_errors: []

  operation:run-mutation-sample:
    handler: operation
    reads:
      - repo:**
      - repo:tests/**
      # Replay cache for the sampled mutant set. Reachable only once A1 publishes
      # changed lines — before that the sampler returned early on "no touched
      # lines" and never wrote it, which is why an undeclared write stayed latent.
      - project:.aa/cache/mutation/**
    writes:
      - change:execution/runs/*/mutation.json
      - project:.aa/cache/mutation/**
    authorization_writes:
      - change:execution/runs/*/mutation.json
      - project:.aa/cache/mutation/**
    retryable_errors: []

  operation:compute-assertion-strength:
    handler: operation
    reads:
      - repo:tests/**
    writes:
      - change:execution/runs/*/assertion-strength.json
    authorization_writes:
      - change:execution/runs/*/assertion-strength.json
    retryable_errors: []

  operation:compute-baseline-drift:
    handler: operation
    reads:
      - change:execution/**
      - project:.aa/baseline/performance/**
    writes:
      - change:execution/runs/*/baseline-drift.json
      - project:.aa/baseline/performance/**
    authorization_writes:
      - change:execution/runs/*/baseline-drift.json
      - project:.aa/baseline/performance/**
    synchronized:
      - project:.aa/baseline/performance/**
    exclusive:
      - project:performance-baseline
    retryable_errors: []

  operation:collect-adversarial-yield:
    handler: operation
    reads:
      - change:discovery/**
      - change:issues/snapshot.json
    writes:
      - change:execution/runs/*/adversarial-yield.json
    authorization_writes:
      - change:execution/runs/*/adversarial-yield.json
    retryable_errors: []

  operation:aggregate-nightly-metrics:
    handler: operation
    reads:
      - change:inspect/metrics.json
      - change:inspect/metrics-nightly-source.json
      - change:execution/runs/**
      - change:cases/**
      - repo:.aa/policy.yaml
    writes:
      - change:inspect/metrics-nightly.json
    authorization_writes:
      - change:inspect/metrics-nightly.json
    retryable_errors: []

  operation:evaluate-retrospective-shortboards:
    handler: operation
    reads:
      - change:inspect/metrics-nightly.json
    writes:
      - change:inspect/metrics-nightly-shortboards.json
    authorization_writes:
      - change:inspect/metrics-nightly-shortboards.json
    retryable_errors: []

  operation:load-problem-review-context:
    handler: operation
    reads:
      - project:qa/issues/problems.json
      - project:qa/issues/review-queue.json
    writes:
      - change:issue-review/**
    authorization_writes:
      - change:issue-review/**
    retryable_errors: []

  operation:apply-problem-review:
    handler: operation
    reads:
      - change:issue-review/**
      - change:execution/**
      - project:qa/issues/**
    writes:
      - change:issue-review/**
      - project:qa/issues/**
    authorization_writes:
      - change:issue-review/**
      - project:qa/issues/**
    synchronized:
      - project:qa/issues/**
    exclusive:
      - project:issue-registry
    retryable_errors: [conflict, transport]

  # ---- retro workflow -------------------------------------------------------
  operation:retro-collect-v3:
    handler: operation
    reads:
      - project:qa/archive/**
      - project:qa/changes/**
      - project:qa/issues/**
      - project:qa/eval/**
    writes:
      # Publication synchronizes the Retro prefix; node resources and
      # authorization_writes narrow actual writes to the current run.
      - project:qa/retro/**
    authorization_writes:
      - project:qa/retro/*/window.json
      - project:qa/retro/*/evidence/**
      - project:qa/retro/*/signals/discovery.json
      - project:qa/retro/*/signals/coverage_gap.json
    synchronized:
      - project:qa/archive/**
      - project:qa/changes/**
      - project:qa/issues/**
      - project:qa/eval/**
      - project:qa/retro/**
    exclusive:
      - project:retro-evidence-snapshot
    retryable_errors: []

  operation:drain-improvement-outbox:
    handler: operation
    reads:
      - project:qa/improvements/**
    writes:
      - project:qa/improvements/**
    authorization_writes:
      - project:qa/improvements/**
    synchronized:
      - project:qa/improvements/**
    exclusive:
      - project:improvement-registry
    retryable_errors: [conflict]

  operation:assemble-retro-context-v3:
    handler: operation
    reads:
      - project:qa/retro/*/window.json
      - project:qa/retro/*/evidence/**
      - project:qa/retro/*/signals/**
    writes:
      - project:qa/retro/*/context.json
      - project:qa/retro/*/proposal-candidates.json
      - project:qa/retro/*/retro-summary.md
    authorization_writes:
      - project:qa/retro/*/context.json
      - project:qa/retro/*/proposal-candidates.json
      - project:qa/retro/*/retro-summary.md
    retryable_errors: []

  operation:retro-evidence-gap-fallback:
    handler: operation
    reads:
      - project:qa/retro/**
    writes:
      - project:qa/retro/**
    authorization_writes:
      - project:qa/retro/*/signals/**
      - project:qa/retro/*/context.json
      - project:qa/retro/*/proposal-candidates.json
      - project:qa/retro/*/retro-summary.md
    synchronized:
      - project:qa/retro/**
    exclusive:
      - project:retro-evidence-gap-fallback
    retryable_errors: []

  operation:record-retro-pipeline-failure:
    handler: operation
    reads:
      - project:qa/retro/**
      - project:qa/improvements/outbox/**
    writes:
      - project:qa/retro/**
      - project:qa/improvements/outbox/**
    authorization_writes:
      - project:qa/retro/**
      - project:qa/improvements/outbox/**
    exclusive:
      - project:retro-pipeline-failure
    retryable_errors: []

  operation:finalize-retro-status:
    handler: operation
    reads:
      - project:qa/retro/**
      - project:qa/improvements/outbox/**
    writes:
      - project:qa/retro/*/retro-status.json
    authorization_writes:
      - project:qa/retro/*/retro-status.json
    exclusive:
      - project:retro-status
    retryable_errors: []

  operation:record-analysis-failed:
    handler: operation
    reads:
      - project:qa/retro/*/evidence/**
    writes:
      - project:qa/retro/*/signals/**
    authorization_writes:
      - project:qa/retro/*/signals/**
    retryable_errors: []

  skill:aa-retro-issue-analysis:
    handler: agent
    reads: [project:qa/retro/*/evidence/issue-slice.json]
    writes: [project:qa/retro/*/signals/issue.json]
    authorization_writes: [project:qa/retro/*/signals/issue.json]
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true
    read_isolation: declared_only

  skill:aa-retro-workflow-analysis:
    handler: agent
    reads: [project:qa/retro/*/evidence/workflow-slice.json]
    writes: [project:qa/retro/*/signals/workflow.json]
    authorization_writes: [project:qa/retro/*/signals/workflow.json]
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true
    read_isolation: declared_only

  skill:aa-retro-eval-analysis:
    handler: agent
    reads: [project:qa/retro/*/evidence/eval-slice.json]
    writes: [project:qa/retro/*/signals/eval.json]
    authorization_writes: [project:qa/retro/*/signals/eval.json]
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true
    read_isolation: declared_only

  skill:aa-retro:
    handler: agent
    reads:
      - project:qa/retro/*/context.json
    writes:
      - project:qa/retro/*/proposal-candidates.json
      - project:qa/retro/*/retro-summary.md
    authorization_writes:
      - project:qa/retro/*/proposal-candidates.json
      - project:qa/retro/*/retro-summary.md
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true
    read_isolation: declared_only

  operation:reconcile-improvements:
    handler: operation
    # Static bounds: qa/retro/** covers current-run receipt writes under the
    # synchronized publication rule; planner narrow_claims replaces reads/writes
    # with concrete ${params.retro_id} paths so sibling runs stay out of scope.
    reads:
      - project:qa/retro/**
      - project:qa/improvements/**
    writes:
      - project:qa/retro/**
      - project:qa/improvements/**
    authorization_writes:
      - project:qa/retro/**
      - project:qa/improvements/**
    synchronized:
      - project:qa/improvements/**
      - project:qa/retro/**
    exclusive:
      - project:improvement-registry
    retryable_errors: []

  operation:load-improvement-review-context:
    handler: operation
    reads:
      - project:qa/improvements/improvements.json
      - project:qa/improvements/review-queue.json
    writes:
      - change:improvement-review/**
    authorization_writes:
      - change:improvement-review/**
    retryable_errors: []

  operation:load-review-subject:
    handler: operation
    side_effect_free: true
    reads: [project:qa/improvements/review-subjects/*.json]
    retryable_errors: [invalid_input, conflict]

  skill:aa-improvement-reviewer:
    handler: agent
    reads: [project:qa/improvements/review-subjects/*]
    writes:
      - project:qa/improvements/reviews/*/assessment.json
      - project:qa/improvements/reviews/*/summary.md
    authorization_writes:
      - project:qa/improvements/reviews/*/assessment.json
      - project:qa/improvements/reviews/*/summary.md
    retryable_errors: [timeout, transport, rate_limit, invalid_output]
    reconnect: true
    read_isolation: declared_only

  operation:validate-improvement-review-assessment:
    handler: operation
    reads:
      - project:qa/improvements/events.jsonl
      - project:qa/improvements/review-subjects/*.json
      - project:qa/improvements/reviews/*/assessment.json
    writes: [project:qa/improvements/reviews/*/gate-input.json]
    authorization_writes: [project:qa/improvements/reviews/*/gate-input.json]
    retryable_errors: []

  operation:record-improvement-auto-review-error:
    handler: operation
    reads: [project:qa/improvements/**]
    writes: [project:qa/improvements/**]
    authorization_writes: [project:qa/improvements/**]
    synchronized: [project:qa/improvements/**]
    exclusive: [project:improvement-registry]
    retryable_errors: []

  operation:apply-improvement-auto-review:
    handler: operation
    reads: [project:qa/improvements/**]
    writes: [project:qa/improvements/**]
    authorization_writes: [project:qa/improvements/**]
    synchronized: [project:qa/improvements/**]
    exclusive: [project:improvement-registry]
    retryable_errors: []

  operation:select-current-retro-auto-review-items:
    handler: operation
    reads:
      - project:qa/retro/*/accept-status.json
      - project:qa/improvements/**
    writes: [project:qa/retro/*/auto-review-selection.json]
    authorization_writes: [project:qa/retro/*/auto-review-selection.json]
    retryable_errors: []

  operation:summarize-auto-review-batch:
    handler: operation
    reads:
      - project:qa/improvements/reviews/*/status.json
      - project:qa/retro/*/auto-review-selection.json
    writes: [project:qa/retro/*/auto-review-summary.json]
    authorization_writes: [project:qa/retro/*/auto-review-summary.json]
    retryable_errors: []

  operation:record-auto-review-orchestration-error:
    handler: operation
    reads:
      - project:qa/improvements/reviews/*/status.json
      - project:qa/retro/*/auto-review-selection.json
    writes:
      - project:qa/retro/*/auto-review-selection.json
      - project:qa/retro/*/auto-review-summary.json
    authorization_writes:
      - project:qa/retro/*/auto-review-selection.json
      - project:qa/retro/*/auto-review-summary.json
    retryable_errors: []

  operation:apply-improvement-review:
    handler: operation
    reads:
      - change:improvement-review/**
      - project:qa/improvements/**
    writes:
      - change:improvement-review/**
      - project:qa/improvements/**
    authorization_writes:
      - change:improvement-review/**
      - project:qa/improvements/**
    synchronized:
      - project:qa/improvements/**
    exclusive:
      - project:improvement-registry
    retryable_errors: [conflict, transport]

  # ---- Improvement delivery (Task 11): narrow per-delivery targets --------
  operation:load-improvement-delivery:
    handler: operation
    reads:
      - project:qa/improvements/improvements.json
    writes:
      - change:improvement-delivery/**
    authorization_writes:
      - change:improvement-delivery/**
    retryable_errors: []

  operation:evaluate-memory-improvement:
    handler: operation
    reads:
      - project:qa/improvements/**
      - project:.aa/memory/**
      - project:eval/**
    writes:
      - project:qa/improvements/**
      - project:eval/**
    authorization_writes:
      - project:qa/improvements/events.jsonl
      - project:qa/improvements/improvements.json
      - project:qa/improvements/review-queue.json
      - project:eval/**
    synchronized:
      - project:qa/improvements/**
    exclusive:
      - project:improvement-registry
    retryable_errors: [conflict, transport]

  operation:apply-memory-improvement:
    handler: operation
    reads:
      - project:qa/improvements/**
      - project:.aa/memory/**
    writes:
      - project:qa/improvements/**
      - project:.aa/memory/**
    authorization_writes:
      - project:qa/improvements/events.jsonl
      - project:qa/improvements/improvements.json
      - project:qa/improvements/review-queue.json
      - project:.aa/memory/**
    synchronized:
      - project:qa/improvements/**
      - project:.aa/memory/**
    exclusive:
      - project:improvement-registry
    retryable_errors: [conflict, transport]

  operation:rollback-memory-improvement:
    handler: operation
    reads:
      - project:qa/improvements/**
      - project:.aa/memory/**
    writes:
      - project:qa/improvements/**
      - project:.aa/memory/**
    authorization_writes:
      - project:qa/improvements/events.jsonl
      - project:qa/improvements/improvements.json
      - project:qa/improvements/review-queue.json
      - project:.aa/memory/**
    synchronized:
      - project:qa/improvements/**
      - project:.aa/memory/**
    exclusive:
      - project:improvement-registry
    retryable_errors: [conflict, transport]

  operation:export-change-improvement:
    handler: operation
    reads:
      - project:qa/improvements/**
    writes:
      - project:qa/improvements/**
      - project:qa/improvements/drafts/**
    authorization_writes:
      - project:qa/improvements/events.jsonl
      - project:qa/improvements/improvements.json
      - project:qa/improvements/review-queue.json
      - project:qa/improvements/drafts/**
    synchronized:
      - project:qa/improvements/**
    exclusive:
      - project:improvement-registry
    retryable_errors: [conflict, transport]

  operation:record-change-improvement-applied:
    handler: operation
    reads:
      - project:qa/improvements/**
      - project:qa/improvements/drafts/**
    writes:
      - project:qa/improvements/**
    authorization_writes:
      - project:qa/improvements/events.jsonl
      - project:qa/improvements/improvements.json
      - project:qa/improvements/review-queue.json
    synchronized:
      - project:qa/improvements/**
    exclusive:
      - project:improvement-registry
    retryable_errors: [conflict, transport]

  operation:export-knowledge-improvement:
    handler: operation
    reads:
      - project:qa/improvements/**
      - project:qa/retro/*/context.json
      - project:qa/issues/**
    writes:
      - project:qa/improvements/**
      - project:qa/improvements/knowledge-delta/**
    authorization_writes:
      - project:qa/improvements/events.jsonl
      - project:qa/improvements/improvements.json
      - project:qa/improvements/review-queue.json
      - project:qa/improvements/knowledge-delta/**
    synchronized:
      - project:qa/improvements/**
    exclusive:
      - project:improvement-registry
    retryable_errors: [conflict, transport]

  operation:record-knowledge-improvement-applied:
    handler: operation
    reads:
      - project:qa/improvements/**
      - project:qa/improvements/knowledge-delta/**
      - repo:.aa/data-knowledge.yaml
    writes:
