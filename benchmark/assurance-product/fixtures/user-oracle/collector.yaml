receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:0
processors:
  transform:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "db.statement")
          - delete_key(attributes, "db.query.text")
          - delete_key(attributes, "db.statement.parameters")
          - delete_key(attributes, "db.query.parameter")
          - delete_key(attributes, "http.request.header.authorization")
          - delete_key(attributes, "http.request.header.token")
          - delete_key(attributes, "http.request.header.cookie")
          - delete_matching_keys(attributes, "(?i).*(password|passwd|secret|authorization|token).*")
exporters:
  file:
    path: /tmp/traces.jsonl
    format: json
    flush_interval: 200ms
extensions:
  health_check:
    endpoint: 127.0.0.1:0
    path: /
    response_body:
      healthy: '{"probe_nonce":"uninitialized","execution_id":"uninitialized"}'
      unhealthy: '{"status":"unhealthy"}'
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform]
      exporters: [file]
  telemetry:
    metrics:
      level: none
    logs:
      level: error
      output_paths: [stderr]
