name: L2-performance-codegen-seed
extends: L1-plan-seed
description: Performance codegen seed with full assurance predecessor chain
repo_paths:
- .aa/config.yaml
- .aa/data-knowledge.yaml
- tests/testdata/domain/api.py
- tests/testdata/domain/__init__.py
paths:
- codegen
- tests/config.py
- tests/conftest.py
- tests/schema_validation.py
- tests/perf
- cases/system/performance
- plans/performance-plan.md
- plans/performance-codegen-plan.md
- plans/performance-review-summary.md
- review/performance-plan-review.json
- review/performance-plan-review-summary.md
- review/performance-plan-checks.json
resets:
  workflow_state:
    phases.execution.status: pending
  qa_yaml:
    test_types:
    - performance
imports:
  execute:
    entrypoint: execute
    inputs:
    - change:proposal.md
    - change:.qa.yaml
    completed:
    - path: execute-workflow/bootstrap/bootstrap
      graph: bootstrap
      node: registry
      outputs:
      - change:registry/skill-registry-check.json
      gate: registry-gate
    - path: execute-workflow/assurance/assurance/performance/performance-branch/review-cycle/performance-plan-cycle
      graph: performance-plan-cycle
      node: applicability
    - path: execute-workflow/assurance/assurance/performance/performance-branch/review-cycle/performance-plan-cycle
      graph: performance-plan-cycle
      node: review
      outputs:
      - change:review/performance-plan-review.json
      - change:review/performance-plan-review-summary.md
      - change:review/performance-plan-checks.json
    - path: execute-workflow/assurance/assurance/performance/performance-branch/review-cycle/performance-plan-cycle
      graph: performance-plan-cycle
      node: review-gate
      gate: performance-plan-review-gate
    - path: execute-workflow/assurance/assurance/performance/performance-branch
      graph: performance-branch
      node: review-cycle
    - path: execute-workflow/assurance/assurance/performance/performance-branch
      graph: performance-branch
      node: codegen-precheck
      gate: performance-codegen-precondition-gate
    - path: execute-workflow/assurance/assurance/performance/performance-branch
      graph: performance-branch
      node: codegen
      outputs:
      - change:codegen/performance-codegen-summary.md
      - change:codegen/performance-generated-files.json
    - path: execute-workflow/assurance/assurance
      graph: assurance
      node: performance
