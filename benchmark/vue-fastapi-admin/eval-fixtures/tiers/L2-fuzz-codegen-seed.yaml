name: L2-fuzz-codegen-seed
extends: L1-plan-seed
description: Fuzz codegen seed with full assurance predecessor chain
paths:
- codegen
- tests/config.py
- tests/conftest.py
- tests/schema_validation.py
- tests/fuzz
- cases/system/fuzz
- plans/fuzz-plan.md
- plans/fuzz-codegen-plan.md
- plans/fuzz-review-summary.md
resets:
  workflow_state:
    phases.execution.status: pending
  qa_yaml:
    test_types:
    - fuzz
imports:
  execute:
    entrypoint: execute
    inputs:
    - change:proposal.md
    - change:.qa.yaml
    completed:
    - path: execute-workflow/bootstrap/bootstrap
      graph: bootstrap
      node: registry
      outputs:
      - change:registry/skill-registry-check.json
      gate: registry-gate
    - path: execute-workflow/assurance/assurance/fuzz/fuzz-branch/review-cycle/fuzz-plan-cycle
      graph: fuzz-plan-cycle
      node: applicability
    - path: execute-workflow/assurance/assurance/fuzz/fuzz-branch/review-cycle/fuzz-plan-cycle
      graph: fuzz-plan-cycle
      node: review
      outputs:
      - change:review/fuzz-plan-review.json
      - change:review/fuzz-plan-review-summary.md
    - path: execute-workflow/assurance/assurance/fuzz/fuzz-branch/review-cycle/fuzz-plan-cycle
      graph: fuzz-plan-cycle
      node: mechanical-plan-checks
      outputs:
      - change:review/fuzz-plan-checks.json
    - path: execute-workflow/assurance/assurance/fuzz/fuzz-branch/review-cycle/fuzz-plan-cycle
      graph: fuzz-plan-cycle
      node: review-gate
      gate: fuzz-plan-review-gate
    - path: execute-workflow/assurance/assurance/fuzz/fuzz-branch
      graph: fuzz-branch
      node: review-cycle
    - path: execute-workflow/assurance/assurance/fuzz/fuzz-branch
      graph: fuzz-branch
      node: codegen-precheck
      gate: fuzz-codegen-precondition-gate
    - path: execute-workflow/assurance/assurance/fuzz/fuzz-branch
      graph: fuzz-branch
      node: codegen
      outputs:
      - change:codegen/fuzz-codegen-summary.md
      - change:codegen/fuzz-generated-files.json
    - path: execute-workflow/assurance/assurance
      graph: assurance
      node: fuzz
