name: L1-plan-seed
extends: L0-case-seed
description: Plans reviewed; ready for codegen
paths:
- plans
- review
resets:
  workflow_state:
    phases.api-plan.status: done
    phases.e2e-plan.status: done
    phases.api-codegen.status: pending
imports:
  execute:
    entrypoint: execute
    inputs:
    - change:proposal.md
    - change:.qa.yaml
    - change:cases/system/api/case.yaml
    - change:facts/fact-baseline.json
    completed:
    - path: execute-workflow/bootstrap/bootstrap
      graph: bootstrap
      node: registry
      outputs:
      - change:registry/skill-registry-check.json
      gate: registry-gate
    - path: execute-workflow/assurance/assurance
      graph: assurance
      node: fact-baseline
      outputs:
      - change:facts/fact-baseline.json
    - path: execute-workflow/assurance/assurance/api/api-branch
      graph: api-branch
      node: plan
      outputs:
      - change:plans/api-plan.md
      - change:plans/api-test-data-plan.md
      - change:plans/api-codegen-plan.md
      - change:plans/m3-review-summary.md
    - path: execute-workflow/assurance/assurance/api/api-branch/review-cycle/api-plan-cycle
      graph: api-plan-cycle
      node: review
      outputs:
      - change:review/api-plan-review.json
      - change:review/api-plan-checks.json
      gate: api-plan-review-gate
    - path: execute-workflow/assurance/assurance/api/api-branch
      graph: api-branch
      node: review-cycle
    - path: execute-workflow/assurance/assurance/e2e/e2e-branch
      graph: e2e-branch
      node: plan
      outputs:
      - change:plans/e2e-plan.md
      - change:plans/e2e-test-data-plan.md
      - change:plans/e2e-codegen-plan.md
      - change:plans/m4-review-summary.md
    - path: execute-workflow/assurance/assurance/e2e/e2e-branch/review-cycle/e2e-plan-cycle
      graph: e2e-plan-cycle
      node: review
      outputs:
      - change:review/plan-review.json
      gate: e2e-plan-review-gate
    - path: execute-workflow/assurance/assurance/e2e/e2e-branch
      graph: e2e-branch
      node: review-cycle
