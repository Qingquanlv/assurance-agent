name: L2-fuzz-codegen-pending
extends: L1-assurance-input-ready
description: Fuzz plan-ready / codegen-pending (dormant until Task 22)
expected_layers:
- fuzz
paths:
- plans/fuzz-plan.md
- plans/fuzz-codegen-plan.md
- plans/fuzz-review-summary.md
- cases/system/fuzz
- tests/config.py
- tests/conftest.py
- tests/schema_validation.py
resets:
  workflow_state:
    phases.fuzz-plan.status: done
    phases.fuzz-codegen.status: pending
    phases.execution.status: pending
  qa_yaml:
    test_types:
    - fuzz
imports:
  execute:
    entrypoint: execute
    inputs:
    - change:plans/fuzz-plan.md
    - change:plans/fuzz-codegen-plan.md
    - change:cases/system/fuzz/case.yaml
    completed: []
