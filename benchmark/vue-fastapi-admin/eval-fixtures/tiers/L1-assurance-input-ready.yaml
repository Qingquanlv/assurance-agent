name: L1-assurance-input-ready
description: Independent plan-ready base without complete-tier ancestry
source_prefix: samples/eval-sample-001
paths:
- proposal.md
- cases
- facts
- explore
- registry
- healing
- workflow-state.yaml
- .qa.yaml
repo_paths:
- .aa/config.yaml
- .aa/data-knowledge.yaml
- tests/testdata/domain/api.py
- tests/testdata/domain/__init__.py
resets:
  workflow_state:
    phases.skill_registry_check.status: pass
    run_context.interaction_mode: autonomous
    run_context.orchestrator_skill: aa-workflow
    phases.case-design.status: done
    phases.case-review.status: done
    phases.api-plan.status: pending
    phases.api-codegen.status: pending
  qa_yaml:
    approval.mode: autonomous
imports:
  execute:
    entrypoint: execute
    inputs:
    - change:proposal.md
    - change:.qa.yaml
    - change:facts/fact-baseline.json
    completed:
    - path: execute-workflow/bootstrap/bootstrap
      graph: bootstrap
      node: registry
      outputs:
      - change:registry/skill-registry-check.json
      gate: registry-gate
    - path: execute-workflow/assurance/assurance
      graph: assurance
      node: fact-baseline
      outputs:
      - change:facts/fact-baseline.json
