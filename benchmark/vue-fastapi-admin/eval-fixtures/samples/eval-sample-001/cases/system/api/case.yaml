- case_id: TC_APIS_API_007
  title: refresh 同步带鉴权依赖的路由注册表
  priority: P0
  severity: critical
  type: API
  test_condition_id: COND-APIS-007
  design_technique: state_transition
  objective: 验证 refresh 接口根据 app.routes 中带 DependPermission 的路由同步数据库 API 表。
  summary: 管理员触发 refresh 后，数据库记录应与当前注册路由集合保持一致，并清理不在注册表中的记录。
  preconditions:
  - 系统中存在具备 API 管理权限的管理员账号
  - 应用已加载带鉴权依赖的 APIRoute
  test_data:
  - 记录 refresh 前数据库中与注册路由相关的记录快照
  steps:
  - 以管理员身份触发 refresh 请求
  - 查询列表核对同步结果
  assertions:
  - 接口返回 HTTP 200 且业务码为 200
  - 注册路由对应的 path+method 在列表中存在且 summary/tags 与路由元数据一致
  - 不在注册表中的旧记录被移除或可观测
  - 不得返回 5xx
  postconditions:
  - refresh 可能修改数据库 API 表，teardown 需评估影响
  edge_cases:
  - 连续两次 refresh 结果应幂等
  related_cases: []
  risk:
    likelihood: 4
    impact: 5
    level: critical
    rationale: refresh 是 API 权限体系与 OpenAPI 注册一致性的关键同步点。
  status: draft
  module: system.api
  requirement_id: RET-api-management
  feature_name: api-management
  tags: []
  automation:
    required: true
    framework: pytest
    status: planned
    confirmed_by: null
    confirmed_at: null
  regression:
    candidate: true
    tier: smoke
    selection_reason:
    - critical_user_journey
    - high_risk
    maintenance_rule: keep_until_feature_deprecated
    rationale: P0 API 覆盖，纳入 smoke 回归集。
  trace:
    minimum_required_coverage:
    - refresh_api
    - refresh_sync_consistency
- case_id: TC_APIS_API_008
  title: 未授权访问 API 管理接口被拒绝
  priority: P0
  severity: blocker
  type: API
  test_condition_id: COND-APIS-008
  design_technique: negative
  objective: 验证未携带有效 token 或无权限用户访问 API 管理接口时被拒绝。
  summary: 未认证或无权访问时，接口应返回 401 或 403，不得返回 200 成功业务数据。
  preconditions:
  - API 管理路由受 DependPermission 保护
  test_data:
  - 准备无 token 请求
  - 可选准备无 API 管理权限的普通用户 token
  steps:
  - 不携带 token 访问 list 或 create 等管理接口
  - 可选使用普通用户 token 访问管理接口
  assertions:
  - 响应状态为 401 或 403
  - 不得返回 200 且带有完整管理数据
  - 不得返回 5xx
  postconditions:
  - 负向探测不修改业务数据
  edge_cases:
  - 对不同端点重复未授权探测
  related_cases: []
  risk:
    likelihood: 4
    impact: 5
    level: critical
    rationale: 鉴权失效将暴露 API 元数据管理能力。
  status: draft
  module: system.api
  requirement_id: RET-api-management
  feature_name: api-management
  tags: []
  automation:
    required: true
    framework: pytest
    status: planned
    confirmed_by: null
    confirmed_at: null
  regression:
    candidate: true
    tier: smoke
    selection_reason:
    - security_related
    - critical_user_journey
    maintenance_rule: keep_until_feature_deprecated
    rationale: P0 API 覆盖，纳入 smoke 回归集。
  trace:
    minimum_required_coverage:
    - unauthorized_access
    - unauthorized_api_access
