schema_version: '1.0'
added:
- case_id: TC_APIS_API_001
  title: 管理员成功创建 API 元数据记录
  priority: P0
  severity: blocker
  type: API
  test_condition_id: COND-APIS-001
  design_technique: use_case
  objective: 验证具备权限的管理员可创建包含 path、method、summary、tags 的 API 元数据记录。
  summary: 管理员提交完整 ApiCreate 载荷后，系统应持久化记录并返回创建成功。
  preconditions:
  - 系统中存在具备 API 管理权限的管理员账号
  - 目标 path+method 组合尚未被本用例占用
  test_data:
  - 使用唯一 path 与合法 MethodType 枚举值构造 ApiCreate 载荷
  - 记录创建后的 api id 供后续步骤使用
  steps:
  - 以管理员身份提交创建 API 请求
  - 查询列表或详情确认新记录存在
  assertions:
  - 接口返回 HTTP 200 且业务码为 200
  - 列表或详情中可找到与提交 path、method、summary、tags 一致的记录
  - 不得返回 5xx
  postconditions:
  - 本用例创建的记录在 teardown 中清理
  edge_cases:
  - 重复提交相同 path+method 的创建请求
  related_cases: []
  risk:
    likelihood: 4
    impact: 5
    level: critical
    rationale: API 元数据创建是权限体系与路由注册的基础能力。
  status: draft
  module: system.api
  requirement_id: RET-api-management
  feature_name: api-management
  tags: []
  automation:
    required: true
    framework: pytest
    status: planned
    confirmed_by: null
    confirmed_at: null
  regression:
    candidate: true
    tier: smoke
    selection_reason:
    - critical_user_journey
    - newly_added_feature
    maintenance_rule: keep_until_feature_deprecated
    rationale: P0 API 覆盖，纳入 smoke 回归集。
  trace:
    minimum_required_coverage:
    - create_api
- case_id: TC_APIS_API_002
  title: API 列表分页与默认查询
  priority: P0
  severity: critical
  type: API
  test_condition_id: COND-APIS-002
  design_technique: use_case
  objective: 验证 API 列表接口支持分页参数并返回分页元数据。
  summary: 管理员查询 API 列表时，系统应返回 data 数组及 total、page、page_size 字段。
  preconditions:
  - 系统中存在具备 API 管理权限的管理员账号
  - 列表中至少存在一条 API 记录或允许空列表
  test_data:
  - 使用默认 page=1、page_size=10 查询列表
  steps:
  - 以管理员身份请求 API 列表
  - 检查响应体分页字段与 data 数组
  assertions:
  - 接口返回 HTTP 200 且业务码为 200
  - 响应包含 data、total、page、page_size 字段
  - data 为数组类型
  postconditions: []
  edge_cases:
  - page_size 为 0 或极大值
  - page 超出末页
  related_cases:
  - TC_APIS_API_001
  risk:
    likelihood: 3
    impact: 4
    level: high
    rationale: 列表是分页管理与后续 CRUD 操作的入口。
  status: draft
  module: system.api
  requirement_id: RET-api-management
  feature_name: api-management
  tags: []
  automation:
    required: true
    framework: pytest
    status: planned
    confirmed_by: null
    confirmed_at: null
  regression:
    candidate: true
    tier: smoke
    selection_reason:
    - critical_user_journey
    maintenance_rule: keep_until_feature_deprecated
    rationale: P0 API 覆盖，纳入 smoke 回归集。
  trace:
    minimum_required_coverage:
    - list_api
- case_id: TC_APIS_API_003
  title: API 列表 path/summary/tags 条件过滤
  priority: P1
  severity: major
  type: API
  test_condition_id: COND-APIS-003
  design_technique: boundary_value_analysis
  objective: 验证 API 列表支持按 path、summary、tags 子串过滤。
  summary: 管理员携带过滤参数查询列表时，返回记录应匹配过滤条件。
  preconditions:
  - 系统中存在具备 API 管理权限的管理员账号
  - 存在可匹配与不匹配过滤条件的 API 记录
  test_data:
  - 准备一条 tags 可识别的 API 记录
  - 准备不匹配过滤条件的对照记录
  steps:
  - 分别以 path、summary、tags 过滤参数查询列表
  - 对比返回记录是否满足过滤语义
  assertions:
  - 接口返回 HTTP 200 且业务码为 200
  - 匹配过滤条件的记录出现在结果中
  - 不匹配的记录不应出现在对应过滤结果中
  - 空过滤参数时行为与默认列表一致
  postconditions:
  - 过滤查询不修改数据
  edge_cases:
  - 过滤关键字为空字符串
  - 过滤关键字为不存在子串
  related_cases:
  - TC_APIS_API_001
  risk:
    likelihood: 3
    impact: 3
    level: medium
    rationale: 条件查询影响管理员定位 API 元数据的效率。
  status: draft
  module: system.api
  requirement_id: RET-api-management
  feature_name: api-management
  tags: []
  automation:
    required: true
    framework: pytest
    status: planned
    confirmed_by: null
    confirmed_at: null
  regression:
    candidate: true
    tier: regression
    selection_reason:
    - contract_boundary
    maintenance_rule: keep_until_feature_deprecated
    rationale: P1 API 覆盖，纳入 regression 回归集。
  trace:
    minimum_required_coverage:
    - filter_boundary_values
- case_id: TC_APIS_API_004
  title: 按有效 id 查询 API 详情
  priority: P1
  severity: major
  type: API
  test_condition_id: COND-APIS-004
  design_technique: use_case
  objective: 验证 get 接口可按有效 id 返回 API 详情。
  summary: 管理员查询存在的 api id 时，系统应返回完整元数据字段。
