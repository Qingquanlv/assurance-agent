- case_id: TC_APIS_API_012
  title: 相同 path+method 重复创建行为探测
  priority: P2
  severity: minor
  type: API
  test_condition_id: COND-APIS-012
  design_technique: exploratory
  objective: 探测相同 path+method 重复创建时的系统行为（模型无唯一约束，采用中性断言）。
  summary: 在已知无 path+method 唯一约束的前提下，记录重复创建是可接受、拒绝或可观测重复。
  preconditions:
  - 系统中存在具备 API 管理权限的管理员账号
  test_data:
  - 准备一条已存在的 path+method 组合
  steps:
  - 以相同 path+method 再次提交创建请求
  - 查询列表统计匹配记录数量
  assertions:
  - 响应为 4xx 或 200 均可接受，但须可观测且不得 5xx
  - 记录实际行为（拒绝或允许多条）供回归基线
  postconditions:
  - 探测创建的记录在 teardown 中清理
  edge_cases:
  - 第三次重复创建
  related_cases:
  - TC_APIS_API_001
  risk:
    likelihood: 2
    impact: 2
    level: low
    rationale: 无唯一约束时重复数据可能影响权限展示，需建立可观测基线。
  status: draft
  module: system.api
  requirement_id: RET-api-management
  feature_name: api-management
  tags: []
  automation:
    required: true
    framework: pytest
    status: planned
    confirmed_by: null
    confirmed_at: null
  regression:
    candidate: false
    tier: none
    selection_reason: []
    maintenance_rule: keep_until_feature_deprecated
    rationale: P2 API 覆盖，纳入 none 回归集。
  trace:
