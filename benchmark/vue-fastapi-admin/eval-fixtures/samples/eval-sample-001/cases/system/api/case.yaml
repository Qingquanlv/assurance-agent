- case_id: TC_APIS_API_005
  title: 更新 API 元数据字段
  priority: P1
  severity: major
  type: API
  test_condition_id: COND-APIS-005
  design_technique: state_transition
  objective: 验证 update 接口可修改 API 的 summary、tags 等元数据并保持 path+method 一致。
  summary: 管理员提交 ApiUpdate 后，详情应反映更新后的字段值。
  preconditions:
  - 系统中存在具备 API 管理权限的管理员账号
  - 目标 API 记录已存在
  test_data:
  - 准备一条 API 记录
  - 构造包含新 summary 与 tags 的 ApiUpdate 载荷
  steps:
  - 以管理员身份提交更新请求
  - 再次查询详情核对字段变化
  assertions:
  - 接口返回 HTTP 200 且业务码为 200
  - 详情中 summary、tags 已更新
  - path 与 method 保持与更新前一致或可观测的更新后值
  postconditions:
  - 更新后的记录在 teardown 中恢复或清理
  edge_cases:
  - 仅更新 summary 或仅更新 tags
  related_cases:
  - TC_APIS_API_001
  risk:
    likelihood: 3
    impact: 4
    level: high
    rationale: 元数据更新错误会导致权限展示与路由描述不一致。
  status: draft
  module: system.api
  requirement_id: RET-api-management
  feature_name: api-management
  tags: []
  automation:
    required: true
    framework: pytest
    status: planned
    confirmed_by: null
    confirmed_at: null
  regression:
    candidate: true
    tier: regression
    selection_reason:
    - high_risk
    - contract_boundary
    maintenance_rule: keep_until_feature_deprecated
    rationale: P1 API 覆盖，纳入 regression 回归集。
  trace:
    minimum_required_coverage:
    - update_api
    - path_method_metadata_consistency
- case_id: TC_APIS_API_006
  title: 删除 API 记录
  priority: P1
  severity: major
  type: API
  test_condition_id: COND-APIS-006
  design_technique: use_case
  objective: 验证 delete 接口可删除指定 API 记录。
  summary: 管理员删除存在的 api id 后，列表与详情中不应再出现该记录。
  preconditions:
  - 系统中存在具备 API 管理权限的管理员账号
  - 存在专用于删除的 API 记录
  test_data:
  - 创建一条待删除的 API 记录并记录 id
  steps:
  - 以管理员身份提交删除请求
  - 查询列表或详情确认记录不存在
  assertions:
  - 接口返回 HTTP 200 且业务码为 200
  - 列表与 get 详情均不再包含该 id
  postconditions:
  - 记录已从系统中移除
  edge_cases:
