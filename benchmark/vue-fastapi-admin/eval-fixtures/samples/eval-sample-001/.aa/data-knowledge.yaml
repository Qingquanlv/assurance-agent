version: 1
auth:
  api_admin_token:
    method: token
    symbol: tests.api.conftest.admin_token
    acquire:
      operation: login_token
      path: /api/v1/base/access_token
    notes: 'header: token'
capabilities:
  domain_factories:
    api:
      make_api:
        kind: async_factory
        symbol: tests.testdata.domain.api.make_api
        entity: api
        returns:
          id_attr: id
          path_attr: path
          method_attr: method
        cleanup_ref: cleanup.api_delete
      cleanup_api:
        kind: async_factory
        symbol: tests.testdata.domain.api.cleanup_api
        retry_safe: true
      list_auth_routes:
        kind: async_factory
        symbol: tests.testdata.domain.api.list_auth_routes
        notes: Reads app.routes with DependPermission for refresh assertions
  adapters:
    fuzz:
      api:
        seed_api:
          kind: isolated_worker
          symbol: tests.fuzz.adapters.api.seed_api
          create-if-missing: true
    performance:
      api:
        seed_api:
          kind: isolated_worker
          symbol: tests.perf.adapters.api.seed_api
          create-if-missing: true
cleanup:
  api_delete:
    kind: async_factory
    symbol: tests.testdata.domain.api.cleanup_api
