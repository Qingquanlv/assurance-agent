version: 1

project:
  name: vue-fastapi-admin
  root: .
  layout: default

sources:
  frontend: ./web
  backend: ./app

qa:
  cases: ./qa/cases
  changes: ./qa/changes

tests:
  root: ./tests
  api: ./tests/api
  e2e: ./tests/e2e
  fuzz: ./tests/fuzz
  fixtures: ./tests/fixtures
  helpers: ./tests/helpers
  reports: ./tests/reports

frameworks:
  api:
    enabled: true
    name: pytest
  e2e:
    enabled: true
    name: playwright

workflow:
  primary_runner: skill
  agent: opencode
  agents:
    claude_code: false
    codex: false

mcp:
  enabled: false

generation:
  prd_input_mode: prompt
  e2e:
    default_pom: false
    locator_priority:
      - role
      - label
      - testid
      - css
  api:
    prefer_existing_fixtures: true

execution:
  entry: cli
  self_healing:
    mode: proposal-only

coverage:
  enabled: true
  gate_mode: warn
  target_package: app
  threshold:
    line: 70
    branch: 60

performance:
  enabled: true
  base_url: http://127.0.0.1:9999
