[project]
name = "test-six-wheel-product"
version = "1.0.0"
description = "Test-only six-wheel product for OpenCode composition"
requires-python = ">=3.11,<4.0"
dependencies = [
    "graph-engine",
    "langgraph==1.2.11",
]

[project.entry-points."graph_engine.products"]
six-wheel-opencode = "test_six_wheel_product.product:SixWheelOpenCodeProduct"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["test_six_wheel_product"]
