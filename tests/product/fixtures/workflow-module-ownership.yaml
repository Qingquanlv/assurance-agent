product_to_intake_relocation:
  source_graph: full
  destination_export: intake.prepare
  prefix_nodes:
  - intake
  - explore
  - case-design
  - case-review
  - review-pass-gate
  - review-fix-gate
  - review-human-gate
  - human-review
  prefix_internal_edges:
  - from: intake
    to: explore
  - from: explore
    to: case-design
  - from: case-design
    to: case-review
  - from: case-review
    to: review-pass-gate
  - from: case-review
    to: review-fix-gate
  - from: case-review
    to: review-human-gate
  - from: review-fix-gate
    to: case-design
    condition: output.value == true
  - from: review-human-gate
    to: human-review
    condition: output.value == true
  continuation_edges:
  - from: review-pass-gate
    to: generation
    condition: output.value == true
  - from: human-review
    to: generation
  public_terminal_boundary: intake.prepare
  constraint: Legacy continuation edges into generation become the intake.prepare public terminal boundary.
    No semantic expression or action change is allowed before Task 26.
