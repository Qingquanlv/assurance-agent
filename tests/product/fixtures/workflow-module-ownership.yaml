# Reviewed inventory of today's assembled Assurance Workflow.
# Owners are Feature/Product responsibility assignments, not a dump of
# implementation types. The golden writer must not invent these owners.
#
# This file is the input-boundary and relocation inventory for Tasks 18-25:
# public export targets, local subgraph calls, root_pointer reads per
# exported closure, and the legacy full prefix that relocates behind
# intake.prepare.
owners:
  intake:
    graphs:
    - entry
    - case
    - intake
    - explore
    - case-design
    - case-review
    exports:
      prepare:
        target: entry
      case:
        target: case
  generation:
    graphs:
    - generation
    - generation-api
    - generation-api-plan
    - generation-api-plan-review
    - generation-api-codegen
    - generation-api-codegen-fix
    - generation-e2e
    - generation-e2e-plan
    - generation-e2e-plan-review
    - generation-e2e-codegen
    - generation-e2e-codegen-fix
    - generation-fuzz
    - generation-fuzz-plan
    - generation-fuzz-plan-review
    - generation-fuzz-codegen
    - generation-performance
    - generation-performance-plan
    - generation-performance-plan-review
    - generation-performance-codegen
    exports:
      generate:
        target: generation
  execution:
    graphs:
    - execution-execute
    - execution-run
    exports:
      execute:
        target: execution-execute
      rerun:
        target: execution-run
  healing:
    graphs:
    - healing-fix-proposal
    - healing-coverage-repair
    exports:
      repair-failure:
        target: healing-fix-proposal
      repair-coverage:
        target: healing-coverage-repair
  quality:
    graphs:
    - quality
    - quality-fact-baseline
    - quality-inspect
    - quality-issue-triage
    - quality-issue-analysis
    - quality-report
    - issue-review
    - issue-analyze
    - issue-reconcile
    exports:
      assess:
        target: quality
      issue-review:
        target: issue-review
      issue-analyze:
        target: issue-analyze
      issue-reconcile:
        target: issue-reconcile
      report:
        target: quality-report
  improvement:
    graphs:
    - archive
    - improvement-archive
    - retro
    - improvement-retro
    - improvement-retro-eval-analysis
    - improvement-retro-issue-analysis
    - improvement-retro-workflow-analysis
    - improvement-review
    - improvement-evaluate
    - improvement-export
    - improvement-apply
    - improvement-rollback
    exports:
      archive:
        target: archive
      retro:
        target: retro
      review:
        target: improvement-review
      evaluate:
        target: improvement-evaluate
      export:
        target: improvement-export
      apply:
        target: improvement-apply
      rollback:
        target: improvement-rollback
  product:
    graphs:
    - full
    - execute
