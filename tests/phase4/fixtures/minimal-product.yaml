schema_version: "1"
product_id: toy.a
product_version: "1.0.0"
engine_api: "2.0"
plugins:
  - plugin_id: toy.a
    version_specifier: "==1.0.0"
entrypoints:
  hello: root
configuration: {}
workflow:
  name: toy-a
  entrypoints:
    hello: root
  retry:
    once:
      max_attempts: 2
      retry_on:
        - transient
  timeout:
    short:
      run_seconds: 5
  graphs:
    root:
      max_activations: 2
      start: greet
      nodes:
        greet:
          kind: task
          capability: toy.a.greet
          input:
            name: Ada
          retry: once
          timeout: short
          resources:
            writes:
              - greeting.txt
        done:
          kind: end
      edges:
        - from: greet
          to: done
