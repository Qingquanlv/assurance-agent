name: phase4-six-wheel-fixture
entrypoints:
  fixture: root
retry:
  once:
    max_attempts: 1
timeout:
  short:
    run_seconds: 30
graphs:
  root:
    max_activations: 4
    start: prepare
    nodes:
      prepare:
        kind: task
        capability: test.assurance.bindings.prepare
        input:
          change_id: CH-DEMO-001
          capability_leafs:
            - auth.session.create
            - entities.item.create
          case_delta_paths:
            - qa/changes/CH-DEMO-001/cases/system/menu/case.yaml
          artifact_paths: []
        retry: once
        timeout: short
      execute:
        kind: task
        capability: test.assurance.bindings.execute
        input: {}
        retry: once
        timeout: short
      finalize:
        kind: task
        capability: test.assurance.bindings.finalize
        input:
          capability_leafs:
            - auth.session.create
            - entities.item.create
          artifact_paths: []
        retry: once
        timeout: short
      done:
        kind: end
    edges:
      - from: prepare
        to: execute
      - from: execute
        to: finalize
      - from: finalize
        to: done
