[project]
name = "test-assurance-phase4-product"
version = "1.0.0"
description = "Test-only six-wheel product for OpenCode composition"
requires-python = ">=3.11,<4.0"
dependencies = [
    "graph-engine",
    "langgraph==1.2.11",
]

[project.entry-points."graph_engine.products"]
phase4-opencode = "test_assurance_phase4_product.product:Phase4OpenCodeProduct"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["test_assurance_phase4_product"]
