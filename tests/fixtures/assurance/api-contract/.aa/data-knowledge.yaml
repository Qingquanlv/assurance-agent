version: 1
auth:
  api_admin_token:
    method: token
    symbol: tests.conftest.api_admin_token
    notes: admin token for account API
capabilities:
  domain_factories:
    account:
      make_account:
        kind: async_factory
        symbol: tests.testdata.domain.account.make_account
        entity: account
        cleanup_ref: cleanup.account_delete
      cleanup_account:
        kind: async_factory
        symbol: tests.testdata.domain.account.cleanup_account
        retry_safe: true
  adapters:
    api:
      account:
        seed_account:
          kind: isolated_worker
          symbol: tests.api.adapters.account.seed_account
          create-if-missing: true
        cleanup_account:
          kind: isolated_worker
          symbol: tests.api.adapters.account.cleanup_account
          create-if-missing: true
