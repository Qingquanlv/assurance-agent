version: 1
auth:
  api_admin_token:
    method: token
    symbol: tests.conftest.api_admin_token
    notes: reused by fuzz adapter for authenticated endpoint calls
capabilities:
  domain_factories:
    account:
      make_account:
        kind: async_factory
        symbol: tests.testdata.domain.account.make_account
        entity: account
        cleanup_ref: cleanup.account_delete
  adapters:
    fuzz:
      account:
        seed_account:
          kind: isolated_worker
          symbol: tests.fuzz.adapters.account.seed_account
          create-if-missing: true
